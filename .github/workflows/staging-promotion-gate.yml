name: Staging promotion gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

jobs:
  staging-promotion:
    name: Staging promotion gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Require the repository staging branch or a pinned release cut
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::Production accepts only a promotion PR from this repository's staging branch or a release/<sha> cut. Retarget the feature PR to staging first."
            exit 1
          fi

          if [ "$HEAD_REF" = "staging" ]; then
            STAGING_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/staging" --jq '.object.sha')
            if [ "$STAGING_SHA" != "$HEAD_SHA" ]; then
              echo "::error::The promotion PR head is stale: PR=$HEAD_SHA staging=$STAGING_SHA. Update the PR before promotion."
              exit 1
            fi
            echo "mode=staging" >> "$GITHUB_OUTPUT"
          elif [[ "$HEAD_REF" =~ ^release/([0-9a-f]{7,40})$ ]]; then
            # A pinned cut: the branch name pins the exact staging commit it carries.
            PIN=${BASH_REMATCH[1]}
            if [[ "$HEAD_SHA" != "$PIN"* ]]; then
              echo "::error::Release branch $HEAD_REF must point at the commit it names, but its head is $HEAD_SHA."
              exit 1
            fi
            # The cut must already be part of staging (equal to or behind the staging tip).
            RELATION=$(gh api "repos/$GITHUB_REPOSITORY/compare/$HEAD_SHA...staging" --jq '.status')
            if [ "$RELATION" != "identical" ] && [ "$RELATION" != "ahead" ]; then
              echo "::error::Release cut $HEAD_SHA is not contained in staging (compare status: $RELATION). Only a commit that staging already integrated can be promoted."
              exit 1
            fi
            echo "mode=release" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Production accepts only a promotion PR from this repository's staging branch or a release/<sha> cut. Retarget the feature PR to staging first."
            exit 1
          fi

      - name: Check out full history for the merge-tree comparison
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Require the merge result to deploy exactly the smoked tree
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Staging evidence is for HEAD_SHA's tree. If main gained a change of its
          # own (a hotfix) that the cut does not contain, merging would deploy a
          # tree no staging smoke ever ran. An identical change (same tree, other
          # SHA) is fine, as with #2674 under #2672.
          CUT_TREE=$(git rev-parse "$HEAD_SHA^{tree}")
          if ! MERGE_OUT=$(git merge-tree --write-tree "origin/$BASE_REF" "$HEAD_SHA"); then
            echo "::error::Merging $HEAD_SHA into $BASE_REF conflicts. Cut a new release from staging that already contains $BASE_REF's changes."
            exit 1
          fi
          MERGE_TREE=${MERGE_OUT%%$'\n'*}
          if [ "$MERGE_TREE" != "$CUT_TREE" ]; then
            echo "::error::Merging $HEAD_SHA into $BASE_REF would deploy a tree that differs from the smoked cut. Bring $BASE_REF's own changes into staging, cut a new release and re-verify staging."
            git diff --stat "$CUT_TREE" "$MERGE_TREE" | tail -20
            exit 1
          fi
          echo "Merge result tree $MERGE_TREE equals the smoked tree of $HEAD_SHA."

      - name: Require green integrated staging evidence for the exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MODE: ${{ steps.head.outputs.mode }}
        run: |
          REQUIRED_WORKFLOWS=(
            "backend-tests.yml|Backend (pytest + anchor drift)|Frontend (node --test)"
            "spec-governance.yml|Spec and PR metadata"
            "typecheck.yml|TypeScript strict + legacy JSDoc|api.d.ts ↔ OpenAPI drift"
            "route-manifest.yml|Build + verify routes-manifest ownership"
            "legacy-freeze.yml|Public không chứa HTML legacy"
            "staging-release-smoke.yml|Staging release smoke"
          )

          for ATTEMPT in $(seq 1 80); do
            if [ "$MODE" = "release" ]; then
              CUT_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$HEAD_REF" --jq '.object.sha')
              if [ "$CUT_SHA" != "$HEAD_SHA" ]; then
                echo "::error::Release branch $HEAD_REF moved while this promotion was waiting: PR=$HEAD_SHA branch=$CUT_SHA."
                exit 1
              fi
            else
              STAGING_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/staging" --jq '.object.sha')
              if [ "$STAGING_SHA" != "$HEAD_SHA" ]; then
                echo "::error::Staging advanced while this promotion was waiting: PR=$HEAD_SHA staging=$STAGING_SHA."
                exit 1
              fi
            fi

            PENDING=0
            for SPEC in "${REQUIRED_WORKFLOWS[@]}"; do
              IFS='|' read -r -a PARTS <<<"$SPEC"
              WORKFLOW=${PARTS[0]}
              RUNS=$(gh api \
                "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW/runs?branch=staging&event=push&head_sha=$HEAD_SHA&per_page=100")
              RUN=$(jq -r --arg sha "$HEAD_SHA" \
                '[.workflow_runs[] | select(.head_sha == $sha)] | first | if . == null then "missing::" else ((.id | tostring) + ":" + .status + ":" + (.conclusion // "")) end' \
                <<<"$RUNS")
              IFS=: read -r RUN_ID RUN_STATUS RUN_CONCLUSION <<<"$RUN"
              if [ "$RUN_STATUS" = "completed" ]; then
                if [ "$RUN_CONCLUSION" != "success" ]; then
                  echo "::error::Integrated staging workflow '$WORKFLOW' run $RUN_ID concluded $RUN_CONCLUSION for $HEAD_SHA"
                  exit 1
                fi
                JOBS=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?per_page=100")
                if [ "$WORKFLOW" = "staging-release-smoke.yml" ]; then
                  # A superseded smoke run succeeds without running the browser suite;
                  # that is not evidence for promoting this exact SHA.
                  SMOKE_STEP=$(jq -r \
                    '[.jobs[] | select(.name == "Staging release smoke") | .steps[]? | select(.name == "Run live staging release smoke")] | last | .conclusion // "missing"' \
                    <<<"$JOBS")
                  if [ "$SMOKE_STEP" != "success" ]; then
                    echo "::error::Staging release smoke run $RUN_ID did not run the live browser suite for $HEAD_SHA (step: $SMOKE_STEP)."
                    exit 1
                  fi
                fi
                for ((INDEX = 1; INDEX < ${#PARTS[@]}; INDEX++)); do
                  REQUIRED_JOB=${PARTS[$INDEX]}
                  JOB_CONCLUSION=$(jq -r --arg name "$REQUIRED_JOB" \
                    '[.jobs[] | select(.name == $name)] | last | .conclusion // "missing"' \
                    <<<"$JOBS")
                  if [ "$JOB_CONCLUSION" != "success" ]; then
                    echo "::error::Integrated staging workflow '$WORKFLOW' job '$REQUIRED_JOB' was $JOB_CONCLUSION"
                    exit 1
                  fi
                done
              elif [ "$RUN_ID" = "missing" ] && [ "$MODE" = "release" ]; then
                # A release cut is an earlier staging tip: its push runs already exist.
                echo "::error::No staging push run of '$WORKFLOW' exists for release cut $HEAD_SHA. Only a commit that was a staging tip can be promoted."
                exit 1
              elif [ "$RUN_STATUS" = "pending" ] || [ "$RUN_STATUS" = "queued" ] || [ "$RUN_STATUS" = "in_progress" ] || [ "$RUN_ID" = "missing" ]; then
                PENDING=1
              else
                echo "::error::Unexpected staging workflow state '$RUN' for '$WORKFLOW' at $HEAD_SHA"
                exit 1
              fi
            done

            if [ "$PENDING" -eq 0 ]; then
              echo "Exact staging release $HEAD_SHA passed integrated CI and live staging smoke."
              exit 0
            fi
            echo "Waiting for exact-SHA staging evidence ($ATTEMPT/80)..."
            sleep 15
          done

          echo "::error::Timed out waiting for integrated staging evidence for $HEAD_SHA"
          exit 1
