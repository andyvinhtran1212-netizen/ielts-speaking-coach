name: Typecheck + OpenAPI drift

# Gate D hardening: both jobs fail closed. Repository branch protection must
# require these check names before Gate D can claim they are merge-blocking;
# the workflow itself no longer swallows either class of failure.
#
# Two checks:
#   1. tsc --noEmit over the strict Next app plus the opt-in legacy
#      `// @ts-check` surface — catches a FE call-site using a field the
#      generated api.d.ts no longer has.
#   2. Regenerate frontend/types/api.d.ts from the LIVE app's /openapi.json and
#      git-diff it — catches a BE response_model change that wasn't re-committed
#      (spec↔type drift). Generated from the in-process app (not a deployment) so
#      it reflects THIS PR's models, not what's currently shipped.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main, staging]

jobs:
  spec-governance:
    name: Spec and PR metadata
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install spec parser
        run: pip install 'pyyaml==6.0.3'
      - name: Validate canonical specs and PR metadata
        run: python backend/scripts/validate_specs.py --github-event "$GITHUB_EVENT_PATH"

  typecheck:
    name: TypeScript strict + legacy JSDoc
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Next TypeScript strict check
        run: npx tsc --noEmit
      - name: Legacy @ts-check drift
        run: npx tsc --noEmit -p tsconfig.legacy.json

  apitype-drift:
    name: api.d.ts ↔ OpenAPI drift
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install pinned OpenAPI generator tree
        working-directory: frontend
        run: npm ci
      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Dump in-process OpenAPI spec
        working-directory: backend
        run: python -c "import json; from main import app; open('/tmp/openapi.json','w').write(json.dumps(app.openapi()))"
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_KEY: test-key
      - name: Regenerate api.d.ts + diff
        working-directory: frontend
        run: |
          # package-lock.json pins the generator and its transitive tree, while
          # requirements.txt pins Pydantic on the schema-producing side.
          ./node_modules/.bin/openapi-typescript /tmp/openapi.json -o types/api.d.ts
          git diff --exit-code types/api.d.ts
