name: Staging private audio verification
on:
  workflow_dispatch:
  push:
    branches: [codex/staging-profile-diagnostic-2026-09-09]
    paths:
      - frontend/tooling/staging-private-audio-verification.cjs
      - .github/workflows/staging-private-audio-verification.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    concurrency:
      group: staging-e2e-shared-env
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Verify synthetic owner, admin and denied access
        working-directory: frontend
        env:
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          EXPECT_PRIVATE: 'false'
        run: node tooling/staging-private-audio-verification.cjs
