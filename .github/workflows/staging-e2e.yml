# Staging E2E (plan §11.3 — "staging-e2e", the real-backend suite; the PR-time
# fixture smoke stays in backend-tests.yml). Nightly + manual. NOT PR-blocking:
# it exercises live staging infrastructure and must never gate unrelated PRs.
#
# Required repo secrets:
#   STAGING_PROTECTION_BYPASS — Vercel "Protection Bypass for Automation"
#   E2E_PASSWORD — synthetic identity password (NEVER committed — review P1);
#                  must match the value used when running staging_seed.py
#
# Prerequisites (provisioned 2026-07-13, see docs/ENV_CERTIFICATION_STAGING_*):
#   * staging.averlearning.com serving the `staging` branch
#   * backend/scripts/staging_seed.py --ns smoke identities on staging
#     Supabase (script ships in PR #733 — merge order #732 → #733 → this)
name: Staging E2E

permissions:
  contents: read
  actions: read

on:
  schedule:
    # GitHub Actions cron is deliberate: this job runs a Playwright browser
    # suite, which Vercel Cron Jobs (URL-invoking functions) cannot host.
    - cron: "30 20 * * *" # 03:30 Asia/Ho_Chi_Minh, daily
  workflow_dispatch:

jobs:
  staging-e2e:
    # AUDIT F4: staging is a SHARED live environment (shared smoke identities,
    # environment-global kill-switch flips). Two simultaneous runs corrupt
    # each other's state, so runs are QUEUED, never concurrent.
    # - JOB-scoped (not workflow-scoped, review #760): production-release-
    #   drift below only reads the production runtime marker and touches no
    #   shared staging state — it must not wait behind a long E2E run.
    # - queue: max (review #760): the default queue keeps ONE pending run and
    #   CANCELS it when another queues — a nightly + manual dispatch overlap
    #   would silently drop a streak run. Every queued run must execute.
    # - cancel-in-progress stays false: a streak run must finish, not be
    #   half-killed.
    # Known residual (documented, needs a repo secret to close): all runs
    # share the `smoke` namespace — per-run namespaces (staging_seed.py
    # --ns run-<id>) require the staging Supabase SERVICE key as a CI
    # secret; until then this concurrency gate is the isolation mechanism.
    concurrency:
      group: staging-e2e-shared-env
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    # Every step below has its own timeout. Their deliberately conservative
    # total is 159 minutes even though the streak/reset uploads are mutually
    # exclusive. Keep a further 21-minute job margin so a step-level timeout
    # can still produce the fail-closed ledger and evidence artifacts below.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 3
        with:
          # This workflow validates staging. Scheduled workflows execute from
          # default-branch YAML, but the code under test/evidence must match the
          # branch Vercel + Railway deploy to staging.
          ref: staging
          fetch-depth: 1

      - name: Checkout trusted Gate E auditor
        uses: actions/checkout@v4
        timeout-minutes: 3
        with:
          ref: main
          path: .gate-e-auditor
          fetch-depth: 1

      - name: Capture tested source revision
        id: source_revision
        timeout-minutes: 1
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "ref=staging" >> "$GITHUB_OUTPUT"

      - name: Capture auditor revision
        id: auditor_revision
        timeout-minutes: 1
        run: echo "sha=$(git -C .gate-e-auditor rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore previous Gate E streak state
        id: restore_gate_e_streak
        uses: actions/cache/restore@v4
        timeout-minutes: 3
        with:
          path: ${{ runner.temp }}/gate-e-streak-state
          # Do not partition the logical chain by dispatch ref. GitHub cache
          # scope can still hide a feature-branch cache from main, so the
          # updater also verifies global workflow history and resets on gaps.
          key: gate-e-streak-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            gate-e-streak-

      - uses: actions/setup-node@v5
        timeout-minutes: 3
        with:
          node-version: "24"

      - name: Verify frozen Gate E suite before executing staging code
        id: frozen_preflight
        timeout-minutes: 1
        env:
          GATE_E_TESTED_ROOT: ${{ github.workspace }}
          GATE_E_TESTED_SHA: ${{ steps.source_revision.outputs.sha }}
          GATE_E_AUDITOR_SHA: ${{ steps.auditor_revision.outputs.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .gate-e-auditor/frontend/tooling/verify-gate-e-frozen-suite.mjs

      - name: Install frontend deps
        working-directory: frontend
        timeout-minutes: 5
        run: npm ci

      - name: Verify Speaking Gate E matrix pins
        working-directory: frontend
        timeout-minutes: 1
        env:
          GATE_E_RUNNER_IMAGE: ubuntu24.04-x64
        run: node tooling/verify-gate-e-speaking-device-matrix.mjs

      - name: Verify Reading Gate E matrix pins
        working-directory: frontend
        timeout-minutes: 1
        env:
          GATE_E_RUNNER_IMAGE: ubuntu24.04-x64
        run: node tooling/verify-gate-e-reading-device-matrix.mjs

      - name: Verify Listening Gate E matrix pins
        working-directory: frontend
        timeout-minutes: 1
        env:
          GATE_E_RUNNER_IMAGE: ubuntu24.04-x64
        run: node tooling/verify-gate-e-listening-device-matrix.mjs

      - name: Verify Writing Gate E matrix pins
        working-directory: frontend
        timeout-minutes: 1
        env:
          GATE_E_RUNNER_IMAGE: ubuntu24.04-x64
        run: node tooling/verify-gate-e-writing-device-matrix.mjs

      - name: Install Playwright matrix engines
        working-directory: frontend
        # `--with-deps` downloads Ubuntu packages from the runner's regional
        # mirror. A slow mirror must not reset an otherwise clean Gate E streak
        # while packages are still making forward progress (run #84).
        timeout-minutes: 15
        run: npx playwright install --with-deps chromium webkit

      - name: Run staging E2E
        id: staging_e2e
        working-directory: frontend
        # Leave enough of the 180-minute job budget for all four frozen
        # matrices plus fail-closed evidence finalization.
        timeout-minutes: 20
        env:
          STAGING_BYPASS: ${{ secrets.STAGING_PROTECTION_BYPASS }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          GATE_E_SOURCE_SHA: ${{ steps.source_revision.outputs.sha }}
        run: npm run test:e2e:staging

      - name: Verify live-staging core-player failure evidence
        id: live_staging_failure_evidence
        if: always() && steps.staging_e2e.outcome != 'skipped'
        timeout-minutes: 2
        env:
          GATE_E_SOURCE_SHA: ${{ steps.source_revision.outputs.sha }}
          GATE_E_TESTED_ROOT: ${{ github.workspace }}
        run: node .gate-e-auditor/frontend/tooling/verify-gate-e-live-staging-failure-evidence.mjs

      # The four core-player failure paths use deterministic network faults
      # against the production Next build. Keeping this as a separate step
      # preserves the live-staging report while making either suite failure
      # reset the same critical streak.
      - name: Run Gate E Speaking failure matrix
        id: speaking_failure_matrix
        # Never execute tested-branch package scripts when trusted preflight
        # rejected the checkout or dependency setup skipped this suite.
        if: always() && steps.frozen_preflight.outcome == 'success' && steps.staging_e2e.outcome != 'skipped'
        working-directory: frontend
        timeout-minutes: 10
        env:
          GATE_E_REQUIRE_AFFINITY: 'true'
        run: npm run test:e2e:gate-e

      # Validate reporter semantics before any metadata or ledger state can be
      # written. A nonempty but truncated/empty artifact must reset the streak,
      # never advance it and only fail later during upload.
      - name: Verify Speaking failure-matrix evidence
        id: speaking_failure_evidence
        if: always() && steps.speaking_failure_matrix.outcome != 'skipped'
        timeout-minutes: 2
        env:
          GATE_E_TESTED_ROOT: ${{ github.workspace }}
        run: node .gate-e-auditor/frontend/tooling/verify-gate-e-speaking-failure-evidence.mjs

      - name: Run Gate E Reading failure matrix
        id: reading_failure_matrix
        if: always() && steps.frozen_preflight.outcome == 'success' && steps.staging_e2e.outcome != 'skipped'
        working-directory: frontend
        timeout-minutes: 10
        run: npm run test:e2e:gate-e:reading

      - name: Verify Reading failure-matrix evidence
        id: reading_failure_evidence
        if: always() && steps.reading_failure_matrix.outcome != 'skipped'
        timeout-minutes: 2
        env:
          GATE_E_TESTED_ROOT: ${{ github.workspace }}
        run: node .gate-e-auditor/frontend/tooling/verify-gate-e-reading-failure-evidence.mjs

      - name: Run Gate E Listening failure matrix
        id: listening_failure_matrix
        if: always() && steps.frozen_preflight.outcome == 'success' && steps.staging_e2e.outcome != 'skipped'
        working-directory: frontend
        timeout-minutes: 10
        run: npm run test:e2e:gate-e:listening

      - name: Verify Listening failure-matrix evidence
        id: listening_failure_evidence
        if: always() && steps.listening_failure_matrix.outcome != 'skipped'
        timeout-minutes: 2
        env:
          GATE_E_TESTED_ROOT: ${{ github.workspace }}
        run: node .gate-e-auditor/frontend/tooling/verify-gate-e-listening-failure-evidence.mjs

      - name: Run Gate E Writing failure matrix
        id: writing_failure_matrix
        if: always() && steps.frozen_preflight.outcome == 'success' && steps.staging_e2e.outcome != 'skipped'
        working-directory: frontend
        timeout-minutes: 10
        run: npm run test:e2e:gate-e:writing

      - name: Verify Writing failure-matrix evidence
        id: writing_failure_evidence
        if: always() && steps.writing_failure_matrix.outcome != 'skipped'
        timeout-minutes: 2
        env:
          GATE_E_TESTED_ROOT: ${{ github.workspace }}
        run: node .gate-e-auditor/frontend/tooling/verify-gate-e-writing-failure-evidence.mjs

      # Gate E evidence must remain inspectable even when the suite fails. This
      # metadata contains only versions/run ids/outcome — never secrets or auth
      # state — and pairs with Playwright's JSON reporter output.
      - name: Write versioned device-matrix metadata
        id: matrix_evidence
        if: always()
        timeout-minutes: 1
        env:
          GATE_E_RUN_OUTCOME: ${{ steps.staging_e2e.outcome == 'success' && steps.live_staging_failure_evidence.outcome == 'success' && steps.speaking_failure_matrix.outcome == 'success' && steps.speaking_failure_evidence.outcome == 'success' && steps.reading_failure_matrix.outcome == 'success' && steps.reading_failure_evidence.outcome == 'success' && steps.listening_failure_matrix.outcome == 'success' && steps.listening_failure_evidence.outcome == 'success' && steps.writing_failure_matrix.outcome == 'success' && steps.writing_failure_evidence.outcome == 'success' && 'success' || 'failure' }}
          EVIDENCE_GIT_SHA: ${{ steps.source_revision.outputs.sha }}
          EVIDENCE_GIT_REF: ${{ steps.source_revision.outputs.ref }}
          GATE_E_TESTED_ROOT: ${{ github.workspace }}
        run: node .gate-e-auditor/frontend/tooling/write-gate-e-device-matrix-evidence.mjs

      - name: Capture staging release provenance
        id: staging_provenance
        if: always()
        timeout-minutes: 3
        env:
          STAGING_BYPASS: ${{ secrets.STAGING_PROTECTION_BYPASS }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          GATE_E_SOURCE_SHA: ${{ steps.source_revision.outputs.sha }}
          GATE_E_TESTED_ROOT: ${{ github.workspace }}
        run: node .gate-e-auditor/frontend/tooling/capture-gate-e-staging-provenance.mjs

      - name: Update Gate E streak ledger
        id: streak_ledger
        if: always()
        timeout-minutes: 3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GATE_E_TESTED_ROOT: ${{ github.workspace }}
          GATE_E_STATE_ROOT: ${{ runner.temp }}/gate-e-streak-state
        run: node .gate-e-auditor/frontend/tooling/update-gate-e-streak-ledger.mjs

      - name: Save Gate E streak state
        if: always() && steps.streak_ledger.outcome == 'success'
        uses: actions/cache/save@v4
        timeout-minutes: 3
        with:
          path: ${{ runner.temp }}/gate-e-streak-state
          key: gate-e-streak-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Package verifiable streak evidence
        id: streak_bundle
        if: always() && steps.streak_ledger.outcome == 'success'
        timeout-minutes: 1
        run: |
          test -f frontend/test-results/gate-e-streak-ledger.json
          test -f frontend/test-results/staging-e2e-results.json
          mkdir -p frontend/test-results/gate-e-streak-bundle
          cp frontend/test-results/gate-e-streak-ledger.json frontend/test-results/gate-e-streak-bundle/
          cp frontend/test-results/staging-e2e-results.json frontend/test-results/gate-e-streak-bundle/

      - name: Upload device-matrix evidence
        if: always() && steps.matrix_evidence.outcome == 'success'
        uses: actions/upload-artifact@v4
        timeout-minutes: 3
        with:
          name: gate-e-device-matrix-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/test-results/gate-e-device-matrix-evidence.json
            frontend/test-results/staging-e2e-results.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload live-staging core-player failure evidence
        if: always() && steps.live_staging_failure_evidence.outcome == 'success'
        uses: actions/upload-artifact@v4
        timeout-minutes: 3
        with:
          name: gate-e-live-staging-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontend/test-results/gate-e-live-staging-failure-injection.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload Speaking failure-matrix evidence
        if: always() && steps.speaking_failure_evidence.outcome == 'success'
        uses: actions/upload-artifact@v6
        timeout-minutes: 5
        with:
          name: gate-e-speaking-failure-matrix-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/test-results/gate-e-speaking-device-matrix-results.json
            frontend/tooling/gate-e-speaking-device-matrix.json
            frontend/playwright-report/gate-e
          if-no-files-found: error
          retention-days: 30

      - name: Upload Reading failure-matrix evidence
        if: always() && steps.reading_failure_evidence.outcome == 'success'
        uses: actions/upload-artifact@v6
        timeout-minutes: 5
        with:
          name: gate-e-reading-failure-matrix-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/test-results/gate-e-reading-device-matrix-results.json
            frontend/tooling/gate-e-reading-device-matrix.json
            frontend/playwright-report/gate-e-reading
          if-no-files-found: error
          retention-days: 30

      - name: Upload Listening failure-matrix evidence
        if: always() && steps.listening_failure_evidence.outcome == 'success'
        uses: actions/upload-artifact@v6
        timeout-minutes: 5
        with:
          name: gate-e-listening-failure-matrix-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/test-results/gate-e-listening-device-matrix-results.json
            frontend/tooling/gate-e-listening-device-matrix.json
            frontend/playwright-report/gate-e-listening
          if-no-files-found: error
          retention-days: 30

      - name: Upload Writing failure-matrix evidence
        if: always() && steps.writing_failure_evidence.outcome == 'success'
        uses: actions/upload-artifact@v6
        timeout-minutes: 5
        with:
          name: gate-e-writing-failure-matrix-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/test-results/gate-e-writing-device-matrix-results.json
            frontend/tooling/gate-e-writing-device-matrix.json
            frontend/playwright-report/gate-e-writing
          if-no-files-found: error
          retention-days: 30

      - name: Upload staging provenance
        if: always() && steps.staging_provenance.outcome == 'success'
        uses: actions/upload-artifact@v4
        timeout-minutes: 2
        with:
          name: gate-e-staging-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontend/test-results/gate-e-staging-provenance.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload streak ledger evidence
        if: always() && steps.streak_bundle.outcome == 'success' && steps.streak_ledger.outputs.clean == 'true'
        uses: actions/upload-artifact@v4
        timeout-minutes: 2
        with:
          name: gate-e-streak-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontend/test-results/gate-e-streak-bundle
          if-no-files-found: error
          retention-days: 30

      - name: Upload verifiable streak reset evidence
        if: always() && steps.streak_bundle.outcome == 'success' && steps.streak_ledger.outputs.clean != 'true'
        uses: actions/upload-artifact@v4
        timeout-minutes: 2
        with:
          name: gate-e-streak-reset-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontend/test-results/gate-e-streak-bundle
          if-no-files-found: error
          retention-days: 30

      - name: Upload incomplete streak reset ledger
        if: always() && steps.streak_ledger.outcome == 'success' && steps.streak_bundle.outcome == 'failure'
        uses: actions/upload-artifact@v4
        timeout-minutes: 2
        with:
          name: gate-e-streak-reset-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontend/test-results/gate-e-streak-ledger.json
          if-no-files-found: error
          retention-days: 30

      # Synthetic data only + short retention (plan B29).
      - uses: actions/upload-artifact@v4
        if: failure()
        timeout-minutes: 5
        with:
          name: staging-e2e-report
          path: frontend/playwright-report
          retention-days: 7

  # Rollback-pin drift monitor (Gate B re-drill lesson, 2026-07-13 — see
  # docs/GATE_B_EVIDENCE_2026-07-13.md): an Instant Rollback leaves the
  # project pinned and silently stops auto-promotion; six merges once built
  # Ready production deployments that never received the domain. This job
  # fails the nightly whenever production is not serving main HEAD.
  production-release-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # `GITHUB_SHA` la SHA cua REF duoc chay, khong phai main. Khi dispatch tren
    # mot nhanh (vi du de kiem nhanh cutover trong luc chuan bi pilot), job nay
    # so production voi SHA cua nhanh do va do THEO THIET KE — mot bao dong gia
    # da xay ra 2 lan ngay 2026-07-31. Chi so drift khi ref DUNG LA main.
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Production serves main HEAD
        run: |
          SERVING=$(curl -sL --max-time 20 https://www.averlearning.com/js/runtime-config.js \
            | grep -o '"release": *"[a-f0-9]\{40\}"' | grep -o '[a-f0-9]\{40\}' | head -1)
          echo "serving=$SERVING main=$GITHUB_SHA"
          if [ -z "$SERVING" ]; then
            echo "::error::Khong doc duoc release tu production runtime-config"; exit 1
          fi
          if [ "$SERVING" != "$GITHUB_SHA" ]; then
            echo "::error::PRODUCTION RELEASE DRIFT - production dang phuc vu $SERVING nhung main la $GITHUB_SHA. Kiem tra rollback-pin tren Vercel Overview (banner Undo Rollback) - bai hoc Gate B re-drill, docs/GATE_B_EVIDENCE_2026-07-13.md."
            exit 1
          fi
