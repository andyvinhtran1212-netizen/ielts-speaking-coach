name: Tests

# Sprint 4 Phase 7 — backend test suite gate.
# Includes the grammar anchor drift gate (test_anchor_drift.py) which
# fails the PR if feedback-anchor-mapping.yaml references unresolved
# anchors. Prevents broken AI feedback deep-links from shipping.
#
# Trigger: pull_request only (Andy Q4 directive — saves Actions quota,
# matches dev workflow, doesn't miss meaningful gates).
#
# Sprint 5b broadened: frontend/** added so the drift gate runs on
# frontend-only PRs too. The mapping file lives under backend/, but a
# frontend dev with VS Code open at repo root could touch it; more
# importantly, frontend changes that consume the recommendation shape
# (anchor field) want the same gate. The finite 15-minute backend budget
# includes setup, all tests, drift and cleanup on PRs and staging/main pushes.
#
# Sprint 6.3.1 added the frontend-tests job (Codex audit AMBER #1):
# Sprint 6 introduced node:test contract suites for theme-toggle,
# embedded-mode, vocab-landing, typography-tier1, home (existing) and
# home-redesign. Without this job, a refactor that renamed
# class="av-theme-toggle" → class="theme-toggle" would fail locally
# but ship through the PR gate. The frontend job runs in parallel
# to the backend job — slow Python install doesn't block fast Node
# checks and vice versa.

on:
  # SAU KHI MERGE, KHÔNG lọc đường dẫn. Bộ lọc (job `changes`) trả lời câu «PR này có
  # đáng chạy test không»; ở đây câu hỏi khác hẳn: «nhánh tích hợp sau khi hợp
  # nhất còn xanh không». Hai PR có thể xanh riêng lẻ rồi hợp lại thành đỏ, và không bộ
  # lọc đường dẫn nào nhìn thấy điều đó. Xem chú thích dài hơn ở `next-native-browser.yml`.
  push:
    branches: [main, staging]
  pull_request:
    # PR-body edits are handled by the lightweight unfiltered spec-governance
    # job in typecheck.yml; do not reinstall and rerun both test suites for a
    # metadata-only edit.
    types: [opened, synchronize, reopened, ready_for_review]
    # KHÔNG còn `paths:` ở đây (2026-10-29). Từ khi staging bật branch
    # protection, 6 check của tệp này là check BẮT BUỘC; workflow bị bộ lọc
    # đường dẫn bỏ qua thì check không bao giờ báo về, và GitHub CHẶN merge
    # mọi PR chỉ sửa spec/docs. Bộ lọc giờ nằm trong job `changes` bên dưới:
    # job nặng chỉ SKIP trên PR mà MỌI tệp đều là spec không-test-đọc (skip =
    # đạt check bắt buộc), vẫn tiết kiệm quota Actions như chỉ thị Andy Q4.
    # No `paths:` here: a path-filtered workflow never reports its required
    # checks, which blocks spec/docs-only PRs. The `changes` job below skips
    # the heavy jobs only when every changed file is a spec no test reads.

jobs:
  # Cổng rẻ, dạng ALLOWLIST: job nặng chỉ được SKIP khi MỌI tệp PR đổi đều nằm
  # trong `specs/**` VÀ không phải tệp spec mà test đọc. Mọi đường dẫn khác
  # (docs/**, data/**, tệp gốc, …) đều chạy test: skip = đạt check bắt buộc, nên
  # một bộ lọc kiểu «chỉ chạy khi khớp danh sách» sẽ cho PR chỉ sửa fixture
  # (docs/grammar-quiz-banks/*.md, data/rubric/*.json, …) xanh mà không chạy gì.
  # Push và mọi lỗi ở đây đều fail CLOSED: output rỗng/thiếu ⇒ chạy hết.
  # Cheap gate, allowlist form: heavy jobs skip only when EVERY changed file is
  # under specs/ and is not a spec file a test reads. Push events and any
  # failure here fail CLOSED: an empty/missing output runs every heavy job.
  changes:
    name: Changed paths (CI gate)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_tests: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.run_tests }}
    steps:
      # On pull_request the action lists the PR files through the API (renames
      # count both old and new path), so no checkout is needed.
      - name: Classify changed files
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # `some` (mặc định, ghi rõ để khỏi đổi ngầm): một tệp khớp bộ lọc khi nó
          # khớp ÍT NHẤT MỘT mục. Với `some`, mục phủ định `'!specs/**'` là một
          # matcher khớp MỌI tệp NGOÀI specs/ (picomatch đảo kết quả; xem
          # createRuleItem trong src/filter.ts của action). `run_tests` = 'true'
          # khi có ít nhất một tệp như thế ⇒ chỉ PR toàn-spec mới ra 'false'.
          # `some`: a file matches when it matches ANY item; under `some` the
          # negated item '!specs/**' matches every file outside specs/.
          predicate-quantifier: some
          filters: |
            run_tests:
              - '!specs/**'
              # Tệp trong specs/ mà test ĐỌC: sửa chúng vẫn phải chạy test.
              # `workflow-path-coverage.test.mjs` dò mã test tìm đường dẫn specs/
              # và ĐỎ nếu một tệp được đọc mà không nằm trong danh sách này.
              # Spec files read by tests (kept honest by workflow-path-coverage):
              # validate_specs.py REQUIRED_FOUNDATION_FILES, read by test_validate_specs.py.
              - 'specs/README.md'
              - 'specs/_meta/**'
              - 'specs/_templates/**'
              # grammar-exact-form-engine.test.mjs
              - 'specs/0019-grammar-audit-remediation/source-scope.json'
              # test_migration_332_staff_security_audit.py
              - 'specs/0032-admin-aal2-staff-guard/rollout.md'

      - name: Report
        env:
          EVENT: ${{ github.event_name }}
          RUN: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.run_tests }}
        run: |
          echo "event=$EVENT run_tests=${RUN:-<empty, heavy jobs run>}"

  # PC-J14 / BL-14: the serial job ran 9–15 min of pytest (10–16.5 min total)
  # against its 25-minute budget. The suite now runs as four file shards in
  # parallel. `backend` below keeps the required context name for branch
  # protection and staging-promotion-gate.yml: it is green only when every
  # shard and the full collection are green and the shards ran each collected
  # test exactly once (`scripts/ci_pytest_shards.py verify`).
  backend-shard:
    name: Backend pytest shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    # Full pytest plus PG/audio setup and cleanup exceeded 10 minutes in PR1563.
    # A slow Ubuntu mirror has made the ffmpeg install take 8–11 min,
    # cancelling the exact-SHA staging push run that the promotion gate
    # requires (#1695, 2026-10-26). Each shard keeps that 25-minute budget.
    timeout-minutes: 25
    needs: changes
    # Bắt buộc phải CHẠY, không được skip ở mức job: matrix bị skip sẽ báo một
    # check tên chưa nở (`… ${{ matrix.shard }}/4`) và 4 check bắt buộc
    # «shard N/4» treo mãi. Nên job luôn chạy, còn từng step bỏ qua khi PR không
    # chạm mã. A skipped matrix job never expands its name, so the required
    # "shard N/4" checks would stay pending; run the job, skip its steps.
    if: ${{ !cancelled() }}
    strategy:
      # Every shard must report, so one red shard never hides another.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    # Postgres THẬT cho các chốt nạp một tệp migration rồi GỌI hàm trong đó.
    # Không có nó thì `test_delete_rpc_course_evidence.py` tự bỏ qua, và một PR
    # làm hỏng cú pháp hàm hay bẻ mọi nhánh hành vi vẫn xanh ở cổng merge — một
    # chốt tồn tại mà không bao giờ nổ (cùng họ với các phát hiện ở #930/#937/#943).
    # Mỗi shard có service riêng, nên các test PG không chia sẻ cụm với nhau.
    services:
      postgres:
        # Empty image = service not started (no PG pull on a docs-only PR).
        image: ${{ (github.event_name == 'push' || needs.changes.outputs.run_tests != 'false') && 'postgres:16' || '' }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aver_ux_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10

    env:
      # 'true' unless every file this PR changes is a skippable spec (job `changes`).
      RUN_TESTS: ${{ (github.event_name == 'push' || needs.changes.outputs.run_tests != 'false') }}
      # Trỏ chốt vào service ở trên. `REQUIRE_PG=1` biến "không nối được" thành
      # ĐỎ thay vì "bỏ qua": ở CI thì thiếu Postgres là hỏng hạ tầng, không phải
      # một lời miễn trừ.
      TEST_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
      REQUIRE_PG: '1'
      # Run Reading CAS/receipt/import races against the same real service.
      # Its fixture requires an explicit loopback aver_ux_ test database and
      # creates/drops only its own random schema; configured failures are red.
      READING_GRAMMAR_FOCUS_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/aver_ux_ci
      # Dictation frozen-policy guards, FK erasure and finalization run on real
      # PostgreSQL too. Each fixture owns only its random disposable schema.
      DICTATION_POLICY_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/aver_ux_ci
      # Grammar revision admission, reset, receipt and write races require the
      # same real PostgreSQL service; missing configured access fails closed.
      GRAMMAR_QUIZ_REVISION_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/aver_ux_ci

    steps:
      - name: No gated path changed — shard intentionally empty
        if: env.RUN_TESTS != 'true'
        run: echo "No backend/frontend gate path changed in this PR; shard steps skipped."

      - name: Checkout
        if: env.RUN_TESTS == 'true'
        uses: actions/checkout@v5

      - name: Setup Python
        if: env.RUN_TESTS == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        if: env.RUN_TESTS == 'true'
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install audio validation tools
        if: env.RUN_TESTS == 'true'
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install --yes --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Run pytest shard
        if: env.RUN_TESTS == 'true'
        working-directory: backend
        run: |
          python scripts/ci_pytest_shards.py run --total 4 --index ${{ matrix.shard }} \
            --out ci-pytest -- -v --tb=short

      - name: Upload shard node ids
        if: always() && env.RUN_TESTS == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: backend-pytest-shard-${{ matrix.shard }}
          path: backend/ci-pytest/shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 14
          # "Re-run failed jobs" uploads the same name again.
          overwrite: true

  # PC-J91 (PC-J76 F-5): Supabase staging/production run PostgreSQL 17, but the
  # shards above run on 16. PG 17 changes privileges (e.g. `MAINTAIN` inside
  # `GRANT ALL`); migration 320 aborted on staging for exactly that reason.
  # Re-run the migration/privilege suites against postgres:17 on its own service.
  # ADVISORY (Leader decision): not in `backend.needs`, branch protection or
  # staging-promotion-gate.yml. Job-level `continue-on-error` keeps a red PG 17
  # result from failing the workflow run, whose conclusion the promotion gate
  # requires to be `success`; the job itself still shows red on the PR.
  backend-pg17:
    name: Backend PG17 migration/privilege tests (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.run_tests != 'false') }}

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10

    env:
      TEST_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
      REQUIRE_PG: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # A wrong image tag would silently turn this into a second PG 16 run.
      - name: Server is PostgreSQL 17
        run: |
          VERSION=$(psql "$TEST_PG_URL" -Atc 'show server_version_num')
          echo "server_version_num=$VERSION"
          [ "$VERSION" -ge 170000 ] && [ "$VERSION" -lt 180000 ]

      # PC-J367: the staging clone tests run the real clone script against two
      # disposable loopback SCRAM clusters they start themselves, so they need
      # PG 17.6+ server and client binaries, not the service container.
      - name: Install PostgreSQL 17 binaries for the clone tests
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo sed -i 's/^#*[[:space:]]*create_main_cluster.*/create_main_cluster = false/' \
            /etc/postgresql-common/createcluster.conf
          sudo apt-get install -y --no-install-recommends postgresql-17
          /usr/lib/postgresql/17/bin/postgres --version
          echo "STAGING_CLONE_PG_BIN=/usr/lib/postgresql/17/bin" >> "$GITHUB_ENV"

      - name: Run migration/privilege tests on PostgreSQL 17
        working-directory: backend
        run: |
          python -m pytest -v --tb=short \
            tests/test_migration_*.py \
            tests/test_rls_no_inline_admin_role_policy.py \
            tests/test_mock_paper_policy_postgres.py \
            tests/test_mock_private_draft_postgres.py \
            tests/test_activate_rate_limit.py \
            tests/test_staging_clone_preflight_postgres.py

  backend-collect:
    name: Backend pytest collection + anchor drift
    needs: changes
    # Non-matrix job: a job-level skip still reports this exact required name.
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.run_tests != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The reference set the shards must reproduce. Collection does not touch
      # Postgres; if it ever starts to, the sets diverge and `verify` turns red.
      - name: Collect the full pytest suite
        working-directory: backend
        run: |
          python scripts/ci_pytest_shards.py collect --out ci-pytest/collected.json

      - name: Upload collected node ids
        uses: actions/upload-artifact@v6
        with:
          name: backend-pytest-collected
          path: backend/ci-pytest/collected.json
          if-no-files-found: error
          retention-days: 14
          # "Re-run failed jobs" uploads the same name again.
          overwrite: true

      - name: Run anchor drift gate (explicit re-check)
        working-directory: .
        run: |
          python backend/scripts/verify_anchor_drift.py

  backend:
    name: Backend (pytest + anchor drift)
    needs: [changes, backend-shard, backend-collect]
    # Always report this required context; a skipped aggregate would read as
    # neither red nor green on the PR and on the promotion gate.
    # Exception: a PR touching no gated path (the shards ran empty and the
    # collection was skipped) skips it; push runs always have RUN = true.
    if: ${{ always() && (github.event_name == 'push' || needs.changes.outputs.run_tests != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download node ids
        uses: actions/download-artifact@v7
        with:
          pattern: backend-pytest-*
          path: backend/ci-pytest
          merge-multiple: true

      - name: Every collected test ran exactly once
        working-directory: backend
        run: |
          python3 scripts/ci_pytest_shards.py verify --dir ci-pytest --total 4 \
            --weights-out ci-pytest/weights.json

      - name: Upload refreshed shard weights
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-pytest-weights
          path: backend/ci-pytest/weights.json
          if-no-files-found: ignore
          retention-days: 14
          # "Re-run failed jobs" uploads the same name again.
          overwrite: true

      # Last and unconditional: the parity report above still runs when a
      # shard fails, but this context is green only if everything passed.
      - name: Require every shard and the collection to pass
        if: always()
        env:
          SHARDS: ${{ needs.backend-shard.result }}
          COLLECT: ${{ needs.backend-collect.result }}
        run: |
          echo "shards=$SHARDS collection+anchor-drift=$COLLECT"
          [ "$SHARDS" = success ] && [ "$COLLECT" = success ]

  frontend:
    name: Frontend (node --test)
    needs: changes
    # Non-matrix job: a job-level skip still reports this exact required name.
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.run_tests != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Most frontend tests are pure node:test contracts. Browser contracts also resolve
    # the checked-in Playwright config and validates playwright-core's pinned
    # browser metadata, so the main lockfile must be installed fail-closed.

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # P0-3 C-3.4 — the static Tailwind CSS (css/tailwind.build.css) is committed.
      # Rebuild it from the SAME pinned toolchain + config and fail if it differs:
      # guards against a class being added to HTML/JS without regenerating the CSS
      # (which would silently drop styling).
      #
      # The toolchain is LOCKFILE-PINNED + ISOLATED (frontend/tooling/css) and
      # installed via `npm ci` — NOT `npx --yes`. `npx --yes tailwindcss@3.4.17`
      # re-resolved tailwind's transitive deps at run time, and resolving them in
      # the main project tree (alongside @playwright) deduped them differently, so
      # CI's CSS drifted from the committed build (random "STALE" failures that
      # blocked every PR). The isolated lockfile freezes the exact tree that built
      # the committed CSS → deterministic across machines/runs.
      - name: Install pinned Tailwind toolchain (isolated lockfile)
        working-directory: frontend/tooling/css
        run: npm ci

      - name: Tailwind static CSS is not stale (rebuild + diff, all clusters)
        run: |
          cd frontend
          BIN=./tooling/css/node_modules/.bin/tailwindcss
          check() {  # $1=config $2=committed-css
            "$BIN" -c "$1" -i ./css/tailwind.src.css -o /tmp/tw-ci.css --minify
            if ! diff -q "$2" /tmp/tw-ci.css; then
              echo "::error::$2 is STALE — run 'npm run build:css:setup && npm run build:css' in frontend/ and commit."
              diff "$2" /tmp/tw-ci.css | head -20 || true
              exit 1
            fi
            echo "$2 is fresh ✓"
          }
          check ./tailwind.config.cjs       css/tailwind.build.css
          check ./tailwind.config.inter.cjs css/tailwind.inter.css

      # B35 (FE migration plan v3): run EVERY contract test via glob instead of a
      # hand-maintained file list — new test files are CI-gated automatically.
      # To exclude a file, move it aside or add an explicit `--test-skip-pattern`
      # here WITH an owner + expiry comment; do not reintroduce a hand list.
      - name: Run frontend contract tests
        run: |
          node --import ./frontend/tests/fixtures/legacy-html-retired/loader.mjs --test \
            frontend/tests/*.test.mjs \
            frontend/tests/*.test.js

      # Small rendered interaction layer for shared React state/focus/keyboard
      # behavior. Page-level product journeys remain in next-native-browser.yml.
      - name: Run React component interaction tests
        working-directory: frontend
        run: npm run test:react
