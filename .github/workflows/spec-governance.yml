name: Spec governance

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main, staging]

# CI queue (23/11): a new push or a base-branch merge on a PR cancels that
# PR's older run of this workflow instead of leaving it queued. Push, schedule
# and dispatch runs get a group of their own (run_id), so a staging/main SHA
# that the promotion gate needs is never cancelled or replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  spec-governance:
    name: Spec and PR metadata
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          # PR validation reads the exact base revision to prove the spec was
          # approved before implementation entered the topic branch.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install spec parser
        run: pip install 'pyyaml==6.0.3'
      - name: Validate canonical specs and PR metadata
        run: python backend/scripts/validate_specs.py --github-event "$GITHUB_EVENT_PATH"
