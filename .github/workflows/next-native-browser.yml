  push:
    branches: [main, staging]
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: next-native-browser-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# A verifier that misses one of its mocked requests must fail locally; it must
# never read or write staging/production as an accidental fallback.
env:
  TEST_PORT: '3000'
  AVER_API_BASE: http://127.0.0.1:9
  AVER_SUPABASE_URL: https://example.supabase.co
  AVER_SUPABASE_ANON_KEY: test-anon-key
  AVER_ENVIRONMENT: test
  SUPABASE_URL: https://example.supabase.co

jobs:
  browser-regression:
    name: Next-native browser regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cài phụ thuộc
        run: npm ci

      - name: Build Next với endpoint test cô lập
        run: npm run build

      - name: Cài Chromium cho Playwright
        run: npx playwright install --with-deps chromium

      - name: Khởi động Next
        run: |
          npx next start -p "$TEST_PORT" > /tmp/next-native-browser.log 2>&1 &
          echo $! > /tmp/next-native-browser.pid
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:$TEST_PORT/grammar" || true)
            if [ "$code" = "200" ]; then echo "Next sẵn sàng sau ${i}s"; exit 0; fi
            sleep 1
          done
          tail -40 /tmp/next-native-browser.log
          exit 1

      - name: Kiểm boundary Pricing pre-launch
        run: node tooling/verify-pricing-redirect-flow.mjs "http://localhost:$TEST_PORT"

      # Login needs interaction evidence beyond the signed-out parity frame:
      # implicit callback cleanup, backend-canonical activation truth and the
      # lost-ACK reconciliation path are all exercised with a fake backend.
      - name: Kiểm luồng Login/Auth native
        run: node tooling/verify-login-flow.mjs "http://localhost:$TEST_PORT"

      - name: Kiểm luồng Onboarding native
        run: node tooling/verify-onboarding-flow.mjs "http://localhost:$TEST_PORT" --next-only

      # Player Quiz có state ghi thích ứng; cặp parity tĩnh chỉ phủ nhánh thiếu
      # bank. Fixture này chứng minh answer/advance locks, retry outbox,
      # non-destructive review, reset reconcile và summary ngay trong browser.
      - name: Kiểm luồng Quiz native
        run: node tooling/verify-quiz-flow.mjs "http://localhost:$TEST_PORT"

      - name: Kiểm luồng Exam player native
        run: node tooling/verify-exam-flow.mjs "http://localhost:$TEST_PORT"

      # `/mock-exam` điều phối clock chung, iframe L/R và Writing autosave.
      # Parity tĩnh chỉ thấy nhánh thiếu identity; fixture này khóa create
      # reconciliation, retake assignment, flush order và final-submit lost ACK.
      - name: Kiểm luồng Mock Exam runner native
        run: node tooling/verify-mock-exam-flow.mjs "http://localhost:$TEST_PORT"

      - name: Kiểm luồng Writing learner native
        run: node tooling/verify-writing-admission-flow.mjs "http://localhost:$TEST_PORT"

      - name: Kiểm luồng tạo phiên (Speaking)
        run: node tooling/verify-speaking-flow.mjs "http://localhost:$TEST_PORT"

      - name: Kiểm bootstrap qua App Router client navigation
        run: node tooling/verify-shared-runtime-client-navigation.mjs "http://localhost:$TEST_PORT"

      - name: Kiểm layout Next ở desktop và điện thoại
        run: node tooling/verify-next-responsive-flow.mjs "http://localhost:$TEST_PORT"

      # `/reading/vocab` đã chuyển request/filter/state sang React. Cổng parity
      # chỉ chụp một trạng thái tĩnh nên không chứng minh được malformed payload,
      # request filter bị supersede hay nút reset. Runner này dùng browser thật,
      # phiên + backend giả và chặn toàn bộ request; không cần secret, không ghi
      # vào dữ liệu nào.
      - name: Kiểm luồng Reading Vocab native
        run: node tooling/verify-reading-vocab-flow.mjs "http://localhost:$TEST_PORT"

      # `/grammar/roadmap?slug=` được G1 public parity phủ; mode không slug là
      # private/account-keyed nên cần fixture riêng để kiểm auth, lỗi-vs-rỗng,
      # authored-text escaping và responsive layout mà không ghi production.
      - name: Kiểm luồng Grammar Roadmap cá nhân native
        run: node tooling/verify-grammar-roadmap-personal-flow.mjs "http://localhost:$TEST_PORT"

      # Public parity khóa nội dung ban đầu; fixture browser này khóa các hành
      # vi sau hydrate: filter, compound deep-link, feedback và mobile sheet.
      - name: Kiểm luồng Vocabulary Wiki native
        run: node tooling/verify-vocabulary-wiki-flow.mjs "http://localhost:$TEST_PORT"

      # `/reading/skill` cũng sở hữu request/filter/state bằng React. Chạy độc
      # lập để bắt canonical total, nhóm kỹ năng, response filter cũ và reset.
      - name: Kiểm luồng Reading Skill native
        run: node tooling/verify-reading-skill-flow.mjs "http://localhost:$TEST_PORT"

      # Hai detail route dùng chung một workspace React. Runner này ghim
      # answer-key fail-close, bốn loại control L1/L2, retry/sync lock,
      # tabs/dialog keyboard, feedback flag và mobile containment.
      - name: Kiểm luồng Reading Detail native
        run: node tooling/verify-reading-detail-flow.mjs "http://localhost:$TEST_PORT"

      # `/reading/test` sở hữu filter/card/state bằng React; kiểm canonical
      # total, test_type=full, reset và response cũ ngay trên production build.
      - name: Kiểm luồng Reading Full Test native
        run: node tooling/verify-reading-test-flow.mjs "http://localhost:$TEST_PORT"

      # Mini Test có default và thống kê duration riêng; runner này ngăn nó
      # trượt về default Full Test khi phần behavior được đổi.
      - name: Kiểm luồng Reading Mini Test native
        run: node tooling/verify-reading-mini-test-flow.mjs "http://localhost:$TEST_PORT"

