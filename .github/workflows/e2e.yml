name: E2E modal smoke (advisory)

# Sprint 15.2 (F4) — browser smoke tests that catch runtime regressions the
# source-scan + node --test gates miss (e.g. Sprint 15.1.2 modal positioning).
# ADVISORY: this job is intentionally NOT in branch protection, so a failure
# annotates the PR but does not block merge. Promote to required once stable.
# Runs in parallel with the Backend + Frontend (node --test) jobs.

on:
  # Sau khi merge — xem chú thích cùng chủ đề ở `parity-gate.yml`.
  push:
    branches: [main]
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/e2e.yml'

jobs:
  e2e:
    name: E2E modal smoke (advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install deps
        run: npm ci

      - name: Verify Speaking Gate E matrix pins
        run: node tooling/verify-gate-e-speaking-device-matrix.mjs
        env:
          GATE_E_RUNNER_IMAGE: ubuntu24.04-x64

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      # The runner's Azure mirror stalled until timeout on 2026-08-18, while
      # the canonical archive fallback answered in the same apt trace. WebKit
      # still needs system libraries, so keep `--with-deps` but remove the
      # unavailable mirror from apt's mirror list first.
      - name: Pin responsive Ubuntu archive mirror
        run: sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu/|https://archive.ubuntu.com/ubuntu/|' /etc/apt/apt-mirrors.txt

      - name: Install Chromium + WebKit (cached after first run)
        run: npx playwright install --with-deps chromium webkit

      - name: Run modal smoke tests
        run: npx playwright test

      - name: Run Speaking Gate E native fixtures
        id: speaking_gate_e
        if: always()
        run: npm run test:e2e:gate-e

      - name: Upload Speaking Gate E device-matrix evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gate-e-speaking-device-matrix-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            frontend/test-results/gate-e-speaking-device-matrix-results.json
            frontend/tooling/gate-e-speaking-device-matrix.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-e2e-failure-${{ github.run_id }}
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: error
          retention-days: 7
