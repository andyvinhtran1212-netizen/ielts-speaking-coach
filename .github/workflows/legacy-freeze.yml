# Đóng băng bề mặt legacy — chặn thêm TRANG HTML MỚI.
#
# VÌ SAO: bề mặt di trú đang LỚN LÊN trong lúc di trú. Đo 2026-08-04: 129 trang
# HTML legacy, mà chỉ trong ngày trước đó đã thêm 2 trang mới
# (`pages/my-class.html`, `pages/admin/classes/index.html`). Mỗi trang HTML mới
# là một trang phải port lại sau — và làm mọi ước lượng lịch trình trôi đi.
#
# Chốt này KHÔNG cấm sửa trang legacy đang có. Chỉ cấm THÊM trang mới.
# Trang mới thì viết bằng Next (`frontend/app/**`).
#
# NGOẠI LỆ: khai trong `docs/LEGACY_FREEZE_EXCEPTIONS.md`, mỗi dòng một đường
# dẫn kèm lý do. Cùng nguyên tắc với allowlist của cổng parity: ngoại lệ không
# lý do là tự cấp phép.

name: Legacy freeze (không thêm trang HTML mới)

on:
  pull_request:
    paths:
      - 'frontend/**/*.html'
      - 'docs/LEGACY_FREEZE_EXCEPTIONS.md'
      - '.github/workflows/legacy-freeze.yml'

permissions:
  contents: read

jobs:
  freeze:
    name: Không thêm trang HTML legacy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Tìm trang HTML mới thêm
        run: |
          BASE="origin/${{ github.base_ref }}"
          # `--diff-filter=A`: chỉ tệp THÊM MỚI. Sửa và xoá đều không sao.
          ADDED=$(git diff --diff-filter=A --name-only "$BASE"...HEAD -- \
            'frontend/*.html' 'frontend/**/*.html' || true)

          if [ -z "$ADDED" ]; then
            echo "Không có trang HTML nào được thêm."; exit 0
          fi

          EXC_FILE="docs/LEGACY_FREEZE_EXCEPTIONS.md"
          BAD=""
          for f in $ADDED; do
            # Ngoại lệ phải nêu ĐÚNG đường dẫn VÀ có lý do trên cùng dòng.
            if [ -f "$EXC_FILE" ] && grep -qE "^\s*-\s+\`?$(printf '%s' "$f" | sed 's/[.[\*^$/]/\\&/g')\`?\s*—\s*\S" "$EXC_FILE"; then
              echo "miễn trừ (có lý do khai): $f"
            else
              BAD="$BAD $f"
            fi
          done

          if [ -n "$BAD" ]; then
            echo ""
            echo "══════════════════════════════════════════════════════════"
            echo "PR này THÊM trang HTML legacy mới:"
            for f in $BAD; do echo "   + $f"; done
            echo ""
            echo "Bề mặt legacy đang là ~129 trang và VẪN LỚN LÊN. Mỗi trang"
            echo "HTML mới là một trang phải port lại sau."
            echo ""
            echo "Cách đi tiếp, chọn một:"
            echo "  1. Viết trang này bằng Next trong 'frontend/app/**' (khuyến nghị)"
            echo "  2. Nếu buộc phải dùng HTML legacy: khai vào"
            echo "     docs/LEGACY_FREEZE_EXCEPTIONS.md theo mẫu"
            echo "        - \`đường/dẫn.html\` — lý do cụ thể"
            echo "══════════════════════════════════════════════════════════"
            exit 1
          fi
