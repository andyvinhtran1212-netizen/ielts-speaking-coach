# Gate F đã retire toàn bộ HTML renderer triển khai được ngày 2026-09-11.
# URL cũ vẫn được giữ bằng manifest redirect; file HTML lịch sử chỉ được phép
# tồn tại dưới tests/fixtures và không được đưa trở lại public/.

name: Legacy HTML retirement guard

on:
  pull_request:
    paths:
      - 'frontend/public/**'
      - '.github/workflows/legacy-freeze.yml'
  push:
    branches: [main, staging]

permissions:
  contents: read

# CI queue (23/11): a new push or a base-branch merge on a PR cancels that
# PR's older run of this workflow instead of leaving it queued. Push, schedule
# and dispatch runs get a group of their own (run_id), so a staging/main SHA
# that the promotion gate needs is never cancelled or replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  freeze:
    name: Public không chứa HTML legacy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Xác nhận public không chứa HTML
        shell: bash
        run: |
          mapfile -t PUBLIC_SYMLINKS < <(find frontend/public -type l -print | sort)
          if ((${#PUBLIC_SYMLINKS[@]})); then
            printf '::error::Gate F regression: public symlink could expose retired artifacts: %s\n' "${PUBLIC_SYMLINKS[*]}"
            exit 1
          fi
          mapfile -t HTML_FILES < <(find frontend/public -type f -name '*.html' -print | sort)
          if ((${#HTML_FILES[@]})); then
            printf '::error::Gate F regression: deployable Legacy HTML returned: %s\n' "${HTML_FILES[*]}"
            exit 1
          fi
          echo 'Gate F guard: 0 deployable HTML files.'
