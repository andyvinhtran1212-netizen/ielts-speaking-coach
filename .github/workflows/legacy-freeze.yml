# Gate F đã retire toàn bộ HTML renderer triển khai được ngày 2026-09-11.
# URL cũ vẫn được giữ bằng manifest redirect; file HTML lịch sử chỉ được phép
# tồn tại dưới tests/fixtures và không được đưa trở lại public/.

name: Legacy HTML retirement guard

on:
  pull_request:
    paths:
      - 'frontend/public/**/*.html'
      - '.github/workflows/legacy-freeze.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  freeze:
    name: Public không chứa HTML legacy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Xác nhận public không chứa HTML
        shell: bash
        run: |
          mapfile -t HTML_FILES < <(find frontend/public -type f -name '*.html' -print | sort)
          if ((${#HTML_FILES[@]})); then
            printf '::error::Gate F regression: deployable Legacy HTML returned: %s\n' "${HTML_FILES[*]}"
            exit 1
          fi
          echo 'Gate F guard: 0 deployable HTML files.'
