      - '.github/workflows/parity-gate.yml'
  # SAU KHI MERGE. Cổng theo PR chỉ chứng minh «nhánh này so với main LÚC ĐÓ»;
  # nó KHÔNG chứng minh main sau khi hợp nhất. Ngày 2026-08-07 chín PR chồng
  # nhau lên main liên tiếp, mỗi PR đều xanh, mà trạng thái hợp nhất không cổng
  # nào chạm tới — phải dispatch tay mới biết main lành. Main deploy thẳng ra
  # production, nên đó là khoảng trống ngay trước mặt người dùng.
  #
  # KHÔNG khai `paths:` ở đây. Bộ lọc đường dẫn hợp lý cho PR (tiết kiệm lượt
  # chạy khi nhánh không đụng gì liên quan), nhưng ở đây câu hỏi là «main còn
  # lành không» — và câu đó không phụ thuộc vào việc lần merge NÀY đụng tệp nào.
  push:
    branches: [main]
  # Bộ ĐẦY ĐỦ chạy hằng đêm — nhưng đọc là BEST-EFFORT, không phải bảo đảm.
  # Đo 2026-08-04: cron này CHƯA TỪNG CHẠY lần nào, và cron `*/15` của G2 bị
  # GitHub giãn ra trung vị 84 phút (khai 15). Lịch trên GitHub Actions là
  # best-effort thật sự. Lớp bảo vệ THẬT của G1 là cổng theo PR ở dưới; đêm chỉ
  # là phần thêm. Đừng viết tài liệu nào dựa vào việc cron này chạy đúng giờ.
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
    inputs:
      scope:
        description: "categories (nhanh) · full (gồm mọi trang bài viết) · authed (trang cần đăng nhập)"
        default: categories
        type: choice
        options: [categories, full, authed]

permissions:
  contents: read

concurrency:
  # PHẢI có `event_name` trong group. Trước đây group chỉ theo `github.ref`, mà
  # push lên main, lịch đêm và dispatch tay đều mang `refs/heads/main` — nên một
  # lần dispatch `scope=categories` sẽ HUỶ lượt post-merge đang chạy `full +
  # authed`, rồi báo xanh. Commit đó vĩnh viễn không được lượt nào kiểm đủ, và
  # bảng check thì trông y hệt lúc kiểm đủ.
  #
  # Giữa hai lần PUSH thì vẫn huỷ lượt cũ, và đó là cố ý: chỉ tip hiện tại mới
  # là thứ đang chạy trên production. Hệ quả phải nói thẳng — trong một chuỗi
  # merge dày, các commit ở giữa KHÔNG được kiểm riêng; thứ được bảo đảm là
  # «main lành ở tip mới nhất», không phải «mỗi commit đều lành».
  group: parity-gate-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  # Cả hai vế cùng trỏ backend production. `prebuild` sinh `runtime-config.js`
  # từ đúng biến này, nên vế legacy chạy trên localhost vẫn gọi đúng backend.
  AVER_API_BASE: https://ielts-speaking-coach-production.up.railway.app
  AVER_SUPABASE_URL: https://huwsmtubwulikhlmcirx.supabase.co
  AVER_SUPABASE_ANON_KEY: sb_publishable_hvevBST9lgIWRd5ITHtUpA_SYjiX6Ao
  AVER_ENVIRONMENT: production
  # CỔNG KHÔNG TUỲ Ý. Backend chỉ cho CORS từ đúng vài origin (`main.py:118`):
  # localhost:3000 · 127.0.0.1:3000 · localhost:5500 · 127.0.0.1:5500. Chạy ở
  # cổng khác thì vế legacy KHÔNG fetch được, trang hiện "Lỗi: Failed to fetch",
  # và nếu không ai để ý thì bộ so vẫn chạy trên một nền tham chiếu rác. Đã đo
  # đúng ca đó: cổng 3300 ⇒ 938 `line-extra` toàn mức thấp + 26 `baseline-suspect`.
  PARITY_PORT: '3000'

jobs:
  parity:
    name: G1 parity legacy ↔ Next
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
        with:
          # Cần lịch sử để so diff với nhánh gốc mà chọn phạm vi.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cài phụ thuộc
        run: npm ci

      - name: Build (prebuild sinh runtime-config trỏ backend production)
        run: npm run build

      - name: Cài Chromium cho Playwright
        run: npx playwright install --with-deps chromium

      - name: Khởi động Next
        run: |
          npx next start -p "$PARITY_PORT" > /tmp/next.log 2>&1 &
          echo $! > /tmp/next.pid
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:$PARITY_PORT/grammar" || true)
            if [ "$code" = "200" ]; then echo "Next sẵn sàng sau ${i}s"; exit 0; fi
            sleep 1
          done
          echo "Next KHÔNG khởi động được (cổng bận?):"; tail -40 /tmp/next.log; exit 1

      # Chốt chặn hạ tầng: nếu vế legacy không gọi được backend thì mọi so sánh
      # sau đó vô giá trị — bản Next sẽ chỉ toàn "thừa" (mức thấp) và cả bảng
      # xanh. Bộ so có `baseline-suspect` cho việc này, nhưng kiểm sớm ở đây thì
      # thông báo dễ hiểu hơn nhiều so với một bảng lệch dài.
      - name: Kiểm vế legacy phục vụ được VÀ gọi được backend
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:$PARITY_PORT/grammar.html")
          [ "$code" = "200" ] || { echo "legacy /grammar.html trả $code"; exit 1; }
          # Trang trả 200 KHÔNG chứng minh nó fetch được — legacy render phía
          # client, fetch hỏng thì trang vẫn 200 và chỉ hiện "Lỗi: Failed to
          # fetch". Kiểm thẳng preflight CORS từ đúng origin sẽ dùng.
          allow=$(curl -s -o /dev/null -D- -X OPTIONS "$AVER_API_BASE/api/grammar/home" \
            -H "Origin: http://localhost:$PARITY_PORT" \
            -H "Access-Control-Request-Method: GET" | tr -d '\r' \
            | grep -i '^access-control-allow-origin' || true)
          if [ -z "$allow" ]; then
            echo "CORS KHÔNG cho phép http://localhost:$PARITY_PORT."
            echo "Backend chỉ cho vài origin cố định (backend/main.py:118)."
            echo "Đổi PARITY_PORT về một cổng có trong allowlist, ĐỪNG chạy tiếp:"
            echo "nền so sẽ hỏng và bảng kết quả sẽ vô nghĩa."
            exit 1
          fi
          echo "CORS OK: $allow"

      # PHẠM VI PHẢI THEO NỘI DUNG PR, không phải một hằng số.
      # PR sửa bộ render bài viết (`[category]/[slug]/**`) mà chỉ chạy
      # `--categories-only` thì lần chạy CHẶN-MERGE không hề mở một trang bài
      # nào; lịch đêm chỉ phát hiện SAU khi đã merge. Ca đó phải chạy bộ đầy đủ.
      - name: Chọn phạm vi theo tệp đã sửa
        id: scope
        run: |
          if [ -n "${{ inputs.scope }}" ]; then
            echo "scope=${{ inputs.scope }}" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # `schedule` và `push` (main) KHÔNG có nhánh gốc để so diff — không suy
          # ra phạm vi được, nên chạy TẤT CẢ. Cả hai đều phải đặt `authed=true`:
          # bản cũ `exit 0` ngay sau khi đặt `scope=full`, để cờ authed RỖNG, nên
          # lịch đêm chưa bao giờ so 21 cặp cần-đăng-nhập — tức phần lớn trang
          # học viên chỉ được so trong PR chứ chưa lần nào trên main.
          case "${{ github.event_name }}" in
            schedule|push)
              echo "sự kiện ${{ github.event_name }} ⇒ chạy full + authed"
              echo "scope=full" >> "$GITHUB_OUTPUT"
              echo "authed=true" >> "$GITHUB_OUTPUT"
              exit 0 ;;
          esac
          BASE="origin/${{ github.base_ref }}"
          CHANGED=$(git diff --name-only "$BASE"...HEAD || true)
          echo "tệp đã sửa:"; echo "$CHANGED" | sed 's/^/  /'
          if echo "$CHANGED" | grep -qE 'frontend/app/\(public-content\)/grammar/\[category\]/\[slug\]/|frontend/tooling/parity-|frontend/lib/|frontend/components/|frontend/public/pages/grammar-article\.html'; then
            echo "→ đụng bộ render BÀI VIẾT hoặc tầng dùng chung ⇒ phạm vi FULL"
            echo "scope=full" >> "$GITHUB_OUTPUT"
          else
            echo "→ phạm vi categories (trang chủ + thư mục)"
            echo "scope=categories" >> "$GITHUB_OUTPUT"
          fi

          # Vế authed là CỜ RIÊNG, không phải một giá trị của `scope`. Lý do:
          # một PR có thể đụng CẢ khu grammar lẫn trang authed; nếu ép chọn một
          # thì vế kia âm thầm không được so — đúng kiểu "cổng tự cấp phép" mà
          # đầu tệp này cảnh báo.
          if echo "$CHANGED" | grep -qE 'frontend/app/\((authed-home|authed-speaking|authed-writing|authed-reading|authed-listening|authed-exercises|authed-flashcards|authed-vocab-exam|authed-full-test|authed-vocab-practice|authed-speaking-result|authed-quiz-progress|authed-mock-result|authed-vocabulary-hub)\)/|frontend/public/pages/speaking\.html|frontend/public/css/speaking\.css|frontend/public/js/cue-card-detector\.js|frontend/lib/|frontend/components/|frontend/public/js/(api|theme-toggle|user-pill)\.js|frontend/public/js/components/(aver-chrome|perf-hints)\.js|frontend/public/pages/home\.html|frontend/public/js/home\.js|frontend/public/css/(home|mock-hub|writing-dashboard)\.css|frontend/public/pages/(exercises|flashcards|vocab-exam|full-test|vocab-practice|speaking-result|quiz-progress|mock-result|vocabulary|writing-dashboard|reading-vocab|reading-skill|reading-test|reading-mini-test|listening|listening-tests|listening-mini-test|listening-skills|listening-practice|listening-browse|listening-analytics)\.html|frontend/public/js/(reading-vocab|reading-skill|reading-test|reading-mini-test|listening-tests-list|listening-list-paging|listening-mini-test|listening-skills|listening-practice|listening-landing|listening-browse|listening-analytics)\.js|frontend/public/css/(reading-vocab|listening|listening-tests|listening-mini-test|listening-skills|listening-practice|listening-browse|listening-analytics)\.css|frontend/public/css/(tailwind\.build|ds|exercises|flashcards|vocab-exam|full-test|vocab-practice|speaking-result|quiz-progress|mock-result|vocabulary|aver-design/tokens|aver-design/components)\.css|frontend/public/js/vocab-modules/|frontend/public/js/(vocab-exam|full-test|vocab-practice|speaking-result|quiz-progress|mock-result|vocab-landing|error-reporter)\.js|frontend/tooling/(supabase-session\.mjs|parity-pairs-authed\.json|parity-core\.mjs|parity-diff\.mjs|generate-runtime-config\.mjs)|frontend/app/layout\.tsx'; then
            echo "→ có đụng vế CẦN ĐĂNG NHẬP ⇒ chạy thêm lượt authed"
            echo "authed=true" >> "$GITHUB_OUTPUT"
          else
            echo "authed=false" >> "$GITHUB_OUTPUT"
          fi

      # HAI BỀ RỘNG. Lượt 1280 mù hoàn toàn với hồi quy theo breakpoint — đã
      # chứng minh bằng thí nghiệm: gài `hidden sm:block` vào đoạn mô tả hero
      # của bản Next rồi so ⇒ 1280px cho 0 phát hiện, 375px bắt được
      # `line-missing: Tra cứu nhanh, học theo roadmap…`.
      #
      # Lỗi H1 dính chữ (#907) bắt được ở 1280 chỉ vì nó TÌNH CỜ cũng là khác
      # biệt văn bản; một khối ẩn/hiện lệch nhau theo breakpoint thì không.
      #
      # Chạy CẢ HAI rồi mới thoát, để báo cáo hiện đủ hai bề rộng thay vì dừng
      # ở cái đỏ đầu tiên.
      - name: Chạy cổng parity (desktop + điện thoại)
        env:
          PROBE_EMAIL: ${{ secrets.PROBE_EMAIL }}
          PROBE_PASSWORD: ${{ secrets.PROBE_PASSWORD }}
        run: |
          SCOPE="${{ steps.scope.outputs.scope }}"
          AUTHED="${{ steps.scope.outputs.authed }}"

          # Danh sách LƯỢT phải chạy. `authed` so trang CẦN ĐĂNG NHẬP; giữ nó
          # thành lượt riêng vì nó cần secret và chỉ so được TRẠNG THÁI RỖNG
          # (tài khoản probe không có dữ liệu học tập) — gộp vào lượt thường sẽ
          # khiến người đọc báo cáo tưởng đã phủ cả dữ liệu.
          if [ "$SCOPE" = "authed" ]; then
            RUNS="authed"                    # dispatch tay, chỉ muốn authed
          else
            RUNS="$SCOPE"
            [ "$AUTHED" = "true" ] && RUNS="$RUNS authed"
          fi
          echo "các lượt sẽ chạy: $RUNS"

          case " $RUNS " in *" authed "*)
            if [ -z "$PROBE_EMAIL" ] || [ -z "$PROBE_PASSWORD" ]; then
              echo "::error::Cần so vế authed nhưng THIẾU secret PROBE_EMAIL/PROBE_PASSWORD."
              echo "Không bỏ qua âm thầm: bỏ qua ở đây thì cổng báo xanh mà chưa từng mở trang."
              exit 1
            fi ;;
          esac

          FAIL=0
          INFRA=0
          for S in $RUNS; do
            case "$S" in
              authed) ARGS="--auth --pairs tooling/parity-pairs-authed.json" ;;
              full)   ARGS="--expand-grammar" ;;
              *)      ARGS="--expand-grammar --categories-only" ;;
            esac
            for VP in 1280x900 375x812; do
              echo "════════ lượt $S · bề rộng $VP ════════"
              # `|| RC=$?` thay vì bật/tắt `set -e`: bước này chạy dưới `bash -e`,
              # và đụng vào trạng thái đó sẽ đổi hành vi của mọi lệnh phía sau.
              RC=0
              node tooling/parity-diff.mjs --base "http://localhost:$PARITY_PORT" \
                $ARGS --viewport "$VP" --concurrency 3 --json "out/parity-$S-$VP.json" || RC=$?
              # PHÂN BIỆT HAI LOẠI ĐỎ. Mã 3 = không gọi được backend, tức bộ so
              # KHÔNG kết luận gì về parity. Gộp nó vào FAIL sẽ hiện ra như «bản
              # Next lệch bản legacy» — một lời khẳng định chưa đo được, và vài
              # lần như thế là người ta bắt đầu bỏ qua cổng này.
              case "$RC" in
                0) ;;
                3) INFRA=1
                   echo "::warning::lượt $S/$VP KHÔNG kết luận được: backend không gọi được" ;;
                # 4 = VỪA lệch parity VỪA hỏng hạ tầng. Phải đặt CẢ HAI cờ: gộp
                # nó vào 3 sẽ in ra thông điệp «không phải phát hiện parity»
                # trong khi báo cáo đang chứa cặp lệch thật.
                4) INFRA=1; FAIL=1
                   echo "::warning::lượt $S/$VP: có cặp lệch THẬT và có cặp không gọi được backend" ;;
                *) FAIL=1 ;;
              esac
            done
          done
          if [ "$INFRA" = "1" ]; then
            echo "::error::Cổng parity không chạy xong được vì backend không gọi được (mã 3)."
            echo "Đây KHÔNG phải phát hiện về parity. Kiểm backend production rồi chạy lại."
          fi
          # Vẫn đỏ khi hạ tầng hỏng — bỏ qua trong im lặng thì lần merge kế tiếp
          # đi qua một cổng chưa từng chạy. Đỏ, nhưng đỏ ĐÚNG LÝ DO.
          #
          # Dạng `if` tường minh thay cho `A || B && C`. Đo thật thì dạng kia
          # KHÔNG sai ở đây (bash không kích hoạt `-e` cho lệnh nằm giữa danh
          # sách `||`/`&&`), nhưng nó đọc như «hoặc A, hoặc B-rồi-C» trong khi
          # thực chất là `(A || B) && C`, và trạng thái thoát của nó phụ thuộc
          # vào lệnh nào được chạy sau cùng. Ở một dòng quyết định cổng đỏ hay
          # xanh, thứ cần là đọc phát hiểu ngay.
          if [ "$FAIL" = "1" ] || [ "$INFRA" = "1" ]; then
            exit 1
          fi
          exit 0

      # Cổng parity so TRẠNG THÁI TĨNH — nó không bấm gì, nên không phân biệt
      # được "nút có nhãn đúng" với "nút LÀM ĐÚNG VIỆC". Ba lỗi lọt qua trong
      # đợt port `/speaking` đều thuộc loại đó (listener gắn vào id không tồn
      # tại; thiếu `cue-card-detector.js`; biểu đồ không chờ Chart.js) — build
      # xanh, test xanh, nút không làm gì.
      #
      # Bước này đi HẾT luồng tạo phiên trong trình duyệt thật, chặn mạng và trả
      # dữ liệu sẵn: không cần secret, không ghi vào đâu cả. Nó KHÔNG thay thế
      # `tests/staging-e2e/speaking-start-flow.spec.js` (bản đó chứng minh phiên
      # được tạo THẬT ở backend) — nó chỉ chứng minh phía trình duyệt gửi đúng,
      # nhưng đó lại là phần mà cổng parity mù hoàn toàn.
      # KHÔNG gác sau `authed`: bước này dùng phiên GIẢ và chặn mạng, nó không
      # cần secret nào. Bản đầu tôi gác nó và chính PR thêm nó đã KHÔNG chạy nó
      # (`authed` false vì chỉ sửa workflow + tooling) — đúng lớp lỗi Codex bắt
      # hai lần: chốt tồn tại mà không bao giờ nổ. Chạy mỗi khi job chạy.
      - name: Kiểm luồng tạo phiên (Speaking)
        run: node tooling/verify-speaking-flow.mjs "http://localhost:$PARITY_PORT"

      # `/reading/vocab` đã chuyển request/filter/state sang React. Cổng parity
      # chỉ chụp một trạng thái tĩnh nên không chứng minh được malformed payload,
      # request filter bị supersede hay nút reset. Runner này dùng browser thật,
      # phiên + backend giả và chặn toàn bộ request; không cần secret, không ghi
      # vào dữ liệu nào.
      - name: Kiểm luồng Reading Vocab native
        run: node tooling/verify-reading-vocab-flow.mjs "http://localhost:$PARITY_PORT"

      # `/reading/skill` cũng sở hữu request/filter/state bằng React. Chạy độc
      # lập để bắt canonical total, nhóm kỹ năng, response filter cũ và reset.
      - name: Kiểm luồng Reading Skill native
        run: node tooling/verify-reading-skill-flow.mjs "http://localhost:$PARITY_PORT"

      # `/reading/test` sở hữu filter/card/state bằng React; kiểm canonical
      # total, test_type=full, reset và response cũ ngay trên production build.
      - name: Kiểm luồng Reading Full Test native
        run: node tooling/verify-reading-test-flow.mjs "http://localhost:$PARITY_PORT"

      # Mini Test có default và thống kê duration riêng; runner này ngăn nó
      # trượt về default Full Test khi phần behavior được đổi.
      - name: Kiểm luồng Reading Mini Test native
        run: node tooling/verify-reading-mini-test-flow.mjs "http://localhost:$PARITY_PORT"

      # `/listening/tests` phân biệt activity attempt với submitted attempt.
      # Runner browser khóa lại filter, trạng thái card, CTA và escaping thật.
      - name: Kiểm luồng Listening Full Tests native
        run: node tooling/verify-listening-tests-flow.mjs "http://localhost:$PARITY_PORT"

      # Mini Tests có score không cố định và completion dựa trên submitted.
      - name: Kiểm luồng Listening Mini Test native
        run: node tooling/verify-listening-mini-test-flow.mjs "http://localhost:$PARITY_PORT"

      # CỔNG ĐƯỜNG-GHI. Bổ sung cho bước trên chứ không thay thế: bước kia
      # kiểm MỘT luồng đi hết đường (bấm → gửi → điều hướng), bước này kiểm
      # MỌI request ghi mà trang phát ra và đòi chúng đã được KHAI BÁO TRƯỚC.
      # Một request ghi không nằm trong bản khai là lỗi — đó đúng là hình dạng
      # của "nút làm SAI việc", thứ mà cổng parity tĩnh không thể thấy.
      #
      # Không cần secret, không ghi vào đâu (mạng bị chặn, dữ liệu trả sẵn).
      - name: Cổng đường-ghi
        run: node tooling/verify-write-flows.mjs "http://localhost:$PARITY_PORT"

      # CÙNG bản khai, chạy trên vế LEGACY. Đây là thứ biến bản khai từ "test
      # của bản Next" thành HỢP ĐỒNG: nếu chỉ chạy vế Next thì bản khai chỉ mô
      # tả đúng thứ vừa được viết, và một đường ghi bị bỏ sót lúc port sẽ bỏ sót
      # y hệt ở cả hai nơi. Bắt nó xanh trên trang legacy nghĩa là nó mô tả hành
      # vi CÓ THẬT, đo được, trước khi bản Next tồn tại.
      #
      # Chỉ chạy các luồng CÓ khai `legacyRoute`; luồng của trang chỉ-có-Next sẽ
      # rơi về `route` và bước này thành trùng lặp vô hại.
      - name: Cổng đường-ghi (vế legacy — cùng bản khai)
        env:
          WF_LEGACY: '1'
        run: node tooling/verify-write-flows.mjs "http://localhost:$PARITY_PORT"

      - name: Nộp báo cáo
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: parity-report-${{ github.run_id }}
          path: frontend/out/parity-*.json
          if-no-files-found: warn

      - name: Dừng Next
        if: ${{ always() }}
        run: kill "$(cat /tmp/next.pid)" 2>/dev/null || true
