# G1 của ADR-013-A1 — cổng parity legacy ↔ Next, chạy trong CI.
#
# Trước workflow này, cổng parity chỉ chạy khi có người NHỚ chạy tay. Một cổng
# phụ thuộc trí nhớ thì không phải cổng — và ADR-013-A1 đã ghi "gác G1 trong CI"
# là việc phải làm.
#
# VÌ SAO DỰNG CẢ HAI VẾ NGAY TRONG RUNNER, KHÔNG DÙNG PREVIEW VERCEL:
#   · Preview của Vercel bị khoá SSO — `curl` chỉ nhận lại trang đăng nhập, nên
#     không so được (đã đo).
#   · `next start` phục vụ CẢ hai vế: route Next (`/grammar`) và tệp tĩnh legacy
#     trong `public/` (`/grammar.html`). Một tiến trình, không cần deploy.
#   · Trang legacy gọi backend theo `runtime-config.js`, mà `_RC.apiBase` thắng
#     heuristic hostname (`js/api.js:55-60`). Đặt `AVER_API_BASE` là cả hai vế
#     cùng trỏ backend production. Đã đo: backend cho phép CORS từ
#     `http://localhost:3000`.
#
# Bộ so CHỈ ĐỌC: nó chặn mọi phương thức ghi và in ra danh sách đã chặn.

# Không dùng Vercel Cron dù công cụ gợi ý: job này BUILD Next rồi LÁI Chromium
# trong runner. Vercel Cron chỉ gọi một HTTP endpoint trong deployment — không
# build được, không chạy trình duyệt được, và lại phụ thuộc vào chính deployment
# đang được đo.

name: Parity gate (G1)

on:
  # BỘ LỌC CHỈ LIỆT KÊ NHỮNG GÌ G1 THẬT SỰ SO ĐƯỢC.
  #
  # G1 cần CẢ HAI bản còn được phục vụ. Kiểm trên production:
  #   /index.html         → 307 sang `/`  ⇒ bản legacy của trang chủ ĐÃ GỠ khi
  #                         cutover pilot 1 ⇒ không còn gì để so
  #   /pages/profile.html → 307 sang `/profile` ⇒ tương tự, và route này còn cần
  #                         đăng nhập nên bản ẩn danh không so được
  # Cả hai ca trên đều bị chốt `same-final-url` từ chối — đã đo.
  #
  # Trước bản này bộ lọc bắt cả `frontend/app/**`, nên một PR sửa `/` hay
  # `/profile` sẽ kích hoạt job rồi BÁO XANH mà chưa từng mở route đã sửa. Cổng
  # tự cấp phép còn tệ hơn không có cổng.
  #
  # HỆ QUẢ CẦN NHỚ: giá trị của G1 là HỮU HẠN theo từng route — nó chỉ tồn tại
  # từ lúc dựng bản Next tới lúc gỡ bản legacy. Sau khi gỡ legacy, route đó
  # được che bởi test + G2 + rollback, không còn parity nữa.
  pull_request:
    paths:
      - 'frontend/app/(public-content)/**'
      # Vế CẦN ĐĂNG NHẬP (cặp `/pages/home.html` ↔ `/home`).
      # Thiếu những dòng này thì một PR sửa đúng trang authed sẽ KHÔNG kích hoạt
      # job, và cổng authed chỉ chạy khi có người nhớ dispatch tay — tức lại là
      # "cổng phụ thuộc trí nhớ" mà chính đầu tệp này đã bác bỏ. (Codex bắt ở
      # PR #930; kiểm lại đúng: lần chạy authed trước đó là do dispatch tay.)
      # CHỈ `(authed-home|authed-speaking|authed-writing)`. KHÔNG thêm `(authed)`: nó chứa `/profile`, mà
      # `/pages/profile.html` đã 307 sang `/profile` khi cutover pilot 3 ⇒
      # không còn vế legacy để so. Bắt nó vào đây là để job chạy rồi BÁO XANH
      # mà chưa từng mở route đã sửa. Có test chặn đúng chuyện đó
      # (`parity-core.test.mjs` → "bộ lọc KHÔNG bắt route mà G1 không so được"),
      # và nó đã bắt tôi khi tôi thêm nhầm.
      - 'frontend/app/(authed-home)/**'
      # Vế Speaking (cặp `/pages/speaking.html` ↔ `/speaking-preview`). Thêm
      # CÙNG LÚC với cặp parity — thêm cặp mà quên glob là dựng đúng một cổng
      # không bao giờ tự kích hoạt, y hệt phát hiện của Codex trên PR #930.
      - 'frontend/app/(authed-speaking)/**'
      - 'frontend/public/pages/speaking.html'
      - 'frontend/public/css/speaking.css'
      - 'frontend/public/js/cue-card-detector.js'
      # CẢ hai cây mã dùng chung, không ghim từng tệp. Job này chạy `npm run
      # build`, nên BẤT KỲ component/lib nào cũng có thể lọt vào chunk của trang
      # đang so — thêm một shared component mới mà quên bổ sung glob thì cổng
      # không chạy cho đúng PR ấy (Codex bắt ở #946 vòng 3).
      # Việc khoanh theo NHÓM ROUTE ở dưới vẫn giữ nguyên: đổi một route không
      # đổi DOM route khác, còn mã dùng chung thì đổi được bất kỳ trang nào.
      - 'frontend/lib/**'
      - 'frontend/components/**'
      - 'frontend/public/pages/home.html'
      - 'frontend/public/js/home.js'
      # CSS có mặt vì G1 so theo BỀ RỘNG: một khối ẩn/hiện lệch breakpoint là
      # khác biệt thật mà chỉ lượt 375 bắt được.
      - 'frontend/public/css/home.css'
      - 'frontend/public/css/mock-hub.css'
      # Vế Bài viết (cặp `/pages/writing-dashboard.html` ↔ `/writing/dashboard`).
      # Ba dòng này CỐ Ý nằm trong khối authed: `parity-core.test.mjs` cắt đúng
      # khối này và đòi MỌI glob trong đó phải được regex chọn-phạm-vi authed
      # bắt. Đặt ra ngoài thì glob vẫn kích hoạt job nhưng job chạy lượt
      # `categories` và KHÔNG BAO GIỜ mở cặp writing — đúng lỗi Codex bắt ở #937,
      # và không chốt nào nổ. Trong khối thì máy canh thay cho trí nhớ.
      - 'frontend/app/(authed-writing)/**'
      - 'frontend/public/pages/writing-dashboard.html'
      - 'frontend/public/css/writing-dashboard.css'
      - 'frontend/tooling/supabase-session.mjs'
      - 'frontend/tooling/parity-pairs-authed.json'
      - 'frontend/lib/backend.ts'
      - 'frontend/lib/grammar-api.ts'
      - 'frontend/public/grammar.html'
      - 'frontend/public/js/grammar.js'
      - 'frontend/public/pages/grammar-article.html'
      - 'frontend/public/js/components/aver-chrome.js'
      - 'frontend/tooling/parity-core.mjs'
      - 'frontend/tooling/parity-diff.mjs'
      # Sửa chính bộ kiểm luồng phải chạy lại nó.
      - 'frontend/tooling/verify-speaking-flow.mjs'
      # Sửa lõi cổng ghi hoặc bất kỳ bản khai luồng nào phải chạy lại cổng đó.
      - 'frontend/tooling/verify-write-flows.mjs'
      - 'frontend/tooling/write-flow-core.mjs'
      - 'frontend/tooling/write-flows/**'
      # Mã DÙNG CHUNG dựng request: đổi cách `api.post/patch` được tạo là đổi
      # MỌI đường ghi của mọi trang, nên nó phải kích hoạt cổng ghi. Thiếu dòng
      # này thì một PR sửa `api.js` merge được mà chỉ qua test tĩnh
      # (Codex bắt ở PR #944).
      - 'frontend/public/js/api.js'
      - 'frontend/public/js/analytics-beacon.js'
      - 'frontend/next.config.ts'
      - 'frontend/package-lock.json'
      # `package.json` quyết định script nào chạy và dải phiên bản nào được cài;
      # `tsconfig.json` định nghĩa bí danh `@/*` — đổi ánh xạ đó là đổi mã được
      # gộp vào bundle. Ghim mỗi lock-file là chưa đủ (Codex bắt ở #946 vòng 4).
      - 'frontend/package.json'
      - 'frontend/tsconfig.json'
      - '.github/workflows/parity-gate.yml'
  # Bộ ĐẦY ĐỦ chạy hằng đêm — nhưng đọc là BEST-EFFORT, không phải bảo đảm.
  # Đo 2026-08-04: cron này CHƯA TỪNG CHẠY lần nào, và cron `*/15` của G2 bị
  # GitHub giãn ra trung vị 84 phút (khai 15). Lịch trên GitHub Actions là
  # best-effort thật sự. Lớp bảo vệ THẬT của G1 là cổng theo PR ở dưới; đêm chỉ
  # là phần thêm. Đừng viết tài liệu nào dựa vào việc cron này chạy đúng giờ.
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
    inputs:
      scope:
        description: "categories (nhanh) · full (gồm mọi trang bài viết) · authed (trang cần đăng nhập)"
        default: categories
        type: choice
        options: [categories, full, authed]

permissions:
  contents: read

concurrency:
  group: parity-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  # Cả hai vế cùng trỏ backend production. `prebuild` sinh `runtime-config.js`
  # từ đúng biến này, nên vế legacy chạy trên localhost vẫn gọi đúng backend.
  AVER_API_BASE: https://ielts-speaking-coach-production.up.railway.app
  AVER_SUPABASE_URL: https://huwsmtubwulikhlmcirx.supabase.co
  AVER_SUPABASE_ANON_KEY: sb_publishable_hvevBST9lgIWRd5ITHtUpA_SYjiX6Ao
  AVER_ENVIRONMENT: production
  # CỔNG KHÔNG TUỲ Ý. Backend chỉ cho CORS từ đúng vài origin (`main.py:118`):
  # localhost:3000 · 127.0.0.1:3000 · localhost:5500 · 127.0.0.1:5500. Chạy ở
  # cổng khác thì vế legacy KHÔNG fetch được, trang hiện "Lỗi: Failed to fetch",
  # và nếu không ai để ý thì bộ so vẫn chạy trên một nền tham chiếu rác. Đã đo
  # đúng ca đó: cổng 3300 ⇒ 938 `line-extra` toàn mức thấp + 26 `baseline-suspect`.
  PARITY_PORT: '3000'

jobs:
  parity:
    name: G1 parity legacy ↔ Next
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
        with:
          # Cần lịch sử để so diff với nhánh gốc mà chọn phạm vi.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cài phụ thuộc
        run: npm ci

      - name: Build (prebuild sinh runtime-config trỏ backend production)
        run: npm run build

      - name: Cài Chromium cho Playwright
        run: npx playwright install --with-deps chromium

      - name: Khởi động Next
        run: |
          npx next start -p "$PARITY_PORT" > /tmp/next.log 2>&1 &
          echo $! > /tmp/next.pid
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:$PARITY_PORT/grammar" || true)
            if [ "$code" = "200" ]; then echo "Next sẵn sàng sau ${i}s"; exit 0; fi
            sleep 1
          done
          echo "Next KHÔNG khởi động được (cổng bận?):"; tail -40 /tmp/next.log; exit 1

      # Chốt chặn hạ tầng: nếu vế legacy không gọi được backend thì mọi so sánh
      # sau đó vô giá trị — bản Next sẽ chỉ toàn "thừa" (mức thấp) và cả bảng
      # xanh. Bộ so có `baseline-suspect` cho việc này, nhưng kiểm sớm ở đây thì
      # thông báo dễ hiểu hơn nhiều so với một bảng lệch dài.
      - name: Kiểm vế legacy phục vụ được VÀ gọi được backend
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:$PARITY_PORT/grammar.html")
          [ "$code" = "200" ] || { echo "legacy /grammar.html trả $code"; exit 1; }
          # Trang trả 200 KHÔNG chứng minh nó fetch được — legacy render phía
          # client, fetch hỏng thì trang vẫn 200 và chỉ hiện "Lỗi: Failed to
          # fetch". Kiểm thẳng preflight CORS từ đúng origin sẽ dùng.
          allow=$(curl -s -o /dev/null -D- -X OPTIONS "$AVER_API_BASE/api/grammar/home" \
            -H "Origin: http://localhost:$PARITY_PORT" \
            -H "Access-Control-Request-Method: GET" | tr -d '\r' \
            | grep -i '^access-control-allow-origin' || true)
          if [ -z "$allow" ]; then
            echo "CORS KHÔNG cho phép http://localhost:$PARITY_PORT."
            echo "Backend chỉ cho vài origin cố định (backend/main.py:118)."
            echo "Đổi PARITY_PORT về một cổng có trong allowlist, ĐỪNG chạy tiếp:"
            echo "nền so sẽ hỏng và bảng kết quả sẽ vô nghĩa."
            exit 1
          fi
          echo "CORS OK: $allow"

      # PHẠM VI PHẢI THEO NỘI DUNG PR, không phải một hằng số.
      # PR sửa bộ render bài viết (`[category]/[slug]/**`) mà chỉ chạy
      # `--categories-only` thì lần chạy CHẶN-MERGE không hề mở một trang bài
      # nào; lịch đêm chỉ phát hiện SAU khi đã merge. Ca đó phải chạy bộ đầy đủ.
      - name: Chọn phạm vi theo tệp đã sửa
        id: scope
        run: |
          if [ -n "${{ inputs.scope }}" ]; then
            echo "scope=${{ inputs.scope }}" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "scope=full" >> "$GITHUB_OUTPUT"; exit 0
          fi
          BASE="origin/${{ github.base_ref }}"
          CHANGED=$(git diff --name-only "$BASE"...HEAD || true)
          echo "tệp đã sửa:"; echo "$CHANGED" | sed 's/^/  /'
          if echo "$CHANGED" | grep -qE 'frontend/app/\(public-content\)/grammar/\[category\]/\[slug\]/|frontend/tooling/parity-|frontend/lib/|frontend/components/|frontend/public/pages/grammar-article\.html'; then
            echo "→ đụng bộ render BÀI VIẾT hoặc tầng dùng chung ⇒ phạm vi FULL"
            echo "scope=full" >> "$GITHUB_OUTPUT"
          else
            echo "→ phạm vi categories (trang chủ + thư mục)"
            echo "scope=categories" >> "$GITHUB_OUTPUT"
          fi

          # Vế authed là CỜ RIÊNG, không phải một giá trị của `scope`. Lý do:
          # một PR có thể đụng CẢ khu grammar lẫn trang authed; nếu ép chọn một
          # thì vế kia âm thầm không được so — đúng kiểu "cổng tự cấp phép" mà
          # đầu tệp này cảnh báo.
          if echo "$CHANGED" | grep -qE 'frontend/app/\((authed-home|authed-speaking|authed-writing)\)/|frontend/public/pages/speaking\.html|frontend/public/css/speaking\.css|frontend/public/js/cue-card-detector\.js|frontend/lib/|frontend/components/|frontend/public/pages/home\.html|frontend/public/js/home\.js|frontend/public/css/(home|mock-hub|writing-dashboard)\.css|frontend/public/pages/writing-dashboard\.html|frontend/tooling/(supabase-session\.mjs|parity-pairs-authed\.json)'; then
            echo "→ có đụng vế CẦN ĐĂNG NHẬP ⇒ chạy thêm lượt authed"
            echo "authed=true" >> "$GITHUB_OUTPUT"
          else
            echo "authed=false" >> "$GITHUB_OUTPUT"
          fi

      # HAI BỀ RỘNG. Lượt 1280 mù hoàn toàn với hồi quy theo breakpoint — đã
      # chứng minh bằng thí nghiệm: gài `hidden sm:block` vào đoạn mô tả hero
      # của bản Next rồi so ⇒ 1280px cho 0 phát hiện, 375px bắt được
      # `line-missing: Tra cứu nhanh, học theo roadmap…`.
      #
      # Lỗi H1 dính chữ (#907) bắt được ở 1280 chỉ vì nó TÌNH CỜ cũng là khác
      # biệt văn bản; một khối ẩn/hiện lệch nhau theo breakpoint thì không.
      #
      # Chạy CẢ HAI rồi mới thoát, để báo cáo hiện đủ hai bề rộng thay vì dừng
      # ở cái đỏ đầu tiên.
      - name: Chạy cổng parity (desktop + điện thoại)
        env:
          PROBE_EMAIL: ${{ secrets.PROBE_EMAIL }}
          PROBE_PASSWORD: ${{ secrets.PROBE_PASSWORD }}
        run: |
          SCOPE="${{ steps.scope.outputs.scope }}"
          AUTHED="${{ steps.scope.outputs.authed }}"

          # Danh sách LƯỢT phải chạy. `authed` so trang CẦN ĐĂNG NHẬP; giữ nó
          # thành lượt riêng vì nó cần secret và chỉ so được TRẠNG THÁI RỖNG
          # (tài khoản probe không có dữ liệu học tập) — gộp vào lượt thường sẽ
          # khiến người đọc báo cáo tưởng đã phủ cả dữ liệu.
          if [ "$SCOPE" = "authed" ]; then
            RUNS="authed"                    # dispatch tay, chỉ muốn authed
          else
            RUNS="$SCOPE"
            [ "$AUTHED" = "true" ] && RUNS="$RUNS authed"
          fi
          echo "các lượt sẽ chạy: $RUNS"

          case " $RUNS " in *" authed "*)
            if [ -z "$PROBE_EMAIL" ] || [ -z "$PROBE_PASSWORD" ]; then
              echo "::error::Cần so vế authed nhưng THIẾU secret PROBE_EMAIL/PROBE_PASSWORD."
              echo "Không bỏ qua âm thầm: bỏ qua ở đây thì cổng báo xanh mà chưa từng mở trang."
              exit 1
            fi ;;
          esac

          FAIL=0
          for S in $RUNS; do
            case "$S" in
              authed) ARGS="--auth --pairs tooling/parity-pairs-authed.json" ;;
              full)   ARGS="--expand-grammar" ;;
              *)      ARGS="--expand-grammar --categories-only" ;;
            esac
            for VP in 1280x900 375x812; do
              echo "════════ lượt $S · bề rộng $VP ════════"
              node tooling/parity-diff.mjs --base "http://localhost:$PARITY_PORT" \
                $ARGS --viewport "$VP" --concurrency 3 --json "out/parity-$S-$VP.json" || FAIL=1
            done
          done
          exit $FAIL

      # Cổng parity so TRẠNG THÁI TĨNH — nó không bấm gì, nên không phân biệt
      # được "nút có nhãn đúng" với "nút LÀM ĐÚNG VIỆC". Ba lỗi lọt qua trong
      # đợt port `/speaking` đều thuộc loại đó (listener gắn vào id không tồn
      # tại; thiếu `cue-card-detector.js`; biểu đồ không chờ Chart.js) — build
      # xanh, test xanh, nút không làm gì.
      #
      # Bước này đi HẾT luồng tạo phiên trong trình duyệt thật, chặn mạng và trả
      # dữ liệu sẵn: không cần secret, không ghi vào đâu cả. Nó KHÔNG thay thế
      # `tests/staging-e2e/speaking-start-flow.spec.js` (bản đó chứng minh phiên
      # được tạo THẬT ở backend) — nó chỉ chứng minh phía trình duyệt gửi đúng,
      # nhưng đó lại là phần mà cổng parity mù hoàn toàn.
      # KHÔNG gác sau `authed`: bước này dùng phiên GIẢ và chặn mạng, nó không
      # cần secret nào. Bản đầu tôi gác nó và chính PR thêm nó đã KHÔNG chạy nó
      # (`authed` false vì chỉ sửa workflow + tooling) — đúng lớp lỗi Codex bắt
      # hai lần: chốt tồn tại mà không bao giờ nổ. Chạy mỗi khi job chạy.
      - name: Kiểm luồng tạo phiên (Speaking)
        run: node tooling/verify-speaking-flow.mjs "http://localhost:$PARITY_PORT"

      # CỔNG ĐƯỜNG-GHI. Bổ sung cho bước trên chứ không thay thế: bước kia
      # kiểm MỘT luồng đi hết đường (bấm → gửi → điều hướng), bước này kiểm
      # MỌI request ghi mà trang phát ra và đòi chúng đã được KHAI BÁO TRƯỚC.
      # Một request ghi không nằm trong bản khai là lỗi — đó đúng là hình dạng
      # của "nút làm SAI việc", thứ mà cổng parity tĩnh không thể thấy.
      #
      # Không cần secret, không ghi vào đâu (mạng bị chặn, dữ liệu trả sẵn).
      - name: Cổng đường-ghi
        run: node tooling/verify-write-flows.mjs "http://localhost:$PARITY_PORT"

      # CÙNG bản khai, chạy trên vế LEGACY. Đây là thứ biến bản khai từ "test
      # của bản Next" thành HỢP ĐỒNG: nếu chỉ chạy vế Next thì bản khai chỉ mô
      # tả đúng thứ vừa được viết, và một đường ghi bị bỏ sót lúc port sẽ bỏ sót
      # y hệt ở cả hai nơi. Bắt nó xanh trên trang legacy nghĩa là nó mô tả hành
      # vi CÓ THẬT, đo được, trước khi bản Next tồn tại.
      #
      # Chỉ chạy các luồng CÓ khai `legacyRoute`; luồng của trang chỉ-có-Next sẽ
      # rơi về `route` và bước này thành trùng lặp vô hại.
      - name: Cổng đường-ghi (vế legacy — cùng bản khai)
        env:
          WF_LEGACY: '1'
        run: node tooling/verify-write-flows.mjs "http://localhost:$PARITY_PORT"

      - name: Nộp báo cáo
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: parity-report-${{ github.run_id }}
          path: frontend/out/parity-*.json
          if-no-files-found: warn

      - name: Dừng Next
        if: ${{ always() }}
        run: kill "$(cat /tmp/next.pid)" 2>/dev/null || true
