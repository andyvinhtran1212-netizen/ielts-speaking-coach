      # job, và cổng authed chỉ chạy khi có người nhớ dispatch tay — tức lại là
      # "cổng phụ thuộc trí nhớ" mà chính đầu tệp này đã bác bỏ. (Codex bắt ở
      # PR #930; kiểm lại đúng: lần chạy authed trước đó là do dispatch tay.)
      # CHỈ `(authed-home|authed-speaking|authed-writing)`. KHÔNG thêm `(authed)`: nó chứa `/profile`, mà
      # `/pages/profile.html` đã 307 sang `/profile` khi cutover pilot 3 ⇒
      # không còn vế legacy để so. Bắt nó vào đây là để job chạy rồi BÁO XANH
      # mà chưa từng mở route đã sửa. Có test chặn đúng chuyện đó
      # (`parity-core.test.mjs` → "bộ lọc KHÔNG bắt route mà G1 không so được"),
      # và nó đã bắt tôi khi tôi thêm nhầm.
      - 'frontend/app/(authed-home)/**'
      # Vế Speaking (cặp `/pages/speaking.html` ↔ `/speaking-preview`). Thêm
      # CÙNG LÚC với cặp parity — thêm cặp mà quên glob là dựng đúng một cổng
      # không bao giờ tự kích hoạt, y hệt phát hiện của Codex trên PR #930.
      - 'frontend/app/(authed-speaking)/**'
      - 'frontend/public/pages/speaking.html'
      - 'frontend/public/css/speaking.css'
      - 'frontend/public/js/cue-card-detector.js'
      # CẢ hai cây mã dùng chung, không ghim từng tệp. Job này chạy `npm run
      # build`, nên BẤT KỲ component/lib nào cũng có thể lọt vào chunk của trang
      # đang so — thêm một shared component mới mà quên bổ sung glob thì cổng
      # không chạy cho đúng PR ấy (Codex bắt ở #946 vòng 3).
      # Việc khoanh theo NHÓM ROUTE ở dưới vẫn giữ nguyên: đổi một route không
      # đổi DOM route khác, còn mã dùng chung thì đổi được bất kỳ trang nào.
      - 'frontend/lib/**'
      - 'frontend/components/**'
      - 'frontend/public/pages/home.html'
      - 'frontend/public/js/home.js'
      # CSS có mặt vì G1 so theo BỀ RỘNG: một khối ẩn/hiện lệch breakpoint là
      # khác biệt thật mà chỉ lượt 375 bắt được.
      - 'frontend/public/css/home.css'
      - 'frontend/public/css/mock-hub.css'
      # Vế Bài viết (cặp `/pages/writing-dashboard.html` ↔ `/writing/dashboard`).
      # Ba dòng này CỐ Ý nằm trong khối authed: `parity-core.test.mjs` cắt đúng
      # khối này và đòi MỌI glob trong đó phải được regex chọn-phạm-vi authed
