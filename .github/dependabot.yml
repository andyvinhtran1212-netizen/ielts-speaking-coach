version: 2
updates:
  # Explicit build directories keep source_material/ out of version updates.
  - package-ecosystem: npm
    directory: /frontend
    target-branch: staging
    schedule:
      interval: monthly
    open-pull-requests-limit: 2

  - package-ecosystem: npm
    directory: /frontend/tooling/css
    target-branch: staging
    schedule:
      interval: monthly
    open-pull-requests-limit: 2

  - package-ecosystem: pip
    directory: /backend
    target-branch: staging
    schedule:
      interval: monthly
    open-pull-requests-limit: 2

  # GitHub Actions uses / to scan .github/workflows and root action manifests.
  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
