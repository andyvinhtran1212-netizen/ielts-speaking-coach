[pytest]
# ── Test GỌI TIỀN THẬT phải cố ý mới chạy được ───────────────────────────────
#
# `tests/smoke/test_gemini_smoke.py` gọi Gemini API thật (~$0.005/lượt). Cơ chế
# loại trừ trước đây là một CÂU DẶN trong docstring — "excluded from the default
# suite via the developer's invocation (e.g. `pytest tests/ --ignore=tests/smoke`)"
# — tức là không có gì trong mã chặn nó, chỉ trông vào việc người chạy nhớ gõ
# thêm cờ.
#
# Không ai nhớ. Ngày 08/08 nó chạy khoảng 24 lượt trong một ngày: mỗi lần
# `pytest tests/ -q` chạy tay, VÀ mỗi lần `git push` (hook pre-push gọi
# `pytest tests/ -q --ignore=tests/test_d1_e2e.py` — loại đúng một tệp khác,
# không loại smoke). Kể cả push XOÁ NHÁNH cũng tốn một lượt. Không ai biết cho
# tới khi chủ dự án nhìn thấy bài văn mẫu trong log của Google và hỏi "ai nộp
# bài này?".
#
# CỔNG NẰM Ở ĐÂU: `pytest_collection_modifyitems` trong tests/conftest.py, đòi
# cờ `--run-smoke`.
#
# Ở đây từng có `addopts = -m "not smoke"`. Bỏ đi, vì MỘT cổng thì mới có một
# hành vi đoán được, còn hai cổng thì chúng đánh nhau theo cả hai chiều:
#   · `-m` trên dòng lệnh GHI ĐÈ addopts, nên `pytest tests -m asyncio` (câu
#     lệnh hoàn toàn bình thường) thu lại được test tốn tiền — khoá cửa rồi để
#     chìa dưới thảm;
#   · và ngược lại, addopts loại test smoke TRƯỚC khi hook kịp cho phép, nên
#     chính câu lệnh có chủ ý `--run-smoke` lại không chạy được gì.
# (codex cục bộ 08/08, vòng 2 và vòng 3.)
#
# Marker khai báo ở ĐÂY và CHỈ ở đây — xem tests/smoke/conftest.py.
#
# MỖI MARKER MỘT DÒNG: `markers` là danh sách theo DÒNG, nên một mô tả
# xuống dòng biến phần đuôi thành một marker riêng, và `pytest --markers`
# in ra thứ vô nghĩa như `@pytest.mark.chạy bằng ...`.
markers =
    smoke: gọi dịch vụ ngoài, TỐN TIỀN THẬT. Bị bỏ qua mặc định; chạy bằng `pytest tests/smoke --run-smoke` (chính CỜ ẤY là cổng — `-m smoke` một mình vẫn bị bỏ qua và pytest vẫn báo xanh).
    livenet: CỐ Ý cần dịch vụ thật (Supabase/RLS, thăm dò đường ghi) nhưng KHÔNG tốn tiền; tự bỏ qua khi thiếu biến môi trường. Chốt chặn mạng chừa các ca này ra, nhưng vẫn KHÔNG mở nhà cung cấp tính tiền.
