<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-labelledby="title"><title id="title">Màu đỏ trong hai bối cảnh</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#0f766e"/></marker><pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#d9ded8"/></pattern></defs><rect width="920" height="500" rx="24" fill="#f5f5ed"/><rect width="920" height="500" fill="url(#paper)" opacity=".45"/><g font-family="Arial,sans-serif" fill="#142e34"><text x="45" y="62" font-size="28" font-weight="bold">Cùng một màu, ý nghĩa phụ thuộc bối cảnh</text><rect x="45" y="112" width="390" height="270" rx="20" fill="#f0e5de"/><rect x="485" y="112" width="390" height="270" rx="20" fill="#e4eae4"/><rect x="155" y="152" width="97" height="166" rx="22" fill="#b63439"/><ellipse cx="204" cy="158" rx="48" ry="10" fill="#dc9992"/><path d="M680 159l47 20 20 47-20 47-47 20-47-20-20-47 20-47Z" fill="#b63439" stroke="#fff" stroke-width="7"/><text x="640" y="235" font-size="26" fill="white" font-weight="bold">STOP</text><text x="115" y="354" font-size="22">Gợi sự hào hứng</text><text x="558" y="354" font-size="22">Yêu cầu dừng lại</text><text x="45" y="451" font-size="19">Ví dụ trong bài đọc; phản ứng còn phụ thuộc văn hoá và người nhìn.</text></g></svg>