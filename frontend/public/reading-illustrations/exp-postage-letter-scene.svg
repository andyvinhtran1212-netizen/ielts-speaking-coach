<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title desc"><title id="title">Phong thư và con tem</title><desc id="desc">Một phong thư có tem minh hoạ trừu tượng không mệnh giá nằm cạnh giấy viết, bút và một phong thư đang mở. Tem không phải bản sao lịch sử.</desc><rect width="800" height="400" fill="#f2f0e5"/><path d="M0 295H800V400H0Z" fill="#d9c7ab"/><path d="M125 183L332 144L470 212L254 259Z" fill="#e2d3b4" stroke="#ac9975" stroke-width="3"/><path d="M125 183L179 103L332 144" fill="#fffdf5" stroke="#ac9975" stroke-width="3"/><path d="M158 179L223 90L411 140L346 227Z" fill="#fffdf5" stroke="#c1b48e" stroke-width="3"/><path d="M225 122L365 160M213 139L352 177M201 156L317 187" stroke="#b6c7c3" stroke-width="4"/><path d="M125 183L254 259L470 212L332 144L298 206L223 217Z" fill="#e2d3b4" stroke="#ac9975" stroke-width="3"/><path d="M292 274L509 223L668 291L447 352Z" fill="#fffdf5" stroke="#ac9975" stroke-width="4"/><path d="M292 274L474 300L509 223M447 352L445 296M668 291L497 294" fill="none" stroke="#c1b48e" stroke-width="3"/><path d="M535 244L577 236L600 259L556 269Z" fill="#81a79a" stroke="#f8faf9" stroke-width="5" stroke-dasharray="4 4"/><path d="M550 249L569 244L584 256L562 261Z" fill="#b6d0b3"/><path d="M578 204L686 137L696 149L589 215Z" fill="#80644d"/><path d="M576 204L564 220L589 215Z" fill="#e5c999"/><path d="M680 141L686 137L696 149L689 153Z" fill="#e5c969"/></svg>
