<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-labelledby="title"><title id="title">Lợi ích riêng và thiệt hại chung</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#0f766e"/></marker><pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#d9ded8"/></pattern></defs><rect width="920" height="500" rx="24" fill="#f5f5ed"/><rect width="920" height="500" fill="url(#paper)" opacity=".45"/><g font-family="Arial,sans-serif" fill="#142e34"><text x="45" y="62" font-size="28" font-weight="bold">Thêm một con vật vào đồng cỏ</text><rect x="45" y="108" width="370" height="307" rx="20" fill="#e1eee3"/><rect x="505" y="108" width="370" height="307" rx="20" fill="#f2e5d3"/><g transform="translate(227 201) scale(1.2)"><ellipse cx="0" cy="0" rx="36" ry="20" fill="#f8f6ee" stroke="#355750" stroke-width="3"/><path d="M-20 10V35M19 10V35" stroke="#355750" stroke-width="6"/><ellipse cx="35" cy="-8" rx="14" ry="12" fill="#e9dac2" stroke="#355750" stroke-width="3"/><path d="M-13-18Q4 0 17-13M-25-3Q-16 10-8-2" fill="#355750"/><path d="M-36-5L-50-18" stroke="#355750" stroke-width="3"/><circle cx="40" cy="-10" r="2" fill="#355750"/></g><text x="90" y="290" font-size="24" font-weight="bold">Lợi ích riêng</text><text x="90" y="329" font-size="19">Một người nhận thêm lợi ích.</text><path d="M550 210H827M590 174l-15 55M650 183l-15 52M715 170l-15 68M785 188l-15 50" stroke="#a87949" stroke-width="5"/><text x="550" y="290" font-size="24" font-weight="bold">Thiệt hại chung</text><text x="550" y="329" font-size="19">Mọi người cùng gánh chịu.</text><path d="M427 247H484" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)"/><text x="45" y="459" font-size="17">Lập luận của Hardin; quy tắc cộng đồng là phần phản biện của Ostrom.</text></g></svg>