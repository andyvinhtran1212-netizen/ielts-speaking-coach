<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
<rect width="1000" height="640" fill="#ffffff"/>
<text x="500" y="34" text-anchor="middle" font-size="22" font-weight="800" fill="#1f2937">Workforce Participation Rate by Age Cohort</text>
<text x="500" y="56" text-anchor="middle" font-size="13.5" fill="#4b5563">A developed OECD economy, 1984-2024 (ten-year intervals)</text>

<!-- Plot area: x 100-940, y 90-500 (0-100%) -->
<!-- gridlines horizontal for 0,20,40,60,80,100 -->
<g stroke="#e5e7eb" stroke-width="1.2">
<line x1="100" y1="500" x2="940" y2="500"/>
<line x1="100" y1="418" x2="940" y2="418"/>
<line x1="100" y1="336" x2="940" y2="336"/>
<line x1="100" y1="254" x2="940" y2="254"/>
<line x1="100" y1="172" x2="940" y2="172"/>
<line x1="100" y1="90" x2="940" y2="90"/>
</g>
<!-- y axis labels -->
<g font-size="12.5" fill="#4b5563" text-anchor="end">
<text x="90" y="504">0%</text>
<text x="90" y="422">20%</text>
<text x="90" y="340">40%</text>
<text x="90" y="258">60%</text>
<text x="90" y="176">80%</text>
<text x="90" y="94">100%</text>
</g>
<!-- axes -->
<line x1="100" y1="90" x2="100" y2="500" stroke="#374151" stroke-width="2"/>
<line x1="100" y1="500" x2="940" y2="500" stroke="#374151" stroke-width="2"/>

<!-- x gridlines / labels at 1984,1994,2004,2014,2024 -->
<g stroke="#e5e7eb" stroke-width="1.2">
<line x1="100" y1="90" x2="100" y2="500"/>
<line x1="310" y1="90" x2="310" y2="500"/>
<line x1="520" y1="90" x2="520" y2="500"/>
<line x1="730" y1="90" x2="730" y2="500"/>
<line x1="940" y1="90" x2="940" y2="500"/>
</g>
<g font-size="12.5" fill="#4b5563" text-anchor="middle">
<text x="100" y="522">1984</text>
<text x="310" y="522">1994</text>
<text x="520" y="522">2004</text>
<text x="730" y="522">2014</text>
<text x="940" y="522">2024</text>
</g>

<!-- Data mapping: y = 500 - pct*4.1 -->
<!-- 18-24 (youth): 72,66,60,54,48 -->
<polyline points="100,205.8 310,229.4 520,254.0 730,278.4 940,303.2" fill="none" stroke="#dc2626" stroke-width="3.2"/>
<!-- 25-44 (prime): 79,82,84,83,81 -->
<polyline points="100,176.1 310,163.8 520,155.6 730,159.7 940,167.9" fill="none" stroke="#2563eb" stroke-width="3.2"/>
<!-- 45-64 (mature): 58,66,74,77,79 -->
<polyline points="100,262.2 310,229.4 520,196.6 730,184.3 940,176.1" fill="none" stroke="#059669" stroke-width="3.2"/>
<!-- 65+ (senior): 8,11,15,19,24 -->
<polyline points="100,467.2 310,454.9 520,438.5 730,422.1 940,401.6" fill="none" stroke="#d97706" stroke-width="3.2"/>

<!-- markers -->
<g fill="#dc2626">
<circle cx="100" cy="205.8" r="5"/><circle cx="310" cy="229.4" r="5"/><circle cx="520" cy="254.0" r="5"/><circle cx="730" cy="278.4" r="5"/><circle cx="940" cy="303.2" r="5"/>
</g>
<g fill="#2563eb">
<circle cx="100" cy="176.1" r="5"/><circle cx="310" cy="163.8" r="5"/><circle cx="520" cy="155.6" r="5"/><circle cx="730" cy="159.7" r="5"/><circle cx="940" cy="167.9" r="5"/>
</g>
<g fill="#059669">
<circle cx="100" cy="262.2" r="5"/><circle cx="310" cy="229.4" r="5"/><circle cx="520" cy="196.6" r="5"/><circle cx="730" cy="184.3" r="5"/><circle cx="940" cy="176.1" r="5"/>
</g>
<g fill="#d97706">
<circle cx="100" cy="467.2" r="5"/><circle cx="310" cy="454.9" r="5"/><circle cx="520" cy="438.5" r="5"/><circle cx="730" cy="422.1" r="5"/><circle cx="940" cy="401.6" r="5"/>
</g>

<!-- key data labels -->
<text x="100" y="196" font-size="11" font-weight="700" fill="#dc2626">72%</text>
<text x="955" y="307" font-size="11" font-weight="700" fill="#dc2626">48%</text>
<text x="100" y="167" font-size="11" font-weight="700" fill="#2563eb">start</text>
<text x="520" y="146" font-size="11" font-weight="700" fill="#2563eb">84% (peak)</text>
<text x="955" y="172" font-size="11" font-weight="700" fill="#2563eb">81%</text>
<text x="100" y="253" font-size="11" font-weight="700" fill="#059669">58%</text>
<text x="955" y="180" font-size="11" font-weight="700" fill="#059669">79%</text>
<text x="500" y="217" font-size="10.5" font-style="italic" fill="#374151">~2004: mature overtakes youth</text>
<text x="100" y="480" font-size="11" font-weight="700" fill="#d97706">8%</text>
<text x="955" y="405" font-size="11" font-weight="700" fill="#d97706">24%</text>

<!-- crossing marker circle -->
<circle cx="520" cy="225" r="7" fill="none" stroke="#374151" stroke-width="1.5" stroke-dasharray="3 3"/>

<!-- Legend -->
<g font-size="12.5" font-weight="700">
<rect x="150" y="555" width="22" height="4" fill="#dc2626"/>
<text x="178" y="562" fill="#1f2937">18-24 (youth)</text>
<rect x="320" y="555" width="22" height="4" fill="#2563eb"/>
<text x="348" y="562" fill="#1f2937">25-44 (prime)</text>
<rect x="490" y="555" width="22" height="4" fill="#059669"/>
<text x="518" y="562" fill="#1f2937">45-64 (mature)</text>
<rect x="670" y="555" width="22" height="4" fill="#d97706"/>
<text x="698" y="562" fill="#1f2937">65 and over (senior)</text>
</g>

<text x="960" y="620" text-anchor="end" font-size="10.5" font-style="italic" fill="#4b5563">Illustrative data for teaching &#183; IELTS Advanced</text>
</svg>
