<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<rect x="0" y="0" width="1180" height="620" fill="#ffffff"/>
<text x="590" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">Satellite launches by sector (2023) and cumulative tracked orbital debris (2000–2023)</text>
<text x="590" y="52" text-anchor="middle" font-size="12.5" fill="#64748b">Panel A: launches by sector in 2023 · Panel B: tracked debris objects, thousands</text>

<!-- Panel A -->
<text x="285" y="82" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e293b">Panel A — Satellite launches by sector, 2023</text>
<line x1="70" y1="500" x2="70" y2="100" stroke="#94a3b8" stroke-width="1.5"/>
<line x1="70" y1="500" x2="500" y2="500" stroke="#94a3b8" stroke-width="1.5"/>
<!-- scale: 0-2400, gridlines every 400 -> px per unit = 400/2400*(500-100)=66.67 per 400 -->
<line x1="70" y1="500" x2="500" y2="500" stroke="#e2e8f0" stroke-width="1"/>
<text x="60" y="504" text-anchor="end" font-size="11" fill="#64748b">0</text>
<line x1="70" y1="433.3" x2="500" y2="433.3" stroke="#e2e8f0" stroke-width="1"/>
<text x="60" y="437.3" text-anchor="end" font-size="11" fill="#64748b">400</text>
<line x1="70" y1="366.7" x2="500" y2="366.7" stroke="#e2e8f0" stroke-width="1"/>
<text x="60" y="370.7" text-anchor="end" font-size="11" fill="#64748b">800</text>
<line x1="70" y1="300.0" x2="500" y2="300.0" stroke="#e2e8f0" stroke-width="1"/>
<text x="60" y="304.0" text-anchor="end" font-size="11" fill="#64748b">1,200</text>
<line x1="70" y1="233.3" x2="500" y2="233.3" stroke="#e2e8f0" stroke-width="1"/>
<text x="60" y="237.3" text-anchor="end" font-size="11" fill="#64748b">1,600</text>
<line x1="70" y1="166.7" x2="500" y2="166.7" stroke="#e2e8f0" stroke-width="1"/>
<text x="60" y="170.7" text-anchor="end" font-size="11" fill="#64748b">2,000</text>
<line x1="70" y1="100.0" x2="500" y2="100.0" stroke="#e2e8f0" stroke-width="1"/>
<text x="60" y="104.0" text-anchor="end" font-size="11" fill="#64748b">2,400</text>
<text x="30" y="300" text-anchor="middle" font-size="11" fill="#64748b" transform="rotate(-90 30 300)">Number of launches</text>

<!-- Commercial ~2400 -> full height 400px -->
<rect x="110" y="100" width="80" height="400" rx="2" fill="#2563eb"/>
<text x="150" y="94" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">~2,400</text>
<text x="150" y="518" text-anchor="middle" font-size="12" fill="#1e293b">Commercial</text>
<!-- Government 90 -> 15px -->
<rect x="240" y="485" width="80" height="15" rx="2" fill="#2563eb"/>
<text x="280" y="479" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">90</text>
<text x="280" y="518" text-anchor="middle" font-size="12" fill="#1e293b">Government</text>
<!-- Military 60 -> 10px -->
<rect x="370" y="490" width="80" height="10" rx="2" fill="#2563eb"/>
<text x="410" y="484" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">60</text>
<text x="410" y="518" text-anchor="middle" font-size="12" fill="#1e293b">Military</text>

<!-- Panel B -->
<text x="895" y="82" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e293b">Panel B — Cumulative tracked orbital debris</text>
<line x1="680" y1="500" x2="680" y2="100" stroke="#94a3b8" stroke-width="1.5"/>
<line x1="680" y1="500" x2="1110" y2="500" stroke="#94a3b8" stroke-width="1.5"/>
<!-- scale 0-40000, gridlines every 8000 -->
<line x1="680" y1="500" x2="1110" y2="500" stroke="#e2e8f0" stroke-width="1"/>
<text x="670" y="504" text-anchor="end" font-size="11" fill="#64748b">0</text>
<line x1="680" y1="420" x2="1110" y2="420" stroke="#e2e8f0" stroke-width="1"/>
<text x="670" y="424" text-anchor="end" font-size="11" fill="#64748b">8,000</text>
<line x1="680" y1="340" x2="1110" y2="340" stroke="#e2e8f0" stroke-width="1"/>
<text x="670" y="344" text-anchor="end" font-size="11" fill="#64748b">16,000</text>
<line x1="680" y1="260" x2="1110" y2="260" stroke="#e2e8f0" stroke-width="1"/>
<text x="670" y="264" text-anchor="end" font-size="11" fill="#64748b">24,000</text>
<line x1="680" y1="180" x2="1110" y2="180" stroke="#e2e8f0" stroke-width="1"/>
<text x="670" y="184" text-anchor="end" font-size="11" fill="#64748b">32,000</text>
<line x1="680" y1="100" x2="1110" y2="100" stroke="#e2e8f0" stroke-width="1"/>
<text x="670" y="104" text-anchor="end" font-size="11" fill="#64748b">40,000</text>
<text x="640" y="300" text-anchor="middle" font-size="11" fill="#64748b" transform="rotate(-90 640 300)">Tracked objects</text>

<!-- 2000: 9000 -> 90px -->
<rect x="710" y="410" width="70" height="90" rx="2" fill="#16a34a"/>
<text x="745" y="404" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">9,000</text>
<text x="745" y="518" text-anchor="middle" font-size="12" fill="#1e293b">2000</text>
<!-- 2010: 16000 -> 160px -->
<rect x="820" y="340" width="70" height="160" rx="2" fill="#16a34a"/>
<text x="855" y="334" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">16,000</text>
<text x="855" y="518" text-anchor="middle" font-size="12" fill="#1e293b">2010</text>
<!-- 2020: 23000 -> 230px -->
<rect x="930" y="270" width="70" height="230" rx="2" fill="#16a34a"/>
<text x="965" y="264" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">23,000</text>
<text x="965" y="518" text-anchor="middle" font-size="12" fill="#1e293b">2020</text>
<!-- 2023: 36000 -> 360px -->
<rect x="1040" y="140" width="70" height="360" rx="2" fill="#16a34a"/>
<text x="1075" y="134" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">36,000</text>
<text x="1075" y="518" text-anchor="middle" font-size="12" fill="#1e293b">2023</text>

<rect x="90" y="558" width="14" height="14" rx="2" fill="#2563eb"/>
<text x="110" y="570" font-size="12.5" fill="#1e293b">Panel A — Launches by sector (2023)</text>
<rect x="400" y="558" width="14" height="14" rx="2" fill="#16a34a"/>
<text x="420" y="570" font-size="12.5" fill="#1e293b">Panel B — Cumulative debris (thousands)</text>

<line x1="590" y1="82" x2="590" y2="530" stroke="#e2e8f0" stroke-width="1.5"/>
<text x="1160" y="606" text-anchor="end" font-size="10.5" fill="#64748b" font-style="italic">Illustrative data for teaching · IELTS Advanced</text>
</svg>
