<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
<rect width="1240" height="700" fill="#ffffff"/>
<text x="620" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2937">National gene-therapy research network: 2010 vs 2024</text>
<text x="620" y="54" text-anchor="middle" font-size="12.5" fill="#64748b">Central biobanks, satellite collection sites, clinical-trial centres and sample-transfer corridors</text>

<!-- Panel 2010 -->
<rect x="26" y="76" width="581" height="586" rx="12" fill="#f7f8f9" stroke="#c3c8ce" stroke-width="2"/>
<text x="316.5" y="104" text-anchor="middle" font-size="16" font-weight="800" fill="#1f2937">2010 — centralised phase</text>

<!-- compass regions labels (schematic quadrants) -->
<text x="80" y="140" font-size="11" font-weight="700" fill="#9ca3af">NORTH (unserved)</text>
<text x="480" y="140" text-anchor="end" font-size="11" font-weight="700" fill="#9ca3af">EAST</text>
<text x="80" y="450" font-size="11" font-weight="700" fill="#9ca3af">WEST (unserved)</text>
<text x="480" y="450" text-anchor="end" font-size="11" font-weight="700" fill="#9ca3af">CENTRAL/SOUTH</text>

<!-- Central biobank (capital, east) -->
<circle cx="400" cy="220" r="22" fill="#2563eb" stroke="#1e293b" stroke-width="2"/>
<text x="400" y="225" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">B</text>
<text x="400" y="256" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f2937">Capital biobank</text>
<text x="400" y="270" text-anchor="middle" font-size="10.5" fill="#4b5563">(eastern capital)</text>

<!-- 2 East satellite sites -->
<circle cx="440" cy="330" r="12" fill="#16a34a" stroke="#1e293b" stroke-width="1.8"/>
<text x="440" y="352" text-anchor="middle" font-size="10.5" fill="#1f2937">East site 1</text>
<circle cx="470" cy="230" r="12" fill="#16a34a" stroke="#1e293b" stroke-width="1.8"/>
<text x="505" y="222" text-anchor="middle" font-size="10.5" fill="#1f2937">East site 2</text>

<!-- 1 Central satellite site -->
<circle cx="310" cy="400" r="12" fill="#16a34a" stroke="#1e293b" stroke-width="1.8"/>
<text x="310" y="422" text-anchor="middle" font-size="10.5" fill="#1f2937">Central site</text>

<!-- 1 trial centre co-located with biobank -->
<rect x="386" y="180" width="28" height="20" rx="3" fill="#dc2626" stroke="#1e293b" stroke-width="1.8"/>
<text x="400" y="170" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1f2937">Trial centre (1)</text>
<text x="400" y="298" text-anchor="middle" font-size="10" fill="#4b5563">co-located with biobank</text>

<!-- radial corridors converging on capital -->
<line x1="400" y1="220" x2="440" y2="330" stroke="#9ca3af" stroke-width="2.5"/>
<line x1="400" y1="220" x2="470" y2="230" stroke="#9ca3af" stroke-width="2.5"/>
<line x1="400" y1="220" x2="310" y2="400" stroke="#9ca3af" stroke-width="2.5"/>

<!-- unserved north/west markers -->
<text x="120" y="220" text-anchor="middle" font-size="30" fill="#d1d5db">—</text>
<text x="120" y="240" text-anchor="middle" font-size="10" fill="#9ca3af">no coverage</text>
<text x="120" y="470" text-anchor="middle" font-size="30" fill="#d1d5db">—</text>
<text x="120" y="490" text-anchor="middle" font-size="10" fill="#9ca3af">no coverage</text>

<!-- legend panel 1 -->
<g transform="translate(50,560)">
<circle cx="8" cy="0" r="9" fill="#2563eb" stroke="#1e293b" stroke-width="1.5"/>
<text x="24" y="4" font-size="11" fill="#1e293b">Central biobank (×1)</text>
<circle cx="8" cy="24" r="7" fill="#16a34a" stroke="#1e293b" stroke-width="1.5"/>
<text x="24" y="28" font-size="11" fill="#1e293b">Satellite collection site (×3)</text>
<rect x="1" y="42" width="16" height="12" rx="2" fill="#dc2626" stroke="#1e293b" stroke-width="1.5"/>
<text x="24" y="52" font-size="11" fill="#1e293b">Clinical-trial centre (×1)</text>
<line x1="0" y1="70" x2="20" y2="70" stroke="#9ca3af" stroke-width="2.5"/>
<text x="24" y="74" font-size="11" fill="#1e293b">Transfer corridor (radial)</text>
</g>

<!-- Panel 2024 -->
<rect x="633" y="76" width="581" height="586" rx="12" fill="#f7f8f9" stroke="#c3c8ce" stroke-width="2"/>
<text x="923.5" y="104" text-anchor="middle" font-size="16" font-weight="800" fill="#1f2937">2024 — decentralised phase</text>

<text x="690" y="140" font-size="11" font-weight="700" fill="#9ca3af">NORTH</text>
<text x="1090" y="140" text-anchor="end" font-size="11" font-weight="700" fill="#9ca3af">EAST</text>
<text x="690" y="490" font-size="11" font-weight="700" fill="#9ca3af">WEST (new corridor)</text>
<text x="1090" y="490" text-anchor="end" font-size="11" font-weight="700" fill="#9ca3af">SOUTH (univ. link)</text>

<!-- Capital biobank East -->
<circle cx="1000" cy="220" r="20" fill="#2563eb" stroke="#1e293b" stroke-width="2"/>
<text x="1000" y="225" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">B1</text>
<text x="1000" y="252" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1f2937">Capital biobank</text>

<!-- New western biobank -->
<circle cx="740" cy="380" r="20" fill="#2563eb" stroke="#1e293b" stroke-width="2"/>
<text x="740" y="385" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">B2</text>
<text x="740" y="412" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1f2937">Western tech-corridor</text>
<text x="740" y="425" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1f2937">biobank (new)</text>

<!-- 4 East satellite sites -->
<circle cx="1040" cy="300" r="10" fill="#16a34a" stroke="#1e293b" stroke-width="1.6"/>
<circle cx="1070" cy="240" r="10" fill="#16a34a" stroke="#1e293b" stroke-width="1.6"/>
<circle cx="1050" cy="160" r="10" fill="#16a34a" stroke="#1e293b" stroke-width="1.6"/>
<circle cx="990" cy="290" r="10" fill="#16a34a" stroke="#1e293b" stroke-width="1.6"/>
<!-- 2 Central satellite sites -->
<circle cx="880" cy="290" r="10" fill="#16a34a" stroke="#1e293b" stroke-width="1.6"/>
<circle cx="900" cy="360" r="10" fill="#16a34a" stroke="#1e293b" stroke-width="1.6"/>
<!-- 2 West satellite sites -->
<circle cx="700" cy="300" r="10" fill="#16a34a" stroke="#1e293b" stroke-width="1.6"/>
<circle cx="770" cy="460" r="10" fill="#16a34a" stroke="#1e293b" stroke-width="1.6"/>
<!-- 1 North satellite site (new) -->
<circle cx="850" cy="160" r="10" fill="#16a34a" stroke="#1e293b" stroke-width="1.6"/>
<text x="850" y="142" text-anchor="middle" font-size="9.5" fill="#1f2937">North site (new)</text>

<!-- 5 trial centres: capital, west, north, central-south + university link south -->
<rect x="986" y="180" width="24" height="18" rx="3" fill="#dc2626" stroke="#1e293b" stroke-width="1.6"/>
<rect x="726" y="340" width="24" height="18" rx="3" fill="#dc2626" stroke="#1e293b" stroke-width="1.6"/>
<rect x="838" y="120" width="24" height="18" rx="3" fill="#dc2626" stroke="#1e293b" stroke-width="1.6"/>
<rect x="868" y="330" width="24" height="18" rx="3" fill="#dc2626" stroke="#1e293b" stroke-width="1.6"/>
<rect x="900" y="560" width="24" height="18" rx="3" fill="#dc2626" stroke="#1e293b" stroke-width="1.6"/>
<text x="912" y="600" text-anchor="middle" font-size="10" font-weight="700" fill="#1f2937">Southern university</text>
<text x="912" y="613" text-anchor="middle" font-size="10" font-weight="700" fill="#1f2937">trial link (new)</text>

<!-- dense mesh corridors (bi-coastal) -->
<line x1="1000" y1="220" x2="1040" y2="300" stroke="#9ca3af" stroke-width="2"/>
<line x1="1000" y1="220" x2="1070" y2="240" stroke="#9ca3af" stroke-width="2"/>
<line x1="1000" y1="220" x2="1050" y2="160" stroke="#9ca3af" stroke-width="2"/>
<line x1="1000" y1="220" x2="990" y2="290" stroke="#9ca3af" stroke-width="2"/>
<line x1="1000" y1="220" x2="880" y2="290" stroke="#9ca3af" stroke-width="2"/>
<line x1="740" y1="380" x2="900" y2="360" stroke="#9ca3af" stroke-width="2"/>
<line x1="740" y1="380" x2="700" y2="300" stroke="#9ca3af" stroke-width="2"/>
<line x1="740" y1="380" x2="770" y2="460" stroke="#9ca3af" stroke-width="2"/>
<line x1="740" y1="380" x2="850" y2="160" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5 4"/>
<line x1="1000" y1="220" x2="740" y2="380" stroke="#1e293b" stroke-width="2.5" stroke-dasharray="2 3"/>
<line x1="900" y1="360" x2="900" y2="560" stroke="#9ca3af" stroke-width="2"/>

<!-- international corridor to overseas partner lab -->
<line x1="1000" y1="220" x2="1150" y2="120" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6 4"/>
<circle cx="1160" cy="108" r="10" fill="#f59e0b" stroke="#1e293b" stroke-width="1.6"/>
<text x="1160" y="90" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1f2937">Overseas partner</text>
<text x="1160" y="102" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1f2937">lab (int'l)</text>

<!-- legend panel 2 -->
<g transform="translate(657,560)">
<circle cx="8" cy="0" r="9" fill="#2563eb" stroke="#1e293b" stroke-width="1.5"/>
<text x="24" y="4" font-size="11" fill="#1e293b">Central biobanks (×2)</text>
<circle cx="8" cy="24" r="7" fill="#16a34a" stroke="#1e293b" stroke-width="1.5"/>
<text x="24" y="28" font-size="11" fill="#1e293b">Satellite collection sites (×9)</text>
<rect x="1" y="42" width="16" height="12" rx="2" fill="#dc2626" stroke="#1e293b" stroke-width="1.5"/>
<text x="24" y="52" font-size="11" fill="#1e293b">Clinical-trial centres (×5)</text>
<circle cx="8" cy="70" r="7" fill="#f59e0b" stroke="#1e293b" stroke-width="1.5"/>
<text x="24" y="74" font-size="11" fill="#1e293b">International corridor (new)</text>
</g>

<text x="1224" y="686" text-anchor="end" font-size="10.5" fill="#64748b" font-style="italic">Illustrative data for teaching · IELTS Advanced</text>
</svg>
