<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
<rect width="1240" height="620" fill="#ffffff"/>
<text x="620" y="34" text-anchor="middle" font-size="22" font-weight="800" fill="#1f2937">The Corporate ESG Audit Pipeline</text>
<text x="620" y="56" text-anchor="middle" font-size="13.5" fill="#4b5563">A man-made process &#183; 8 stages, from board mandate to public disclosure</text>
<rect x="28" y="74" width="1184" height="510" rx="14" fill="#f4f5f7" stroke="#d1d5db" stroke-width="1.5"/>
<defs>
<marker id="ah15" markerWidth="13" markerHeight="13" refX="7" refY="4.5" orient="auto">
<path d="M0,0 L11,4.5 L0,9 Z" fill="#374151"/>
</marker>
<marker id="ah15r" markerWidth="13" markerHeight="13" refX="7" refY="4.5" orient="auto">
<path d="M0,0 L11,4.5 L0,9 Z" fill="#b45309"/>
</marker>
</defs>

<!-- Row 1: stages 1-4 -->
<g>
<rect x="60" y="110" width="190" height="150" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
<circle cx="80" cy="128" r="15" fill="#374151" stroke="#fff" stroke-width="2.5"/>
<text x="80" y="133" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">1</text>
<text x="155" y="163" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1f2937">Mandate issued</text>
<text x="155" y="180" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1f2937">by board</text>
<text x="155" y="205" text-anchor="middle" font-size="11" fill="#4b5563">Board formally</text>
<text x="155" y="219" text-anchor="middle" font-size="11" fill="#4b5563">commissions the</text>
<text x="155" y="233" text-anchor="middle" font-size="11" fill="#4b5563">independent audit</text>
</g>

<line x1="250" y1="185" x2="300" y2="185" stroke="#374151" stroke-width="4" marker-end="url(#ah15)"/>

<g>
<rect x="302" y="110" width="190" height="150" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
<circle cx="322" cy="128" r="15" fill="#374151" stroke="#fff" stroke-width="2.5"/>
<text x="322" y="133" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">2</text>
<text x="397" y="163" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1f2937">Stakeholder</text>
<text x="397" y="180" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1f2937">consultation</text>
<text x="397" y="205" text-anchor="middle" font-size="11" fill="#4b5563">Employees, NGOs and</text>
<text x="397" y="219" text-anchor="middle" font-size="11" fill="#4b5563">institutional investors</text>
<text x="397" y="233" text-anchor="middle" font-size="11" fill="#4b5563">are consulted</text>
</g>

<line x1="492" y1="185" x2="542" y2="185" stroke="#374151" stroke-width="4" marker-end="url(#ah15)"/>

<g>
<rect x="544" y="110" width="190" height="150" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
<circle cx="564" cy="128" r="15" fill="#374151" stroke="#fff" stroke-width="2.5"/>
<text x="564" y="133" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">3</text>
<text x="639" y="163" text-anchor="middle" font-size="13" font-weight="800" fill="#1f2937">Data collection</text>
<text x="639" y="205" text-anchor="middle" font-size="11" fill="#4b5563">Raw data on emissions,</text>
<text x="639" y="219" text-anchor="middle" font-size="11" fill="#4b5563">labour practices and</text>
<text x="639" y="233" text-anchor="middle" font-size="11" fill="#4b5563">supply chains gathered</text>
</g>

<line x1="734" y1="185" x2="784" y2="185" stroke="#374151" stroke-width="4" marker-end="url(#ah15)"/>

<g>
<rect x="786" y="110" width="190" height="150" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
<circle cx="806" cy="128" r="15" fill="#374151" stroke="#fff" stroke-width="2.5"/>
<text x="806" y="133" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">4</text>
<text x="881" y="163" text-anchor="middle" font-size="12" font-weight="800" fill="#1f2937">ESG metrics</text>
<text x="881" y="180" text-anchor="middle" font-size="12" font-weight="800" fill="#1f2937">benchmarking</text>
<text x="881" y="205" text-anchor="middle" font-size="10.5" fill="#4b5563">Performance benchmarked</text>
<text x="881" y="219" text-anchor="middle" font-size="10.5" fill="#4b5563">vs industry peers; if weak,</text>
<text x="881" y="233" text-anchor="middle" font-size="10.5" fill="#4b5563">loops back to stage 3</text>
</g>

<!-- Feedback loop 4 -> 3 -->
<path d="M850,108 Q790,70 690,70 Q615,70 615,106" fill="none" stroke="#b45309" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#ah15r)"/>
<text x="732" y="63" text-anchor="middle" font-size="10.5" font-style="italic" fill="#b45309">if substandard: back to stage 3</text>

<!-- wrap arrow 4 -> 5 down to row 2 -->
<path d="M881,260 L881,300 L1104,300 L1104,393" fill="none" stroke="#374151" stroke-width="4" marker-end="url(#ah15)"/>

<!-- Row 2: stage 5 (rightmost), 6, 7, 8 -->
<g>
<rect x="1028" y="395" width="152" height="150" rx="10" fill="#fdf4e3" stroke="#d97706" stroke-width="2.5"/>
<circle cx="1048" cy="413" r="15" fill="#b45309" stroke="#fff" stroke-width="2.5"/>
<text x="1048" y="418" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">5</text>
<text x="1104" y="443" text-anchor="middle" font-size="11.5" font-weight="800" fill="#1f2937">Independent</text>
<text x="1104" y="458" text-anchor="middle" font-size="11.5" font-weight="800" fill="#1f2937">3rd-party</text>
<text x="1104" y="473" text-anchor="middle" font-size="11.5" font-weight="800" fill="#1f2937">verification</text>
<text x="1104" y="495" text-anchor="middle" font-size="9.5" font-style="italic" fill="#b45309">(only outsourced</text>
<text x="1104" y="508" text-anchor="middle" font-size="9.5" font-style="italic" fill="#b45309">step)</text>
</g>

<line x1="1028" y1="470" x2="982" y2="470" stroke="#374151" stroke-width="4" marker-end="url(#ah15)"/>

<g>
<rect x="786" y="395" width="190" height="150" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
<circle cx="806" cy="413" r="15" fill="#374151" stroke="#fff" stroke-width="2.5"/>
<text x="806" y="418" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">6</text>
<text x="881" y="448" text-anchor="middle" font-size="12" font-weight="800" fill="#1f2937">Audit trail</text>
<text x="881" y="465" text-anchor="middle" font-size="12" font-weight="800" fill="#1f2937">documentation</text>
<text x="881" y="490" text-anchor="middle" font-size="10.5" fill="#4b5563">Timestamped, immutable</text>
<text x="881" y="504" text-anchor="middle" font-size="10.5" fill="#4b5563">record logged; risks</text>
<text x="881" y="518" text-anchor="middle" font-size="10.5" fill="#4b5563">flagged for review</text>
</g>

<line x1="786" y1="470" x2="736" y2="470" stroke="#374151" stroke-width="4" marker-end="url(#ah15)"/>

<g>
<rect x="544" y="395" width="190" height="150" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
<circle cx="564" cy="413" r="15" fill="#374151" stroke="#fff" stroke-width="2.5"/>
<text x="564" y="418" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">7</text>
<text x="639" y="443" text-anchor="middle" font-size="11.5" font-weight="800" fill="#1f2937">Board review</text>
<text x="639" y="458" text-anchor="middle" font-size="11.5" font-weight="800" fill="#1f2937">under fiduciary</text>
<text x="639" y="473" text-anchor="middle" font-size="11.5" font-weight="800" fill="#1f2937">duty</text>
<text x="639" y="495" text-anchor="middle" font-size="10" fill="#4b5563">Directors scrutinise the</text>
<text x="639" y="508" text-anchor="middle" font-size="10" fill="#4b5563">dossier; bear legal duty</text>
</g>

<line x1="544" y1="470" x2="494" y2="470" stroke="#374151" stroke-width="4" marker-end="url(#ah15)"/>

<g>
<rect x="302" y="395" width="190" height="150" rx="10" fill="#ffffff" stroke="#374151" stroke-width="2.5"/>
<circle cx="322" cy="413" r="15" fill="#374151" stroke="#fff" stroke-width="2.5"/>
<text x="322" y="418" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">8</text>
<text x="397" y="448" text-anchor="middle" font-size="13" font-weight="800" fill="#1f2937">Public</text>
<text x="397" y="465" text-anchor="middle" font-size="13" font-weight="800" fill="#1f2937">disclosure</text>
<text x="397" y="490" text-anchor="middle" font-size="10.5" fill="#4b5563">Verified sustainability</text>
<text x="397" y="504" text-anchor="middle" font-size="10.5" fill="#4b5563">report published for</text>
<text x="397" y="518" text-anchor="middle" font-size="10.5" fill="#4b5563">regulators and market</text>
</g>

<text x="1224" y="606" text-anchor="end" font-size="10.5" font-style="italic" fill="#4b5563">Illustrative data for teaching &#183; IELTS Advanced</text>
</svg>
