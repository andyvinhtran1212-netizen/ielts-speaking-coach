<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="500" viewBox="0 0 1240 500" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"><defs><marker id="ah2" markerWidth="12" markerHeight="12" refX="6" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#374151"/></marker></defs><rect x="0" y="0" width="1240" height="500" fill="#ffffff"/><text x="620.0" y="34" text-anchor="middle" font-size="20" font-weight="800" fill="#1f2937">Postgraduate University Admission Process</text><text x="620.0" y="57" text-anchor="middle" font-size="13" fill="#4b5563">Seven stages, from online application to enrolment or feedback</text><rect x="30.0" y="110" width="250" height="110" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><circle cx="56.0" cy="136" r="16" fill="#2563eb" stroke="#fff" stroke-width="2"/><text x="56.0" y="141" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">1</text><text x="80.0" y="141" font-size="14.5" font-weight="700" fill="#1e293b">Online application</text><text x="48.0" y="168" font-size="11.5" fill="#475569">Candidate submits application form</text><text x="48.0" y="186" font-size="11.5" fill="#475569">online</text><rect x="340.0" y="110" width="250" height="110" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><circle cx="366.0" cy="136" r="16" fill="#2563eb" stroke="#fff" stroke-width="2"/><text x="366.0" y="141" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">2</text><text x="390.0" y="141" font-size="14.5" font-weight="700" fill="#1e293b">Eligibility screening</text><text x="358.0" y="168" font-size="11.5" fill="#475569">Admissions office checks</text><text x="358.0" y="186" font-size="11.5" fill="#475569">credentials &amp; language proficiency</text><rect x="650.0" y="110" width="250" height="110" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><circle cx="676.0" cy="136" r="16" fill="#2563eb" stroke="#fff" stroke-width="2"/><text x="676.0" y="141" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">3</text><text x="700.0" y="141" font-size="14.5" font-weight="700" fill="#1e293b">Faculty academic review</text><text x="668.0" y="168" font-size="11.5" fill="#475569">Faculty evaluates statement of</text><text x="668.0" y="186" font-size="11.5" fill="#475569">purpose &amp; references</text><rect x="960.0" y="110" width="250" height="110" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><circle cx="986.0" cy="136" r="16" fill="#2563eb" stroke="#fff" stroke-width="2"/><text x="986.0" y="141" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">4</text><text x="1010.0" y="141" font-size="14.5" font-weight="700" fill="#1e293b">Panel interview</text><text x="978.0" y="168" font-size="11.5" fill="#475569">Shortlisted candidates attend</text><text x="978.0" y="186" font-size="11.5" fill="#475569">interview</text><rect x="960.0" y="320" width="250" height="110" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><circle cx="986.0" cy="346" r="16" fill="#2563eb" stroke="#fff" stroke-width="2"/><text x="986.0" y="351" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">5</text><text x="1010.0" y="351" font-size="14.5" font-weight="700" fill="#1e293b">Research-proposal review</text><text x="978.0" y="378" font-size="11.5" fill="#475569">Doctoral candidates' proposals</text><text x="978.0" y="396" font-size="11.5" fill="#475569">peer-reviewed; scores collated</text><rect x="650.0" y="320" width="250" height="110" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><circle cx="676.0" cy="346" r="16" fill="#2563eb" stroke="#fff" stroke-width="2"/><text x="676.0" y="351" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">6</text><text x="700.0" y="351" font-size="14.5" font-weight="700" fill="#1e293b">Decision relayed</text><text x="668.0" y="378" font-size="11.5" fill="#475569">Decision emailed; accepted pay</text><text x="668.0" y="396" font-size="11.5" fill="#475569">deposit to enrol</text><rect x="340.0" y="320" width="250" height="110" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><circle cx="366.0" cy="346" r="16" fill="#2563eb" stroke="#fff" stroke-width="2"/><text x="366.0" y="351" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">7</text><text x="390.0" y="351" font-size="14.5" font-weight="700" fill="#1e293b">Feedback / re-application</text><text x="358.0" y="378" font-size="11.5" fill="#475569">Rejected applicants get feedback;</text><text x="358.0" y="396" font-size="11.5" fill="#475569">may re-apply next cycle</text><path d="M280.0,165.0 L340.0,165.0" fill="none" stroke="#374151" stroke-width="3" marker-end="url(#ah2)"/><path d="M590.0,165.0 L650.0,165.0" fill="none" stroke="#374151" stroke-width="3" marker-end="url(#ah2)"/><path d="M900.0,165.0 L960.0,165.0" fill="none" stroke="#374151" stroke-width="3" marker-end="url(#ah2)"/><path d="M1085.0,220.0 L1085.0,320.0" fill="none" stroke="#374151" stroke-width="3" marker-end="url(#ah2)"/><path d="M960.0,375.0 L900.0,375.0" fill="none" stroke="#374151" stroke-width="3" marker-end="url(#ah2)"/><path d="M650.0,375.0 L590.0,375.0" fill="none" stroke="#374151" stroke-width="3" marker-end="url(#ah2)"/><path d="M465.0,316.0 C 425.0,250.0 115.0,290.0 155.0,224.0" fill="none" stroke="#dc2626" stroke-width="2.4" stroke-dasharray="6,4" marker-end="url(#ah2)"/><text x="250.0" y="270.0" font-size="11.5" fill="#dc2626" font-style="italic">re-apply next cycle</text><text x="1224" y="486" text-anchor="end" font-size="10.5" font-style="italic" fill="#4b5563">Illustrative data for teaching · IELTS Advanced</text></svg>