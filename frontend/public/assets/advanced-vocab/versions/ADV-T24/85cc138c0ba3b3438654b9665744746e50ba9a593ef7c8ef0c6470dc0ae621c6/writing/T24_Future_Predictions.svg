<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="640" viewBox="0 0 1180 640" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<rect x="0" y="0" width="1180" height="640" fill="#ffffff"/>
<text x="590" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">Projected 2030 sector growth vs 2024 GDP share</text>
<text x="590" y="52" text-anchor="middle" font-size="12.5" fill="#64748b">Six economic sectors: AI &amp; Software, Renewable Energy, Biotech, Manufacturing, Retail, Fossil Fuels</text>

<!-- Panel A: bar chart of growth rates (can be negative) -->
<text x="285" y="82" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e293b">Bar chart — Projected annual growth rate in 2030 (%)</text>
<!-- zero line at y=380, scale: 15% over 260px range (100->360 positive), -2% to 20 range -->
<line x1="70" y1="100" x2="70" y2="460" stroke="#94a3b8" stroke-width="1.5"/>
<line x1="70" y1="380" x2="520" y2="380" stroke="#94a3b8" stroke-width="1.5"/>
<!-- gridlines at -5,0,5,10,15 % ; scale 16px per % -->
<line x1="70" y1="460" x2="520" y2="460" stroke="#e2e8f0" stroke-width="1"/>
<text x="60" y="464" text-anchor="end" font-size="11" fill="#64748b">-5</text>
<line x1="70" y1="380" x2="520" y2="380" stroke="#e2e8f0" stroke-width="1"/>
<text x="60" y="384" text-anchor="end" font-size="11" fill="#64748b">0</text>
<line x1="70" y1="300" x2="520" y2="300" stroke="#e2e8f0" stroke-width="1"/>
<text x="60" y="304" text-anchor="end" font-size="11" fill="#64748b">5</text>
<line x1="70" y1="220" x2="520" y2="220" stroke="#e2e8f0" stroke-width="1"/>
<text x="60" y="224" text-anchor="end" font-size="11" fill="#64748b">10</text>
<line x1="70" y1="140" x2="520" y2="140" stroke="#e2e8f0" stroke-width="1"/>
<text x="60" y="144" text-anchor="end" font-size="11" fill="#64748b">15</text>
<text x="30" y="290" text-anchor="middle" font-size="11" fill="#64748b" transform="rotate(-90 30 290)">Growth rate (%)</text>

<!-- bars: base y=380, scale 16px/% -->
<!-- AI & Software 14.2 -> 227.2px up -->
<rect x="90" y="152.8" width="48" height="227.2" rx="2" fill="#2563eb"/>
<text x="114" y="146.8" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e293b">+14.2</text>
<text x="114" y="478" text-anchor="middle" font-size="10.5" fill="#1e293b">AI &amp;</text>
<text x="114" y="491" text-anchor="middle" font-size="10.5" fill="#1e293b">Software</text>
<!-- Renewable 11.6 -> 185.6 -->
<rect x="154" y="194.4" width="48" height="185.6" rx="2" fill="#2563eb"/>
<text x="178" y="188.4" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e293b">+11.6</text>
<text x="178" y="478" text-anchor="middle" font-size="10.5" fill="#1e293b">Renewable</text>
<text x="178" y="491" text-anchor="middle" font-size="10.5" fill="#1e293b">Energy</text>
<!-- Biotech 9.8 -> 156.8 -->
<rect x="218" y="223.2" width="48" height="156.8" rx="2" fill="#2563eb"/>
<text x="242" y="217.2" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e293b">+9.8</text>
<text x="242" y="478" text-anchor="middle" font-size="10.5" fill="#1e293b">Biotech</text>
<!-- Manufacturing 3.1 -> 49.6 -->
<rect x="282" y="330.4" width="48" height="49.6" rx="2" fill="#dc2626"/>
<text x="306" y="324.4" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e293b">+3.1</text>
<text x="306" y="478" text-anchor="middle" font-size="10.5" fill="#1e293b">Manufact.</text>
<!-- Retail 2.4 -> 38.4 -->
<rect x="346" y="341.6" width="48" height="38.4" rx="2" fill="#dc2626"/>
<text x="370" y="335.6" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e293b">+2.4</text>
<text x="370" y="478" text-anchor="middle" font-size="10.5" fill="#1e293b">Retail</text>
<!-- Fossil Fuels -1.7 -> 27.2 below zero -->
<rect x="410" y="380" width="48" height="27.2" rx="2" fill="#7f1d1d"/>
<text x="434" y="422" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e293b">-1.7</text>
<text x="434" y="478" text-anchor="middle" font-size="10.5" fill="#1e293b">Fossil</text>
<text x="434" y="491" text-anchor="middle" font-size="10.5" fill="#1e293b">Fuels</text>

<!-- divider -->
<line x1="590" y1="82" x2="590" y2="530" stroke="#e2e8f0" stroke-width="1.5"/>

<!-- Panel B: pie chart of GDP share -->
<text x="895" y="82" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e293b">Pie chart — Share of total GDP in 2024 (%)</text>
<path d="M895,320 L895.0,170.0 A150,150 0 0 1 1004.3,217.3 Z" fill="#2563eb" stroke="#ffffff" stroke-width="2"/>
<path d="M895,320 L1004.3,217.3 A150,150 0 0 1 1044.7,310.6 Z" fill="#16a34a" stroke="#ffffff" stroke-width="2"/>
<path d="M895,320 L1044.7,310.6 A150,150 0 0 1 1030.7,383.9 Z" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
<path d="M895,320 L1030.7,383.9 A150,150 0 0 1 806.8,441.4 Z" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
<path d="M895,320 L806.8,441.4 A150,150 0 0 1 759.3,256.1 Z" fill="#7c3aed" stroke="#ffffff" stroke-width="2"/>
<path d="M895,320 L759.3,256.1 A150,150 0 0 1 895.0,170.0 Z" fill="#64748b" stroke="#ffffff" stroke-width="2"/>

<text x="966.5" y="154.8" text-anchor="start" font-size="11" font-weight="600" fill="#1e293b">AI &amp; Software 13%</text>
<text x="1060.2" y="248.5" text-anchor="start" font-size="11" font-weight="600" fill="#1e293b">Renewable Energy 11%</text>
<text x="1071.8" y="353.7" text-anchor="start" font-size="11" font-weight="600" fill="#1e293b">Biotech 8%</text>
<text x="939.8" y="500.3" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">Manufacturing 28%</text>
<text x="720.7" y="364.8" text-anchor="end" font-size="11" font-weight="600" fill="#1e293b">Retail 22%</text>
<text x="798.6" y="168.0" text-anchor="end" font-size="11" font-weight="600" fill="#1e293b">Fossil Fuels 18%</text>

<!-- Legend row (shared colour key) -->
<g transform="translate(70,560)">
<rect x="0" y="0" width="12" height="12" rx="2" fill="#2563eb"/><text x="16" y="10" font-size="11" fill="#1e293b">AI &amp; Software</text>
<rect x="130" y="0" width="12" height="12" rx="2" fill="#16a34a"/><text x="146" y="10" font-size="11" fill="#1e293b">Renewable Energy</text>
<rect x="300" y="0" width="12" height="12" rx="2" fill="#f59e0b"/><text x="316" y="10" font-size="11" fill="#1e293b">Biotech</text>
<rect x="400" y="0" width="12" height="12" rx="2" fill="#dc2626"/><text x="416" y="10" font-size="11" fill="#1e293b">Manufacturing</text>
<rect x="540" y="0" width="12" height="12" rx="2" fill="#7c3aed"/><text x="556" y="10" font-size="11" fill="#1e293b">Retail</text>
<rect x="630" y="0" width="12" height="12" rx="2" fill="#64748b"/><text x="646" y="10" font-size="11" fill="#1e293b">Fossil Fuels</text>
</g>
<text x="590" y="600" text-anchor="middle" font-size="10.5" fill="#64748b" font-style="italic">Note: Manufacturing, Retail and Fossil Fuels dominate 2024 GDP share yet show the weakest (or negative) projected growth to 2030</text>

<text x="1160" y="626" text-anchor="end" font-size="10.5" fill="#64748b" font-style="italic">Illustrative data for teaching · IELTS Advanced</text>
</svg>
