<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
<rect width="1240" height="620" fill="#ffffff"/>
<text x="620" y="34" text-anchor="middle" font-size="22" font-weight="800" fill="#1f2937">From Solar Farm to National Grid</text>
<text x="620" y="56" text-anchor="middle" font-size="13.5" fill="#4b5563">A man-made process &#183; 8 stages, from photovoltaic capture to distribution</text>
<rect x="28" y="74" width="1184" height="510" rx="14" fill="#f4f5f7" stroke="#d1d5db" stroke-width="1.5"/>
<defs>
<marker id="ah12" markerWidth="13" markerHeight="13" refX="7" refY="4.5" orient="auto">
<path d="M0,0 L11,4.5 L0,9 Z" fill="#374151"/>
</marker>
</defs>

<!-- Row 1: stages 1-4 -->
<g>
<rect x="60" y="110" width="190" height="150" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
<circle cx="80" cy="128" r="15" fill="#374151" stroke="#fff" stroke-width="2.5"/>
<text x="80" y="133" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">1</text>
<text x="155" y="163" text-anchor="middle" font-size="13.5" font-weight="800" fill="#1f2937">Photovoltaic</text>
<text x="155" y="180" text-anchor="middle" font-size="13.5" font-weight="800" fill="#1f2937">capture</text>
<text x="155" y="205" text-anchor="middle" font-size="11" fill="#4b5563">Sunlight strikes silicon</text>
<text x="155" y="219" text-anchor="middle" font-size="11" fill="#4b5563">panels across the</text>
<text x="155" y="233" text-anchor="middle" font-size="11" fill="#4b5563">solar farm</text>
</g>

<line x1="250" y1="185" x2="300" y2="185" stroke="#374151" stroke-width="4" marker-end="url(#ah12)"/>

<g>
<rect x="302" y="110" width="190" height="150" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
<circle cx="322" cy="128" r="15" fill="#374151" stroke="#fff" stroke-width="2.5"/>
<text x="322" y="133" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">2</text>
<text x="397" y="163" text-anchor="middle" font-size="13.5" font-weight="800" fill="#1f2937">DC generation</text>
<text x="397" y="205" text-anchor="middle" font-size="11" fill="#4b5563">Panels convert photons</text>
<text x="397" y="219" text-anchor="middle" font-size="11" fill="#4b5563">into low-voltage direct</text>
<text x="397" y="233" text-anchor="middle" font-size="11" fill="#4b5563">current (DC)</text>
</g>

<line x1="492" y1="185" x2="542" y2="185" stroke="#374151" stroke-width="4" marker-end="url(#ah12)"/>

<g>
<rect x="544" y="110" width="190" height="150" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
<circle cx="564" cy="128" r="15" fill="#374151" stroke="#fff" stroke-width="2.5"/>
<text x="564" y="133" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">3</text>
<text x="639" y="163" text-anchor="middle" font-size="13.5" font-weight="800" fill="#1f2937">Combiner box</text>
<text x="639" y="205" text-anchor="middle" font-size="11" fill="#4b5563">Output of several panel</text>
<text x="639" y="219" text-anchor="middle" font-size="11" fill="#4b5563">strings is aggregated</text>
<text x="639" y="233" text-anchor="middle" font-size="11" fill="#4b5563">together</text>
</g>

<line x1="734" y1="185" x2="784" y2="185" stroke="#374151" stroke-width="4" marker-end="url(#ah12)"/>

<g>
<rect x="786" y="110" width="190" height="150" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
<circle cx="806" cy="128" r="15" fill="#374151" stroke="#fff" stroke-width="2.5"/>
<text x="806" y="133" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">4</text>
<text x="881" y="163" text-anchor="middle" font-size="13.5" font-weight="800" fill="#1f2937">Inverter station</text>
<text x="881" y="205" text-anchor="middle" font-size="11" fill="#4b5563">DC is converted into</text>
<text x="881" y="219" text-anchor="middle" font-size="11" fill="#4b5563">alternating current</text>
<text x="881" y="233" text-anchor="middle" font-size="11" fill="#4b5563">(AC) by an inverter</text>
</g>

<!-- wrap arrow 4 -> 5 down to row 2 -->
<path d="M881,260 L881,300 L1104,300 L1104,393" fill="none" stroke="#374151" stroke-width="4" marker-end="url(#ah12)"/>

<!-- Row 2: stage 5 (rightmost, mirrors wrap), 6 branch, 7, 8 -->
<g>
<rect x="1028" y="395" width="152" height="150" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
<circle cx="1048" cy="413" r="15" fill="#374151" stroke="#fff" stroke-width="2.5"/>
<text x="1048" y="418" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">5</text>
<text x="1104" y="448" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1f2937">Step-up</text>
<text x="1104" y="465" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1f2937">transformer</text>
<text x="1104" y="490" text-anchor="middle" font-size="10.5" fill="#4b5563">Raises AC voltage</text>
<text x="1104" y="504" text-anchor="middle" font-size="10.5" fill="#4b5563">from 480V to</text>
<text x="1104" y="518" text-anchor="middle" font-size="10.5" fill="#4b5563">33kV</text>
</g>

<!-- Arrow 5 -> 6 (leftward along row 2) -->
<path d="M1028,470 L982,470" fill="none" stroke="#374151" stroke-width="4" marker-end="url(#ah12)"/>

<!-- Stage 6: battery storage - branch, shown slightly offset above the line -->
<g>
<rect x="786" y="395" width="190" height="150" rx="10" fill="#eef0f2" stroke="#9ca3af" stroke-width="2"/>
<circle cx="806" cy="413" r="15" fill="#6b7280" stroke="#fff" stroke-width="2.5"/>
<text x="806" y="418" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">6</text>
<text x="881" y="448" text-anchor="middle" font-size="13" font-weight="800" fill="#1f2937">Battery storage</text>
<text x="881" y="465" text-anchor="middle" font-size="13" font-weight="800" fill="#1f2937">bank</text>
<text x="881" y="490" text-anchor="middle" font-size="10.5" fill="#4b5563">Surplus output diverted</text>
<text x="881" y="504" text-anchor="middle" font-size="10.5" fill="#4b5563">to lithium-ion cells for</text>
<text x="881" y="518" text-anchor="middle" font-size="10.5" fill="#4b5563">later use</text>
</g>
<text x="881" y="385" text-anchor="middle" font-size="10.5" font-style="italic" fill="#6b7280">(surplus branch)</text>

<line x1="786" y1="470" x2="736" y2="470" stroke="#374151" stroke-width="4" marker-end="url(#ah12)"/>

<!-- Stage 7 -->
<g>
<rect x="544" y="395" width="190" height="150" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
<circle cx="564" cy="413" r="15" fill="#374151" stroke="#fff" stroke-width="2.5"/>
<text x="564" y="418" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">7</text>
<text x="639" y="448" text-anchor="middle" font-size="13.5" font-weight="800" fill="#1f2937">Substation</text>
<text x="639" y="473" text-anchor="middle" font-size="10.5" fill="#4b5563">Voltage stepped up again</text>
<text x="639" y="487" text-anchor="middle" font-size="10.5" fill="#4b5563">to 230kV for long-distance</text>
<text x="639" y="501" text-anchor="middle" font-size="10.5" fill="#4b5563">transmission</text>
</g>

<line x1="544" y1="470" x2="494" y2="470" stroke="#374151" stroke-width="4" marker-end="url(#ah12)"/>

<!-- Stage 8 -->
<g>
<rect x="302" y="395" width="190" height="150" rx="10" fill="#ffffff" stroke="#374151" stroke-width="2.5"/>
<circle cx="322" cy="413" r="15" fill="#374151" stroke="#fff" stroke-width="2.5"/>
<text x="322" y="418" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">8</text>
<text x="397" y="448" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1f2937">National grid</text>
<text x="397" y="465" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1f2937">distribution</text>
<text x="397" y="490" text-anchor="middle" font-size="10.5" fill="#4b5563">Electricity reaches</text>
<text x="397" y="504" text-anchor="middle" font-size="10.5" fill="#4b5563">homes, factories and</text>
<text x="397" y="518" text-anchor="middle" font-size="10.5" fill="#4b5563">EV chargers</text>
</g>

<text x="1224" y="606" text-anchor="end" font-size="10.5" font-style="italic" fill="#4b5563">Illustrative data for teaching &#183; IELTS Advanced</text>
</svg>
