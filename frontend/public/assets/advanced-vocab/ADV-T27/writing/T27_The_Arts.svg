<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="690" viewBox="0 0 1240 690" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
<rect width="1240" height="690" fill="#ffffff"/>
<text x="620.0" y="34" text-anchor="middle" font-size="21" font-weight="800" fill="#1f2937">Northgate Contemporary Art Gallery: 2010 and 2024 (after redevelopment)</text>

<!-- 2010 panel -->
<rect x="26" y="64" width="581" height="540" rx="12" fill="#f7f8f9" stroke="#c3c8ce" stroke-width="2"/>
<clipPath id="cp1"><rect x="26" y="64" width="581" height="540" rx="12"/></clipPath>
<g clip-path="url(#cp1)">
<text x="316.5" y="54" text-anchor="middle" font-size="17" font-weight="800" fill="#1f2937">2010</text>

<!-- outer building outline -->
<rect x="60" y="110" width="513" height="430" fill="#ffffff" stroke="#9ca3af" stroke-width="2.5"/>

<!-- North wing (top) -->
<rect x="60" y="110" width="513" height="140" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
<text x="316.5" y="170" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a5f">Permanent Collection</text>
<text x="316.5" y="190" text-anchor="middle" font-size="11.5" fill="#3b5170">(small gallery)</text>

<!-- South wing (bottom) -->
<rect x="60" y="400" width="513" height="140" fill="#fee2e2" stroke="#fca5a5" stroke-width="2"/>
<text x="316.5" y="465" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">Temporary Exhibition Hall</text>

<!-- West courtyard (left, middle) -->
<rect x="60" y="250" width="160" height="150" fill="#dcfce7" stroke="#86efac" stroke-width="2"/>
<circle cx="140" cy="310" r="14" fill="#a3e635" stroke="#4d7c0f" stroke-width="2"/>
<text x="140" y="345" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">Open courtyard</text>
<text x="140" y="360" text-anchor="middle" font-size="11" fill="#14532d">with sculpture</text>

<!-- East side: ticket desk + cafe -->
<rect x="413" y="250" width="160" height="150" fill="#fef3c7" stroke="#fcd34d" stroke-width="2"/>
<rect x="450" y="290" width="86" height="30" fill="#ffffff" stroke="#b45309" stroke-width="1.6"/>
<text x="493" y="345" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">Ticket desk</text>
<text x="493" y="360" text-anchor="middle" font-size="11" fill="#78350f">+ small cafe</text>

<!-- Entrance arrow from east -->
<line x1="610" y1="325" x2="576" y2="325" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow1)"/>
<text x="620" y="329" font-size="11.5" font-weight="700" fill="#1f2937">Entrance</text>

<!-- Rear car park -->
<rect x="60" y="560" width="513" height="0" />
<text x="316.5" y="565" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">Rear: gravel car park (20 spaces)</text>

<defs><marker id="arrow1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1f2937"/></marker></defs>

<g transform="translate(560,110)">
<circle r="17" fill="#fff" stroke="#9ca3af" stroke-width="1.5"/>
<path d="M0,-12 L4.5,5 L0,1 L-4.5,5 Z" fill="#374151"/>
<text y="-19" text-anchor="middle" font-size="11" font-weight="800" fill="#1f2937">N</text>
</g>
</g>

<!-- 2024 panel -->
<rect x="633" y="64" width="581" height="540" rx="12" fill="#f7f8f9" stroke="#c3c8ce" stroke-width="2"/>
<clipPath id="cp2"><rect x="633" y="64" width="581" height="540" rx="12"/></clipPath>
<g clip-path="url(#cp2)">
<text x="923.5" y="54" text-anchor="middle" font-size="17" font-weight="800" fill="#1f2937">2024</text>

<rect x="667" y="110" width="513" height="430" fill="#ffffff" stroke="#9ca3af" stroke-width="2.5"/>

<!-- North wing enlarged: Permanent Collection doubled + Digital Art Suite -->
<rect x="667" y="110" width="513" height="140" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
<line x1="923.5" y1="110" x2="923.5" y2="250" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="795" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a5f">Permanent Collection</text>
<text x="795" y="178" text-anchor="middle" font-size="11" fill="#3b5170">(doubled in area)</text>
<text x="1052" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a5f">Digital Art</text>
<text x="1052" y="178" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a5f">Suite (new)</text>

<!-- South wing: Temp Exhibition preserved + Education & Workshop Centre -->
<rect x="667" y="400" width="513" height="140" fill="#fee2e2" stroke="#fca5a5" stroke-width="2"/>
<line x1="923.5" y1="400" x2="923.5" y2="540" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="795" y="460" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7f1d1d">Temporary</text>
<text x="795" y="476" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7f1d1d">Exhibition Hall</text>
<text x="1052" y="460" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">Education &amp;</text>
<text x="1052" y="476" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">Workshop Centre (new)</text>

<!-- West: enclosed Atrium (was courtyard) -->
<rect x="667" y="250" width="160" height="150" fill="#dcfce7" stroke="#86efac" stroke-width="2"/>
<path d="M667,250 L747,270 L827,250" fill="none" stroke="#4d7c0f" stroke-width="2" stroke-dasharray="4 3"/>
<circle cx="747" cy="315" r="12" fill="#a3e635" stroke="#4d7c0f" stroke-width="2"/>
<text x="747" y="350" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14532d">Atrium (enclosed)</text>
<text x="747" y="365" text-anchor="middle" font-size="10.5" fill="#14532d">rotating installations</text>

<!-- East: Visitor Hub glass-fronted -->
<rect x="1020" y="250" width="160" height="150" fill="#fef3c7" stroke="#fcd34d" stroke-width="2"/>
<rect x="1050" y="285" width="100" height="40" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
<text x="1100" y="350" text-anchor="middle" font-size="11.5" font-weight="700" fill="#78350f">Visitor Hub</text>
<text x="1100" y="365" text-anchor="middle" font-size="10" fill="#78350f">cafe, gift shop, ticketing</text>

<!-- East entrance retained -->
<line x1="1217" y1="325" x2="1183" y2="325" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow2)"/>

<!-- South entrance new -->
<line x1="923.5" y1="576" x2="923.5" y2="542" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow3)"/>
<text x="923.5" y="595" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f2937">New south entrance</text>

<text x="923.5" y="565" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">Sculpture Garden + underground parking (80 spaces)</text>

<defs>
<marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1f2937"/></marker>
<marker id="arrow3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1f2937"/></marker>
</defs>

<g transform="translate(1167,110)">
<circle r="17" fill="#fff" stroke="#9ca3af" stroke-width="1.5"/>
<path d="M0,-12 L4.5,5 L0,1 L-4.5,5 Z" fill="#374151"/>
<text y="-19" text-anchor="middle" font-size="11" font-weight="800" fill="#1f2937">N</text>
</g>
</g>

<text x="1224" y="676" text-anchor="end" font-size="10.5" font-style="italic" fill="#4b5563">Illustrative data for teaching · IELTS Advanced</text>
</svg>
