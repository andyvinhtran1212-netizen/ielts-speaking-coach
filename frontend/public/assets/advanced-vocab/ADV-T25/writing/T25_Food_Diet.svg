<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
<rect width="1280" height="960" fill="#ffffff"/>
<text x="640" y="34" text-anchor="middle" font-size="22" font-weight="800" fill="#1f2937">How Coffee is Produced: From Farm to Cup</text>
<text x="640" y="56" text-anchor="middle" font-size="13.5" fill="#4b5563">A man-made process · 8 stages</text>
<rect x="28" y="72" width="1224" height="856" rx="14" fill="#f4f5f7" stroke="#d1d5db" stroke-width="1.5"/>

<defs><marker id="pa" markerWidth="13" markerHeight="13" refX="7" refY="4.5" orient="auto"><path d="M0,0 L11,4.5 L0,9 Z" fill="#374151"/></marker></defs>

<!-- Row 1: stages 1-4 left to right, Row 2: stages 5-8 left to right (S-shape) -->
<!-- connectors row1 -->
<line x1="227" y1="260" x2="441" y2="260" stroke="#374151" stroke-width="4.5" marker-end="url(#pa)"/>
<line x1="533" y1="260" x2="747" y2="260" stroke="#374151" stroke-width="4.5" marker-end="url(#pa)"/>
<line x1="839" y1="260" x2="1053" y2="260" stroke="#374151" stroke-width="4.5" marker-end="url(#pa)"/>
<!-- down connector from stage4 to stage5 -->
<path d="M1151,260 L1238,260 L1238,634 L1155,634" fill="none" stroke="#374151" stroke-width="4.5" marker-end="url(#pa)"/>
<!-- connectors row2 (reverse direction 5->6->7->8) -->
<line x1="1053" y1="634" x2="839" y2="634" stroke="#374151" stroke-width="4.5" marker-end="url(#pa)"/>
<line x1="747" y1="634" x2="533" y2="634" stroke="#374151" stroke-width="4.5" marker-end="url(#pa)"/>
<line x1="441" y1="634" x2="227" y2="634" stroke="#374151" stroke-width="4.5" marker-end="url(#pa)"/>

<!-- Stage 1: Cultivation -->
<g transform="translate(105,166) scale(1.04,1.04)">
<path d="M50,10 C30,30 26,55 30,80 L70,80 C74,55 70,30 50,10 Z" fill="#16a34a" stroke="#1f2937" stroke-width="3"/>
<circle cx="50" cy="45" r="9" fill="#dc2626"/>
<circle cx="38" cy="60" r="7" fill="#dc2626"/>
<circle cx="62" cy="62" r="7" fill="#dc2626"/>
<rect x="44" y="80" width="12" height="10" fill="#7c5230"/>
</g>
<circle cx="135" cy="197.5" r="14" fill="#374151" stroke="#fff" stroke-width="2.5"/>
<text x="135" y="202" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">1</text>
<text x="181" y="306" text-anchor="middle" font-size="14.5" font-weight="800" fill="#1f2937">Cultivation</text>
<text x="181" y="322" text-anchor="middle" font-size="11.5" fill="#4b5563">Coffee shrubs are grown on</text>
<text x="181" y="336" text-anchor="middle" font-size="11.5" fill="#4b5563">tropical highland farms in</text>
<text x="181" y="350" text-anchor="middle" font-size="11.5" fill="#4b5563">Brazil, Vietnam and Ethiopia</text>

<!-- Stage 2: Harvesting -->
<g transform="translate(411,166) scale(1.04,1.04)">
<ellipse cx="50" cy="55" rx="30" ry="24" fill="none" stroke="#1f2937" stroke-width="3"/>
<circle cx="38" cy="48" r="7" fill="#dc2626" stroke="#1f2937" stroke-width="1.5"/>
<circle cx="55" cy="42" r="7" fill="#dc2626" stroke="#1f2937" stroke-width="1.5"/>
<circle cx="62" cy="58" r="7" fill="#dc2626" stroke="#1f2937" stroke-width="1.5"/>
<circle cx="42" cy="64" r="7" fill="#dc2626" stroke="#1f2937" stroke-width="1.5"/>
<path d="M30,86 L38,72 M70,86 L62,72" stroke="#1f2937" stroke-width="3"/>
</g>
<circle cx="441" cy="197.5" r="14" fill="#374151" stroke="#fff" stroke-width="2.5"/>
<text x="441" y="202" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">2</text>
<text x="487" y="306" text-anchor="middle" font-size="14.5" font-weight="800" fill="#1f2937">Harvesting</text>
<text x="487" y="322" text-anchor="middle" font-size="11.5" fill="#4b5563">Ripe red cherries are picked,</text>
<text x="487" y="336" text-anchor="middle" font-size="11.5" fill="#4b5563">either by hand or by machine</text>

<!-- Stage 3: Pulping -->
<g transform="translate(717,166) scale(1.04,1.04)">
<rect x="26" y="34" width="48" height="40" rx="6" fill="#e5e7eb" stroke="#1f2937" stroke-width="3"/>
<circle cx="50" cy="54" r="12" fill="#9ca3af" stroke="#1f2937" stroke-width="2"/>
<path d="M50,42 L50,66 M38,54 L62,54" stroke="#1f2937" stroke-width="2"/>
<circle cx="20" cy="80" r="6" fill="#7c5230"/>
<circle cx="34" cy="86" r="6" fill="#7c5230"/>
<circle cx="66" cy="86" r="6" fill="#dc2626"/>
<circle cx="80" cy="80" r="6" fill="#dc2626"/>
</g>
<circle cx="747" cy="197.5" r="14" fill="#374151" stroke="#fff" stroke-width="2.5"/>
<text x="747" y="202" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">3</text>
<text x="793" y="306" text-anchor="middle" font-size="14.5" font-weight="800" fill="#1f2937">Pulping</text>
<text x="793" y="322" text-anchor="middle" font-size="11.5" fill="#4b5563">The outer skin and pulp are</text>
<text x="793" y="336" text-anchor="middle" font-size="11.5" fill="#4b5563">mechanically stripped from</text>
<text x="793" y="350" text-anchor="middle" font-size="11.5" fill="#4b5563">the beans</text>

<!-- Stage 4: Fermentation -->
<g transform="translate(1023,166) scale(1.04,1.04)">
<rect x="24" y="30" width="52" height="52" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
<rect x="27" y="55" width="46" height="24" fill="#93c5fd" opacity="0.7"/>
<circle cx="38" cy="66" r="4" fill="#7c5230"/>
<circle cx="50" cy="70" r="4" fill="#7c5230"/>
<circle cx="62" cy="64" r="4" fill="#7c5230"/>
<text x="50" y="94" text-anchor="middle" font-size="10" font-weight="700" fill="#1f2937">48h</text>
</g>
<circle cx="1053" cy="197.5" r="14" fill="#374151" stroke="#fff" stroke-width="2.5"/>
<text x="1053" y="202" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">4</text>
<text x="1099" y="306" text-anchor="middle" font-size="14.5" font-weight="800" fill="#1f2937">Fermentation</text>
<text x="1099" y="322" text-anchor="middle" font-size="11.5" fill="#4b5563">Beans soak in water tanks for</text>
<text x="1099" y="336" text-anchor="middle" font-size="11.5" fill="#4b5563">up to 48 hours to dissolve</text>
<text x="1099" y="350" text-anchor="middle" font-size="11.5" fill="#4b5563">the remaining mucilage</text>

<!-- Stage 5: Drying -->
<g transform="translate(1023,541) scale(1.04,1.04)">
<circle cx="76" cy="20" r="14" fill="#fbbf24" stroke="#1f2937" stroke-width="2"/>
<line x1="76" y1="0" x2="76" y2="6" stroke="#1f2937" stroke-width="2"/>
<line x1="94" y1="20" x2="100" y2="20" stroke="#1f2937" stroke-width="2"/>
<line x1="90" y1="6" x2="94" y2="10" stroke="#1f2937" stroke-width="2"/>
<rect x="20" y="50" width="56" height="10" fill="#d1d5db" stroke="#1f2937" stroke-width="2"/>
<circle cx="30" cy="46" r="3.5" fill="#7c5230"/>
<circle cx="42" cy="46" r="3.5" fill="#7c5230"/>
<circle cx="54" cy="46" r="3.5" fill="#7c5230"/>
<circle cx="66" cy="46" r="3.5" fill="#7c5230"/>
</g>
<circle cx="1053" cy="572.5" r="14" fill="#374151" stroke="#fff" stroke-width="2.5"/>
<text x="1053" y="577" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">5</text>
<text x="1099" y="680" text-anchor="middle" font-size="14.5" font-weight="800" fill="#1f2937">Drying</text>
<text x="1099" y="698" text-anchor="middle" font-size="11.5" fill="#4b5563">Beans are sun-dried on patios</text>
<text x="1099" y="712" text-anchor="middle" font-size="11.5" fill="#4b5563">or in mechanical dryers until</text>
<text x="1099" y="726" text-anchor="middle" font-size="11.5" fill="#4b5563">moisture falls to roughly 11%</text>

<!-- Stage 6: Hulling & sorting -->
<g transform="translate(717,541) scale(1.04,1.04)">
<rect x="18" y="30" width="64" height="14" rx="3" fill="#e5e7eb" stroke="#1f2937" stroke-width="2.5"/>
<circle cx="28" cy="37" r="2.5" fill="#9ca3af"/><circle cx="38" cy="37" r="2.5" fill="#9ca3af"/><circle cx="48" cy="37" r="2.5" fill="#9ca3af"/><circle cx="58" cy="37" r="2.5" fill="#9ca3af"/><circle cx="68" cy="37" r="2.5" fill="#9ca3af"/>
<circle cx="34" cy="66" r="6" fill="#16a34a" stroke="#1f2937" stroke-width="1.5"/>
<circle cx="50" cy="70" r="6" fill="#16a34a" stroke="#1f2937" stroke-width="1.5"/>
<circle cx="66" cy="64" r="6" fill="#a3e635" stroke="#1f2937" stroke-width="1.5"/>
</g>
<circle cx="747" cy="572.5" r="14" fill="#374151" stroke="#fff" stroke-width="2.5"/>
<text x="747" y="577" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">6</text>
<text x="793" y="680" text-anchor="middle" font-size="14.5" font-weight="800" fill="#1f2937">Hulling &amp; sorting</text>
<text x="793" y="698" text-anchor="middle" font-size="11.5" fill="#4b5563">The parchment layer is</text>
<text x="793" y="712" text-anchor="middle" font-size="11.5" fill="#4b5563">removed and green beans are</text>
<text x="793" y="726" text-anchor="middle" font-size="11.5" fill="#4b5563">graded by size and density</text>

<!-- Stage 7: Export & roasting -->
<g transform="translate(411,541) scale(1.04,1.04)">
<rect x="16" y="46" width="30" height="34" rx="2" fill="#d6b98c" stroke="#1f2937" stroke-width="2.5"/>
<line x1="16" y1="56" x2="46" y2="56" stroke="#7c5230" stroke-width="1.5"/>
<line x1="16" y1="66" x2="46" y2="66" stroke="#7c5230" stroke-width="1.5"/>
<path d="M60,30 Q80,20 95,35" fill="none" stroke="#9ca3af" stroke-width="3"/>
<circle cx="70" cy="60" r="18" fill="#374151" stroke="#1f2937" stroke-width="2.5"/>
<circle cx="70" cy="60" r="9" fill="#7c5230"/>
</g>
<circle cx="441" cy="572.5" r="14" fill="#374151" stroke="#fff" stroke-width="2.5"/>
<text x="441" y="577" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">7</text>
<text x="487" y="680" text-anchor="middle" font-size="14.5" font-weight="800" fill="#1f2937">Export &amp; roasting</text>
<text x="487" y="698" text-anchor="middle" font-size="11.5" fill="#4b5563">Green beans are shipped in</text>
<text x="487" y="712" text-anchor="middle" font-size="11.5" fill="#4b5563">jute sacks, then roasted at</text>
<text x="487" y="726" text-anchor="middle" font-size="11.5" fill="#4b5563">200–240°C in destination</text>
<text x="487" y="740" text-anchor="middle" font-size="11.5" fill="#4b5563">countries</text>

<!-- Stage 8: Grinding & brewing -->
<g transform="translate(105,541) scale(1.04,1.04)">
<rect x="30" y="20" width="20" height="30" rx="3" fill="#9ca3af" stroke="#1f2937" stroke-width="2.5"/>
<rect x="26" y="14" width="28" height="8" rx="2" fill="#374151"/>
<path d="M20,70 L80,70 L74,96 L26,96 Z" fill="#ffffff" stroke="#1f2937" stroke-width="3"/>
<path d="M80,76 q14,-2 14,10 q0,12 -14,10" fill="none" stroke="#1f2937" stroke-width="3"/>
<path d="M30,70 q20,10 40,0" fill="none" stroke="#7c5230" stroke-width="4"/>
</g>
<circle cx="135" cy="572.5" r="14" fill="#374151" stroke="#fff" stroke-width="2.5"/>
<text x="135" y="577" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">8</text>
<text x="181" y="680" text-anchor="middle" font-size="14.5" font-weight="800" fill="#1f2937">Grinding &amp; brewing</text>
<text x="181" y="698" text-anchor="middle" font-size="11.5" fill="#4b5563">Roasted beans are ground,</text>
<text x="181" y="712" text-anchor="middle" font-size="11.5" fill="#4b5563">packaged and finally brewed</text>
<text x="181" y="726" text-anchor="middle" font-size="11.5" fill="#4b5563">and served to the consumer</text>

<text x="640" y="800" text-anchor="middle" font-size="12" font-style="italic" fill="#6b7280">Three broad phases: farm-based cultivation (1–2) → mechanised processing (3–6) → export and consumer-country finishing (7–8)</text>

<text x="1264" y="946" text-anchor="end" font-size="10.5" font-style="italic" fill="#4b5563">Illustrative data for teaching · IELTS Advanced</text>
</svg>
