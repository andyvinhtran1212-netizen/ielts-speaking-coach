<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
<rect width="1240" height="700" fill="#ffffff"/>
<text x="620" y="34" text-anchor="middle" font-size="22" font-weight="800" fill="#1f2937">Brackish Bay: 2025 and 2075 (projected, +1.1m sea level)</text>

<!-- Panel 1: 2025 -->
<rect x="26" y="60" width="581" height="580" rx="12" fill="#f7f8f9" stroke="#c3c8ce" stroke-width="2"/>
<g>
<text x="316.5" y="50" text-anchor="middle" font-size="17" font-weight="800" fill="#1f2937">2025 (present)</text>

<!-- sea (south = bottom) -->
<rect x="26" y="470" width="581" height="170" fill="#bcd9e8"/>
<path d="M26,470 q15,-8 30,0 q15,-8 30,0 q15,-8 30,0 q15,-8 30,0 q15,-8 30,0 q15,-8 30,0 q15,-8 30,0 q15,-8 30,0 q15,-8 30,0 q15,-8 30,0 q15,-8 30,0 q15,-8 30,0 q15,-8 30,0 q15,-8 30,0 q15,-8 30,0 q15,-8 30,0 q15,-8 30,0 q15,-8 30,0 q15,-8 30,0" fill="none" stroke="#bcd9e8" stroke-width="14" stroke-linecap="round"/>
<text x="580" y="620" text-anchor="end" font-size="12.5" font-weight="800" fill="#1f5f7a">Sea</text>

<!-- beach: sandy strip 1.2km -->
<rect x="26" y="430" width="581" height="40" fill="#e8dcb0"/>
<text x="316.5" y="455" text-anchor="middle" font-size="12" font-weight="700" fill="#7a6a34">South-coast beach (1.2 km sandy beach)</text>

<!-- coastal road parallel to beach -->
<rect x="26" y="404" width="581" height="14" fill="#6b7280"/>
<line x1="40" y1="411" x2="60" y2="411" stroke="#fff" stroke-width="2" stroke-dasharray="10 8"/>
<line x1="90" y1="411" x2="110" y2="411" stroke="#fff" stroke-width="2" stroke-dasharray="10 8"/>
<line x1="140" y1="411" x2="160" y2="411" stroke="#fff" stroke-width="2" stroke-dasharray="10 8"/>
<line x1="190" y1="411" x2="210" y2="411" stroke="#fff" stroke-width="2" stroke-dasharray="10 8"/>
<line x1="240" y1="411" x2="260" y2="411" stroke="#fff" stroke-width="2" stroke-dasharray="10 8"/>
<line x1="290" y1="411" x2="310" y2="411" stroke="#fff" stroke-width="2" stroke-dasharray="10 8"/>
<line x1="340" y1="411" x2="360" y2="411" stroke="#fff" stroke-width="2" stroke-dasharray="10 8"/>
<line x1="390" y1="411" x2="410" y2="411" stroke="#fff" stroke-width="2" stroke-dasharray="10 8"/>
<line x1="440" y1="411" x2="460" y2="411" stroke="#fff" stroke-width="2" stroke-dasharray="10 8"/>
<line x1="490" y1="411" x2="510" y2="411" stroke="#fff" stroke-width="2" stroke-dasharray="10 8"/>
<line x1="540" y1="411" x2="560" y2="411" stroke="#fff" stroke-width="2" stroke-dasharray="10 8"/>
<text x="316.5" y="398" text-anchor="middle" font-size="11.5" font-weight="700" fill="#374151">Coastal road</text>

<!-- residential district: 350 houses, 150m inland -->
<g>
<rect x="90" y="300" width="24" height="20" fill="#d1d5db" stroke="#1f2937" stroke-width="1.4"/>
<polygon points="88,300 102,290 116,300" fill="#9ca3af" stroke="#1f2937" stroke-width="1.4"/>
<rect x="124" y="300" width="24" height="20" fill="#d1d5db" stroke="#1f2937" stroke-width="1.4"/>
<polygon points="122,300 136,290 150,300" fill="#9ca3af" stroke="#1f2937" stroke-width="1.4"/>
<rect x="158" y="300" width="24" height="20" fill="#d1d5db" stroke="#1f2937" stroke-width="1.4"/>
<polygon points="156,300 170,290 184,300" fill="#9ca3af" stroke="#1f2937" stroke-width="1.4"/>
<rect x="192" y="300" width="24" height="20" fill="#d1d5db" stroke="#1f2937" stroke-width="1.4"/>
<polygon points="190,300 204,290 218,300" fill="#9ca3af" stroke="#1f2937" stroke-width="1.4"/>
<rect x="226" y="300" width="24" height="20" fill="#d1d5db" stroke="#1f2937" stroke-width="1.4"/>
<polygon points="224,300 238,290 252,300" fill="#9ca3af" stroke="#1f2937" stroke-width="1.4"/>
<rect x="260" y="300" width="24" height="20" fill="#d1d5db" stroke="#1f2937" stroke-width="1.4"/>
<polygon points="258,300 272,290 286,300" fill="#9ca3af" stroke="#1f2937" stroke-width="1.4"/>
<rect x="110" y="330" width="24" height="20" fill="#d1d5db" stroke="#1f2937" stroke-width="1.4"/>
<polygon points="108,330 122,320 136,330" fill="#9ca3af" stroke="#1f2937" stroke-width="1.4"/>
<rect x="144" y="330" width="24" height="20" fill="#d1d5db" stroke="#1f2937" stroke-width="1.4"/>
<polygon points="142,330 156,320 170,330" fill="#9ca3af" stroke="#1f2937" stroke-width="1.4"/>
<rect x="178" y="330" width="24" height="20" fill="#d1d5db" stroke="#1f2937" stroke-width="1.4"/>
<polygon points="176,330 190,320 204,330" fill="#9ca3af" stroke="#1f2937" stroke-width="1.4"/>
<rect x="212" y="330" width="24" height="20" fill="#d1d5db" stroke="#1f2937" stroke-width="1.4"/>
<polygon points="210,330 224,320 238,330" fill="#9ca3af" stroke="#1f2937" stroke-width="1.4"/>
</g>
<rect x="70" y="358" width="240" height="22" rx="6" fill="#ffffff" opacity="0.9" stroke="#c3c8ce"/>
<text x="190" y="373" text-anchor="middle" font-size="11" font-weight="700" fill="#1f2937">Residential district (350 houses, 150m inland)</text>

<!-- western land use: wetland + rice paddies -->
<g>
<rect x="60" y="130" width="180" height="120" fill="#c9e4c5" stroke="#7fa876" stroke-width="1.5"/>
<line x1="60" y1="150" x2="240" y2="150" stroke="#7fa876" stroke-width="1"/>
<line x1="60" y1="170" x2="240" y2="170" stroke="#7fa876" stroke-width="1"/>
<line x1="60" y1="190" x2="240" y2="190" stroke="#7fa876" stroke-width="1"/>
<line x1="60" y1="210" x2="240" y2="210" stroke="#7fa876" stroke-width="1"/>
<line x1="60" y1="230" x2="240" y2="230" stroke="#7fa876" stroke-width="1"/>
</g>
<rect x="70" y="168" width="150" height="34" rx="6" fill="#ffffff" opacity="0.9" stroke="#c3c8ce"/>
<text x="145" y="184" text-anchor="middle" font-size="11" font-weight="700" fill="#1f2937">Freshwater wetland</text>
<text x="145" y="197" text-anchor="middle" font-size="11" font-weight="700" fill="#1f2937">&amp; rice paddies</text>

<!-- fishing harbour east headland -->
<g>
<polygon points="480,140 560,140 560,200 480,200" fill="#d9cdb8" stroke="#8a7a5c" stroke-width="1.5"/>
<rect x="495" y="160" width="50" height="10" fill="#8a5a3c"/>
<polygon points="505,160 505,145 520,155" fill="#e5e7eb" stroke="#1f2937" stroke-width="1.2"/>
<polygon points="525,160 525,148 538,157" fill="#e5e7eb" stroke="#1f2937" stroke-width="1.2"/>
</g>
<rect x="460" y="205" width="140" height="34" rx="6" fill="#ffffff" opacity="0.9" stroke="#c3c8ce"/>
<text x="530" y="220" text-anchor="middle" font-size="11" font-weight="700" fill="#1f2937">Fishing harbour</text>
<text x="530" y="233" text-anchor="middle" font-size="11" font-weight="700" fill="#1f2937">(east headland)</text>

<!-- mangrove fringe east, 200m -->
<rect x="480" y="430" width="127" height="40" fill="#8fae7a" stroke="#5f7a4c" stroke-width="1.5"/>
<text x="543" y="455" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2f4a26">Mangrove (200m)</text>

<!-- N arrow -->
<g transform="translate(560,90)">
<circle r="17" fill="#fff" stroke="#9ca3af" stroke-width="1.5"/>
<path d="M0,-11 L4.5,5 L0,1 L-4.5,5 Z" fill="#374151"/>
<text y="-19" text-anchor="middle" font-size="11" font-weight="800" fill="#1f2937">N</text>
</g>
</g>

<!-- Panel 2: 2075 -->
<rect x="633" y="60" width="581" height="580" rx="12" fill="#f7f8f9" stroke="#c3c8ce" stroke-width="2"/>
<g>
<text x="923.5" y="50" text-anchor="middle" font-size="17" font-weight="800" fill="#1f2937">2075 (projected, +1.1m)</text>

<!-- sea now covers much more: new coastline 400m inland (beach gone) -->
<rect x="633" y="330" width="581" height="310" fill="#a9cfe0"/>
<path d="M633,330 q15,-8 30,0 q15,-8 30,0 q15,-8 30,0 q15,-8 30,0 q15,-8 30,0 q15,-8 30,0 q15,-8 30,0 q15,-8 30,0 q15,-8 30,0 q15,-8 30,0 q15,-8 30,0 q15,-8 30,0 q15,-8 30,0 q15,-8 30,0 q15,-8 30,0 q15,-8 30,0 q15,-8 30,0 q15,-8 30,0 q15,-8 30,0" fill="none" stroke="#a9cfe0" stroke-width="14" stroke-linecap="round"/>
<text x="1187" y="620" text-anchor="end" font-size="12.5" font-weight="800" fill="#1f5f7a">Sea (beach fully submerged)</text>
<text x="1187" y="345" text-anchor="end" font-size="10.5" font-style="italic" fill="#1f5f7a">new coastline ~400m inland</text>

<!-- sea wall 4m, replacing road -->
<rect x="633" y="320" width="581" height="16" fill="#5b6472"/>
<text x="923.5" y="315" text-anchor="middle" font-size="11.5" font-weight="700" fill="#374151">4m sea wall (replaces road)</text>

<!-- residential: reduced by 40% to 210 houses, relocated 600m inland on raised platforms -->
<g>
<rect x="700" y="130" width="26" height="4" fill="#9ca3af"/>
<rect x="708" y="112" width="10" height="18" fill="#d1d5db" stroke="#1f2937" stroke-width="1.2"/>
<polygon points="706,112 713,104 720,112" fill="#9ca3af" stroke="#1f2937" stroke-width="1.2"/>
<rect x="740" y="130" width="26" height="4" fill="#9ca3af"/>
<rect x="748" y="112" width="10" height="18" fill="#d1d5db" stroke="#1f2937" stroke-width="1.2"/>
<polygon points="746,112 753,104 760,112" fill="#9ca3af" stroke="#1f2937" stroke-width="1.2"/>
<rect x="780" y="130" width="26" height="4" fill="#9ca3af"/>
<rect x="788" y="112" width="10" height="18" fill="#d1d5db" stroke="#1f2937" stroke-width="1.2"/>
<polygon points="786,112 793,104 800,112" fill="#9ca3af" stroke="#1f2937" stroke-width="1.2"/>
<rect x="820" y="130" width="26" height="4" fill="#9ca3af"/>
<rect x="828" y="112" width="10" height="18" fill="#d1d5db" stroke="#1f2937" stroke-width="1.2"/>
<polygon points="826,112 833,104 840,112" fill="#9ca3af" stroke="#1f2937" stroke-width="1.2"/>
</g>
<rect x="686" y="150" width="180" height="34" rx="6" fill="#ffffff" opacity="0.9" stroke="#c3c8ce"/>
<text x="776" y="165" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1f2937">210 houses (-40%), on raised</text>
<text x="776" y="178" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1f2937">platforms, 600m inland</text>

<!-- western land use: brackish aquaculture ponds (converted from paddies) -->
<g>
<rect x="667" y="220" width="180" height="120" fill="#b7cfe0" stroke="#6f93ab" stroke-width="1.5"/>
<rect x="675" y="230" width="76" height="46" fill="#a4c4da" stroke="#6f93ab" stroke-width="1.2"/>
<rect x="759" y="230" width="76" height="46" fill="#a4c4da" stroke="#6f93ab" stroke-width="1.2"/>
<rect x="675" y="284" width="76" height="46" fill="#a4c4da" stroke="#6f93ab" stroke-width="1.2"/>
<rect x="759" y="284" width="76" height="46" fill="#a4c4da" stroke="#6f93ab" stroke-width="1.2"/>
</g>
<rect x="677" y="260" width="160" height="34" rx="6" fill="#ffffff" opacity="0.9" stroke="#c3c8ce"/>
<text x="757" y="275" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1f2937">Brackish aquaculture</text>
<text x="757" y="288" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1f2937">ponds (was rice paddies)</text>

<!-- deep-water jetty replacing harbour -->
<g>
<rect x="1040" y="150" width="18" height="130" fill="#8a7a5c"/>
<rect x="1000" y="150" width="98" height="14" fill="#7a6a4a" stroke="#5c4f38" stroke-width="1.2"/>
</g>
<rect x="965" y="168" width="150" height="34" rx="6" fill="#ffffff" opacity="0.9" stroke="#c3c8ce"/>
<text x="1040" y="183" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1f2937">Deep-water jetty</text>
<text x="1040" y="196" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1f2937">(was harbour)</text>

<!-- mangrove fringe expanded to 500m -->
<rect x="1000" y="336" width="214" height="90" fill="#8fae7a" stroke="#5f7a4c" stroke-width="1.5"/>
<text x="1107" y="368" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2f4a26">Mangrove fringe</text>
<text x="1107" y="381" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2f4a26">expanded to 500m</text>

<!-- N arrow -->
<g transform="translate(1167,90)">
<circle r="17" fill="#fff" stroke="#9ca3af" stroke-width="1.5"/>
<path d="M0,-11 L4.5,5 L0,1 L-4.5,5 Z" fill="#374151"/>
<text y="-19" text-anchor="middle" font-size="11" font-weight="800" fill="#1f2937">N</text>
</g>
</g>

<text x="1224" y="686" text-anchor="end" font-size="10.5" font-style="italic" fill="#4b5563">Illustrative data for teaching &#183; IELTS Advanced</text>
</svg>
