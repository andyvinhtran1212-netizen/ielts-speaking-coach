<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>Nhịp làm bài — Full Test 4 kỹ năng</title>
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('av-theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', (stored === 'light' || stored === 'dark') ? stored : (prefersDark ? 'dark' : 'light'));
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/aver-design/tokens.css" />
  <link rel="stylesheet" href="/css/aver-design/components.css" />
  <link rel="stylesheet" href="/css/aver-design/admin-components.css" />
  <link rel="stylesheet" href="/css/aver-design/admin-buttons.css" />
  <style>
    .mp-wrap { max-width:var(--av-width-page,1180px); margin:0 auto; padding:var(--av-space-6) var(--av-space-4) var(--av-space-16); }
    .mp-muted { color:var(--av-text-secondary); font-size:13px; line-height:1.55; }
    .mp-head { display:flex; align-items:baseline; gap:var(--av-space-3); flex-wrap:wrap; margin-bottom:var(--av-space-2); }
    .mp-name { font-size:20px; font-weight:800; color:var(--av-text-primary); }
    .mp-code { font-family:var(--av-font-mono); color:var(--av-text-secondary); }

    /* The caveat box is not decoration. These numbers look more precise than
       they are, and a teacher acting on "8 phút cho câu 12" when the data
       cannot support it is worse than having no chart. */
    .mp-caveat { border:1px solid var(--av-border-subtle); border-left:4px solid var(--av-warning);
                 background:var(--av-surface-sunken); border-radius:var(--av-radius-md);
                 padding:var(--av-space-3); margin-bottom:var(--av-space-6); font-size:12px;
                 color:var(--av-text-secondary); line-height:1.6; }

    .mp-sec { border:1px solid var(--av-border-subtle); border-radius:var(--av-radius-lg);
              background:var(--av-surface-card); padding:var(--av-space-4); margin-bottom:var(--av-space-4); }
    .mp-sec__h { display:flex; align-items:baseline; gap:var(--av-space-3); flex-wrap:wrap; margin-bottom:var(--av-space-3); }
    .mp-sec__t { font-weight:700; color:var(--av-text-primary); }
    .mp-kpis { display:flex; gap:var(--av-space-6); flex-wrap:wrap; margin-bottom:var(--av-space-3); }
    .mp-kpi__n { font-family:var(--av-font-mono); font-size:20px; font-weight:700; color:var(--av-text-primary); }
    .mp-kpi__n--warn { color:var(--av-warning); }
    .mp-kpi__k { display:block; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--av-text-secondary); }

    /* One bar per answer, in the order they landed. Height encodes the gap
       before it, so a stall is a tall bar and a burst is a flat run. */
    .mp-strip { display:flex; align-items:flex-end; gap:2px; height:96px; padding:var(--av-space-2);
                background:var(--av-surface-sunken); border-radius:var(--av-radius-md); overflow-x:auto; }
    .mp-bar { flex:0 0 14px; background:var(--av-primary); border-radius:2px 2px 0 0; min-height:3px; position:relative; }
    .mp-bar.is-long { background:var(--av-warning); }
    .mp-bar__q { position:absolute; bottom:-16px; left:0; right:0; text-align:center;
                 font-size:9px; color:var(--av-text-faint); font-family:var(--av-font-mono); }
    .mp-striplegend { margin-top:20px; font-size:12px; color:var(--av-text-faint); }
    .mp-empty { color:var(--av-text-faint); font-size:13px; padding:var(--av-space-4) 0; }
    .hidden { display:none; }
  </style>
</head>
<body class="av-page font-sans min-h-screen">
  <div class="mp-wrap">
    <p class="mp-muted" style="margin-bottom:var(--av-space-3)">
      <a href="/pages/admin/mock-live/index.html">← Phòng thi trực tiếp</a>
    </p>
    <div id="state-loading" class="mp-muted" style="padding:40px 0;text-align:center">Đang tải…</div>
    <div id="state-error" class="hidden mp-muted" style="padding:24px 0;color:var(--av-error)"></div>
    <div id="state-content" class="hidden">
      <div class="mp-head" id="head"></div>
      <div class="mp-caveat" id="caveat"></div>
      <div id="sections"></div>
    </div>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2.107.0"></script>
  <script src="/js/runtime-config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/admin-mock-pacing.js"></script>
</body>
</html>
