<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>Mock Test — Admin</title>
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('av-theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme',
          (stored === 'light' || stored === 'dark') ? stored : (prefersDark ? 'dark' : 'light'));
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/aver-design/tokens.css" />
  <link rel="stylesheet" href="/css/aver-design/components.css" />
  <link rel="stylesheet" href="/css/aver-design/admin-components.css" />
  <style>
    /* Cockpit: an exam rail + a tabbed panel that hosts each mock surface.
       The rail scopes "Duyệt bài thi" to one exam; the panel embeds the
       existing (design-system) tools until each tab is ported natively. */
    .mt-cockpit { display: grid; grid-template-columns: 300px 1fr; gap: var(--av-space-4);
      padding: var(--av-space-6); min-height: 100vh; align-items: start; }

    .mt-rail { position: sticky; top: var(--av-space-6); align-self: start;
      background: var(--av-surface-card); border: 1px solid var(--av-border-default);
      border-radius: var(--av-radius-lg); overflow: hidden; }
    .mt-rail__head { display: flex; align-items: baseline; justify-content: space-between;
      gap: var(--av-space-2); padding: var(--av-space-4) var(--av-space-4) var(--av-space-2); }
    .mt-rail__title { font-size: var(--av-fs-lg); font-weight: var(--av-fw-bold);
      letter-spacing: var(--av-tracking-tight); color: var(--av-text-primary); }
    .mt-rail__count { font-size: var(--av-fs-xs); color: var(--av-text-faint);
      font-variant-numeric: tabular-nums; }
    .mt-filters { display: flex; flex-wrap: wrap; gap: var(--av-space-1);
      padding: 0 var(--av-space-4) var(--av-space-3); }
    .mt-chip { font-size: var(--av-fs-xs); font-weight: var(--av-fw-medium);
      /* 3px of vertical padding made this ~18px tall — a filter you have to aim
         at. Height, not padding, so the pill keeps its shape. */
      padding: 0 var(--av-space-3); min-height: 32px; display: inline-flex;
      align-items: center; border-radius: var(--av-radius-pill);
      border: 1px solid var(--av-border-default); background: var(--av-surface-sunken);
      color: var(--av-text-secondary); cursor: pointer; }
    .mt-chip.is-active { background: var(--av-primary-soft); color: var(--av-primary);
      border-color: var(--av-primary-border); }
    .mt-list { list-style: none; margin: 0; padding: 0 var(--av-space-2) var(--av-space-3);
      max-height: calc(100vh - var(--mt-rail-chrome)); overflow-y: auto; }
    .mt-exam { display: block; width: 100%; text-align: left; cursor: pointer;
      padding: var(--av-space-3); border: 1px solid transparent; border-radius: var(--av-radius-md);
      background: none; color: inherit; font: inherit; }
    .mt-exam:hover { background: var(--av-surface-sunken); }
    .mt-exam.is-active { background: var(--av-primary-soft); border-color: var(--av-primary-border); }
    .mt-exam__code { font-weight: var(--av-fw-semibold); color: var(--av-primary);
      letter-spacing: .02em; font-size: var(--av-fs-sm); }
    .mt-exam__title { font-size: var(--av-fs-sm); color: var(--av-text-primary);
      margin-top: 2px; line-height: var(--av-lh-snug); }
    .mt-exam__meta { display: flex; align-items: center; gap: var(--av-space-2);
      margin-top: var(--av-space-2); }
    .mt-stage { font-size: var(--av-fs-xs); font-weight: var(--av-fw-medium);
      padding: 1px var(--av-space-2); border-radius: var(--av-radius-pill);
      background: var(--av-surface-sunken); color: var(--av-text-secondary);
      border: 1px solid var(--av-border-subtle); }
    .mt-stage--draft { color: var(--av-text-muted); }
    .mt-stage--live { background: var(--av-success-soft); color: var(--av-success);
      border-color: color-mix(in srgb, var(--av-success) 30%, transparent); }
    .mt-stage--closed { background: var(--av-warning-soft); color: var(--av-warning);
      border-color: color-mix(in srgb, var(--av-warning) 30%, transparent); }
    .mt-rail__empty, .mt-rail__loading { padding: var(--av-space-4); color: var(--av-text-muted);
      font-size: var(--av-fs-sm); }

    /* Panel: tab bar + embedded surface */
    .mt-panel { background: var(--av-surface-card); border: 1px solid var(--av-border-default);
      border-radius: var(--av-radius-lg); overflow: hidden; min-height: calc(100vh - var(--mt-page-chrome));
      display: flex; flex-direction: column; }
    .mt-tabs { display: flex; gap: 2px; padding: var(--av-space-2) var(--av-space-3) 0;
      border-bottom: 1px solid var(--av-border-default); }
    .mt-tab { appearance: none; background: none; border: none; cursor: pointer; font: inherit;
      font-size: var(--av-fs-sm); font-weight: var(--av-fw-medium); color: var(--av-text-secondary);
      padding: var(--av-space-3) var(--av-space-4); border-radius: var(--av-radius-md) var(--av-radius-md) 0 0;
      border-bottom: 2px solid transparent; margin-bottom: -1px; }
    .mt-tab:hover { color: var(--av-text-primary); background: var(--av-surface-sunken); }
    .mt-tab.is-active { color: var(--av-primary); border-bottom-color: var(--av-primary); }
    /* Visible focus on EVERY control, not just the tabs: the rail buttons and the
       stage chips are reachable by keyboard too, and a focus you cannot see is
       the same as no focus. */
    .mt-tab:focus-visible,
    .mt-chip:focus-visible,
    .mt-exam:focus-visible { outline: none; box-shadow: var(--av-shadow-focus); }

    /* ONE number for the chrome the cockpit sits under. It was written three
       times (110px twice, 200px once) and they drifted apart the moment the
       panel grew a context bar — the frame and its empty state then disagreed
       on height and the panel jumped when you switched tabs. */
    .mt-cockpit {
      /* The page padding the whole cockpit sits inside. */
      --mt-page-chrome: 48px;
      --mt-chrome: 110px;
      /* The rail sits under its own title and filter chips, so its offset is
         genuinely larger than the panel's — named, not left as a bare 200px. */
      --mt-rail-chrome: 200px; }
    .mt-frame-wrap { position: relative; flex: 1; }
    .mt-frame { width: 100%; height: 100%; min-height: calc(100vh - var(--mt-chrome));
      border: 0; display: block; }
    .mt-need-exam { display: flex; align-items: center; justify-content: center;
      height: calc(100vh - var(--mt-chrome)); padding: var(--av-space-8); text-align: center;
      color: var(--av-text-muted); font-size: var(--av-fs-sm); }
    /* Context bar — quiet by design: it is orientation, not a heading. */
    .mt-context { display: flex; align-items: center; gap: var(--av-space-2);
      padding: var(--av-space-2) var(--av-space-4);
      border-bottom: 1px solid var(--av-border-subtle);
      background: var(--av-surface-sunken); font-size: var(--av-fs-xs);
      color: var(--av-text-secondary); }
    .mt-context__code { font-weight: var(--av-fw-semibold); color: var(--av-text-primary); }
    .mt-context__title { color: var(--av-text-muted); min-width: 0; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap; }
    /* A tab that needs a class selected says so BEFORE it is clicked — otherwise
       the only way to find out is to land on an empty state. */
    .mt-tab[data-needs-exam]::before { content: "⦁" / ""; margin-right: 4px;
      color: var(--av-text-faint); }
    .mt-tab[data-needs-exam].is-active::before { color: var(--av-primary); }
    /* This page never loads tailwind.build.css, where .hidden is defined — so
       every classList.add('hidden') here did NOTHING. Measured: #mt-need-exam
       stayed 687px tall (the mysterious blank area under the roster) and
       #mt-loading kept showing "Đang tải…" forever, both while carrying the
       class. The sibling admin pages (mock-reviews, students) already declare it
       locally for the same reason; the cockpit was the one that didn't.
       Declared AFTER the block rules above so it wins on equal specificity. */
    .hidden { display: none !important; }

    @media (max-width: 900px) {
      .mt-cockpit { grid-template-columns: 1fr; padding: var(--av-space-4);
        --mt-chrome: 0px; }
      .mt-rail { position: static; }
      .mt-list { max-height: 300px; }
      .mt-frame, .mt-need-exam { min-height: 70vh; }
    }
  </style>
</head>
<body class="av-page font-sans antialiased">
  <aver-admin-chrome active="mock-tests" subsection="manage">
    <main class="mt-cockpit">
      <!-- Exam rail — scopes the review tab to one exam. -->
      <aside class="mt-rail">
        <div class="mt-rail__head">
          <span class="mt-rail__title">Đề thi</span>
          <span class="mt-rail__count" id="mt-count"></span>
        </div>
        <div class="mt-filters" id="mt-filters">
          <button type="button" class="mt-chip is-active" data-stage="all" aria-pressed="true">Tất cả</button>
          <button type="button" class="mt-chip" data-stage="draft" aria-pressed="false">Nháp</button>
          <button type="button" class="mt-chip" data-stage="live" aria-pressed="false">Đang thi</button>
          <button type="button" class="mt-chip" data-stage="closed" aria-pressed="false">Đã đóng</button>
        </div>
        <p class="mt-rail__loading" id="mt-loading">Đang tải…</p>
        <p class="mt-rail__empty hidden" id="mt-empty">Chưa có đề nào.</p>
        <ul class="mt-list hidden" id="mt-list"></ul>
      </aside>

      <!-- Tabbed panel -->
      <section class="mt-panel">
        <nav class="mt-tabs" role="tablist" aria-label="Mock Test">
          <button type="button" class="mt-tab is-active" id="mt-tab-manage" data-tab="manage" role="tab"
                  aria-selected="true" aria-controls="mt-panel-body">Quản lý đề</button>
          <!-- data-needs-exam is read by BOTH the CSS (the ⦁ marker) and the JS
               (which tabs require a selection). One source, so the dot cannot
               say one thing while the behaviour does another. -->
          <button type="button" class="mt-tab" id="mt-tab-live" data-tab="live" role="tab" data-needs-exam
                  title="Cần chọn một đề ở danh sách bên trái"
                  aria-selected="false" aria-controls="mt-panel-body" tabindex="-1">Phòng thi trực tiếp</button>
          <button type="button" class="mt-tab" id="mt-tab-review" data-tab="review" role="tab" data-needs-exam
                  title="Cần chọn một đề ở danh sách bên trái"
                  aria-selected="false" aria-controls="mt-panel-body" tabindex="-1">Duyệt bài thi</button>
          <button type="button" class="mt-tab" id="mt-tab-writing" data-tab="writing" role="tab"
                  aria-selected="false" aria-controls="mt-panel-body" tabindex="-1">Chấm Writing</button>
        </nav>
        <!-- Which exam this panel is acting on. Two tabs (phòng thi trực tiếp,
             duyệt bài) operate on ONE class, and the only place that said which
             was the rail — so an admin scrolled back to check before doing
             something irreversible. The panel now says it where the action is. -->
        <div class="mt-context" id="mt-context" hidden></div>
        <div class="mt-frame-wrap" id="mt-panel-body" role="tabpanel" tabindex="0">
          <iframe class="mt-frame hidden" id="mt-frame" title="Mock Test"></iframe>
          <div class="mt-need-exam hidden" id="mt-need-exam">Chọn một đề ở danh sách bên trái để duyệt bài thi.</div>
        </div>
      </section>
    </main>
  </aver-admin-chrome>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.107.0"></script>
  <script src="/js/runtime-config.js"></script>
  <script src="/js/api.js"></script>
  <script type="module" src="/js/components/aver-admin-chrome.js"></script>
  <script src="/js/admin-mock-tests.js"></script>
</body>
</html>
