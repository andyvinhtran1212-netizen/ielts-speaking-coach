<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>Lớp — Đang chuyển hướng</title>

  <!-- GĐ 1 (docs/CLASS_MANAGEMENT_PLAN_2026-08-02.md) — quản lý lớp đã gộp vào
       /pages/admin/classes/. Trang này giữ lại làm chuyển hướng vì admin đã
       bookmark từng lớp cụ thể (?cohort_id=…) và những đường dẫn đó phải vẫn tới
       đúng lớp.

       Chuyển hướng bằng JS chứ không phải <meta refresh>: cần mang theo query
       string, mà meta refresh chỉ đi tới một URL cố định nên sẽ nuốt mất
       cohort_id. Giữ IIFE chống nháy theme để trang trung gian không loé sai
       giao diện. -->

  <script>
    (function () {
      try {
        var stored = localStorage.getItem('av-theme');
        var theme = (stored === 'light' || stored === 'dark')
          ? stored
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>

  <script>
    (function () {
      var target = '/pages/admin/classes/index.html' + (window.location.search || '');
      // replace() so Back does not bounce the admin straight back here.
      window.location.replace(target);
    })();
  </script>

  <link rel="canonical" href="/pages/admin/classes/index.html" />

  <link rel="stylesheet" href="/css/aver-design/tokens.css" />
  <link rel="stylesheet" href="/css/aver-design/components.css" />
  <link rel="stylesheet" href="/css/aver-design/admin-surface.css" data-aver-admin-surface="1" />

  <style>
    body.av-page {
      font-family: var(--av-font-sans);
      margin: 0; padding: var(--av-space-8);
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh;
    }
    .closure-card {
      max-width: 480px;
      padding: var(--av-space-6);
      border: 1px solid var(--av-border-default);
      border-radius: var(--av-radius-md);
      background: var(--av-surface-card);
      text-align: center;
    }
    .closure-card h1 { font-size: var(--av-fs-lg); margin: 0 0 var(--av-space-2); }
    .closure-card p { color: var(--av-text-secondary); font-size: var(--av-fs-sm);
      margin: 0 0 var(--av-space-4); }
    .closure-card a {
      display: inline-block;
      padding: var(--av-space-2) var(--av-space-4);
      border-radius: var(--av-radius-md);
      background: var(--av-brand-teal-700);
      color: var(--av-text-on-primary);
      text-decoration: none;
      font-weight: var(--av-fw-semibold);
      font-size: var(--av-fs-sm);
    }
  </style>
  <script src="/js/runtime-config.js"></script>
  <script src="/js/legacy-retirement-beacon.js" defer></script>
</head>
<body class="av-page av-admin-surface">
  <!-- Chỉ hiện khi JS bị tắt hoặc chuyển hướng chưa kịp chạy. -->
  <div class="closure-card">
    <h1>Quản lý lớp đã chuyển</h1>
    <p>Lớp và học viên nay nằm chung một trang.</p>
    <a href="/pages/admin/classes/index.html">Mở Lớp &amp; Học viên</a>
  </div>
</body>
</html>
