<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>Bài đọc — Aver Learning</title>

  <script>
    (function () {
      try {
        var stored = localStorage.getItem('av-theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = (stored === 'light' || stored === 'dark') ? stored : (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/aver-design/tokens.css" />
  <link rel="stylesheet" href="/css/aver-design/components.css" />
  <link rel="stylesheet" href="/css/markdown.css" />
  <link rel="stylesheet" href="/css/image-lightbox.css" />
  <link rel="stylesheet" href="/css/reading-vocab.css" />

  <script src="https://unpkg.com/@supabase/supabase-js@2.107.0" defer></script>
  <script src="/js/runtime-config.js"></script>
  <script src="/js/api.js"></script>
  <script type="module" src="/js/components/aver-chrome.js"></script>

  <!-- Markdown render + lightbox + glossary popover (defer → ready before the page script). -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.8/dist/purify.min.js" defer></script>
  <script src="/js/markdown.js" defer></script>
  <script src="/js/image-lightbox.js" defer></script>
  <script src="/js/components/glossary-popover.js" defer></script>
  <script src="/js/components/reading-questions.js" defer></script>
  <script src="/js/components/reading-passage-panes.js" defer></script>
  <link rel="stylesheet" href="/css/feedback.css" />
  <script src="/js/feedback-widgets.js" defer></script>
</head>
<body class="av-page">

  <div class="rv-progress" aria-hidden="true"><div class="rv-progress__fill" id="rv-progress-fill"></div></div>

  <aver-chrome active="reading"></aver-chrome>

  <div class="shell">
    <main class="rv-shell rv-detail-shell">
      <div class="rv-empty" id="state-loading">Đang tải…</div>
      <div class="rv-empty" id="state-empty" hidden>Không tìm thấy bài đọc.</div>
      <div class="rv-error" id="state-error" hidden></div>

      <div class="rv-detail" id="rv-passage" hidden>
        <header class="rv-detail__header">
          <a class="rv-back" href="/reading/vocab"><span aria-hidden="true">←</span> Thư viện Vocab Reading</a>
          <div class="rv-detail__heading">
            <div class="rv-detail__copy">
              <p class="rv-kicker">READING LAB · VOCAB</p>
              <h1 class="rv-passage__title" id="rv-title"></h1>
              <div class="rv-detail__topics" id="rv-topic-tags" aria-label="Chủ đề bài đọc"></div>
            </div>
            <dl class="rv-detail__facts" aria-label="Thông tin bài đọc">
              <div><dt id="rv-difficulty">—</dt><dd>Trình độ</dd></div>
              <div><dt id="rv-estimated-time">—</dt><dd>Phút đọc</dd></div>
              <div><dt id="rv-word-count">—</dt><dd>Từ</dd></div>
            </dl>
          </div>
        </header>

        <div class="rv-passage-layout">
          <article class="rv-reader" aria-label="Nội dung bài đọc">
            <header class="rv-reader__head">
              <p>Bài đọc</p>
              <span>Chạm vào từ gạch chân để xem nghĩa trong ngữ cảnh.</span>
            </header>
            <div class="rv-passage__body md-body" id="rv-body"></div>
          </article>
          <aside class="rv-questions" id="rv-questions" aria-label="Câu hỏi hiểu bài"></aside>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/reading-vocab-passage.js" defer></script>
</body>
</html>
