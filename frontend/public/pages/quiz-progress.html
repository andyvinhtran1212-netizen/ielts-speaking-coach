<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>Thống kê luyện tập</title>
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('av-theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme',
          (stored === 'light' || stored === 'dark') ? stored : (prefersDark ? 'dark' : 'light'));
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/aver-design/tokens.css" />
  <link rel="stylesheet" href="/css/aver-design/components.css" />
  <link rel="stylesheet" href="/css/tailwind.build.css" />
  <script type="module" src="/js/components/aver-chrome.js"></script>
  <link rel="stylesheet" href="/css/quiz-progress.css" />
</head>
<body class="av-page font-sans antialiased">
  <aver-chrome active="vocabulary"></aver-chrome>

  <main class="av-w-read pg-shell">
    <header class="subpage-header">
      <div class="subpage-header__lhs">
        <!-- Target is set from ?skill_area= in the script below: a grammar
             Quick-Check must not send the learner back to the vocab picker. -->
        <a id="pg-back" class="subpage-header__back" href="/pages/vocab-practice.html"><span aria-hidden="true">←</span><span id="pg-back-label">Luyện tập</span></a>
      </div>
    </header>
    <h1 class="pg-title">📊 Thống kê luyện tập</h1>
    <p class="pg-sub">Tổng hợp kết quả Quick-Check của bạn.</p>

    <p id="pg-loading" class="pg-empty">Đang tải…</p>

    <div id="pg-main" class="hidden">
      <div class="pg-stats" id="pg-totals"></div>

      <h2 class="pg-h2">Theo bộ</h2>
      <div id="pg-banks"></div>

      <h2 class="pg-h2">Câu tôi đã trả lời sai</h2>
      <p class="pg-sub">Bấm vào một từ để xem lại câu hỏi, đáp án bạn đã chọn và đáp án đúng.</p>
      <div id="pg-mistakes"></div>
      <p id="pg-mistakes-cap" class="pg-cap hidden"></p>

      <h2 class="pg-h2">Phiên gần đây</h2>
      <div id="pg-sessions"></div>
    </div>

    <p id="pg-error" class="hidden pg-err"></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.107.0"></script>
  <script src="/js/runtime-config.js"></script>
  <script src="/js/api.js"></script>
  <script>
    // Khởi tạo Supabase TRƯỚC khi gọi `mount()` — giữ nguyên thứ tự bản inline cũ.
    initSupabase('https://huwsmtubwulikhlmcirx.supabase.co',
                 'sb_publishable_hvevBST9lgIWRd5ITHtUpA_SYjiX6Ao');
  </script>
  <script type="module">
    // Logic đã tách sang `/js/quiz-progress.js` để bản Next chạy CHÍNH mã này.
    import { mount } from '/js/quiz-progress.js';
    mount();
  </script>
</body>
</html>
