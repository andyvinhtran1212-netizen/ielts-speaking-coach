<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>Luyện nhanh — Aver Learning</title>

  <script>
    (function () {
      try {
        var stored = localStorage.getItem('av-theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = (stored === 'light' || stored === 'dark') ? stored : (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/aver-design/tokens.css" />
  <link rel="stylesheet" href="/css/aver-design/components.css" />
  <link rel="stylesheet" href="/css/listening.css" />

  <script src="https://unpkg.com/@supabase/supabase-js@2.107.0" defer></script>
  <script src="/js/runtime-config.js"></script>
  <script src="/js/api.js"></script>
  <script type="module" src="/js/components/aver-chrome.js"></script>
  <script type="module" src="/js/components/audio-player.js"></script>

  <style>
    /* Deliberately NOT the exam chrome. Luyện nhanh is a 30–90s drill: one
       question on screen, answered and settled before the next appears. The
       full-test shell (section tabs, 40-slot answer grid, sticky submit bar)
       is scaffolding for a 30-minute paper and only gets in the way here.
       Same visual language as chép chính tả, which has the same shape. */
    .lpr-shell {
      max-width: 720px; margin: 0 auto;
      padding: 0 var(--av-space-6);
      display: flex; flex-direction: column; gap: var(--av-space-6);
    }
    .lpr-header h1 { font-size: var(--av-fs-2xl); margin-bottom: var(--av-space-1); }
    .lpr-header .accent { color: var(--av-brand-teal-700); }
    .lpr-header .subtitle {
      color: var(--av-text-secondary); font-size: var(--av-fs-sm);
      line-height: var(--av-lh-normal);
    }

    .segment-progress { display: flex; align-items: center; flex-wrap: wrap; }
    .progress-label { color: var(--av-text-secondary); font-size: var(--av-fs-sm); }
    .progress-counter {
      font-family: var(--av-font-mono); font-weight: var(--av-fw-semibold);
      margin-left: var(--av-space-2);
    }
    .segment-dots { display: flex; gap: 6px; flex-wrap: wrap; margin-left: var(--av-space-3); }
    .segment-dot {
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--av-surface-sunken); border: 1px solid var(--av-border-default);
      transition: background var(--av-duration-fast) var(--av-easing-default);
    }
    .segment-dot.is-correct { background: var(--av-brand-teal-700); border-color: var(--av-brand-teal-700); }
    .segment-dot.is-wrong   { background: var(--av-error); border-color: var(--av-error); }
    .segment-dot.is-current { box-shadow: 0 0 0 2px var(--av-brand-teal-200); }

    .lpr-question {
      padding: var(--av-space-6);
      border: 1px solid var(--av-border-default);
      border-radius: var(--av-radius-lg);
      background: var(--av-surface-card);
      display: flex; flex-direction: column; gap: var(--av-space-4);
    }
    .lpr-instruction {
      font-size: var(--av-fs-sm); color: var(--av-text-secondary);
      line-height: var(--av-lh-normal);
    }
    .lpr-prompt {
      font-size: var(--av-fs-lg); font-weight: var(--av-fw-medium);
      color: var(--av-text-primary); line-height: var(--av-lh-relaxed);
    }
    .lpr-prompt .gap {
      font-family: var(--av-font-mono); color: var(--av-brand-teal-700);
      letter-spacing: 0.1em;
    }

    .lpr-options { display: flex; flex-direction: column; gap: var(--av-space-2); }
    .lpr-option {
      display: flex; align-items: flex-start; gap: var(--av-space-3);
      padding: var(--av-space-3) var(--av-space-4);
      border: 1px solid var(--av-border-default);
      border-radius: var(--av-radius-md);
      cursor: pointer; line-height: var(--av-lh-normal);
    }
    .lpr-option:hover { border-color: var(--av-brand-teal-700); background: var(--av-brand-teal-50); }
    .lpr-option input { margin-top: 3px; flex: none; }
    .lpr-option-letter { font-weight: var(--av-fw-semibold); flex: none; }
    .lpr-option.is-picked { border-color: var(--av-brand-teal-700); background: var(--av-brand-teal-50); }

    .answer-input {
      width: 100%; padding: var(--av-space-3) var(--av-space-4);
      border: 1px solid var(--av-border-default); border-radius: var(--av-radius-md);
      background: var(--av-surface-card); color: var(--av-text-primary);
      font-family: var(--av-font-sans); font-size: var(--av-fs-base);
    }
    .answer-input:focus {
      outline: 2px solid var(--av-brand-teal-700); outline-offset: 2px;
      border-color: var(--av-brand-teal-700);
    }

    .lpr-scope-row { display: flex; justify-content: flex-end; margin-top: var(--av-space-2); }
    .submit-row { display: flex; gap: var(--av-space-3); align-items: center; flex-wrap: wrap; }
    .btn-primary {
      padding: var(--av-space-3) var(--av-space-6); border-radius: var(--av-radius-md);
      background: var(--av-brand-teal-700); color: var(--av-text-on-primary);
      border: none; font-family: inherit; font-weight: var(--av-fw-semibold); cursor: pointer;
    }
    .btn-primary:hover { background: var(--av-brand-teal-800); }
    .btn-primary:disabled { background: var(--av-text-muted); cursor: not-allowed; }
    .btn-secondary {
      padding: var(--av-space-3) var(--av-space-4); border-radius: var(--av-radius-md);
      background: transparent; color: var(--av-text-secondary);
      border: 1px solid var(--av-border-default); font-family: inherit; cursor: pointer;
    }
    .btn-secondary:hover { border-color: var(--av-brand-teal-700); color: var(--av-brand-teal-700); }

    .lpr-verdict {
      padding: var(--av-space-4); border-radius: var(--av-radius-md);
      border: 1px solid var(--av-border-default); line-height: var(--av-lh-relaxed);
      font-size: var(--av-fs-sm);
    }
    .lpr-verdict.is-correct {
      border-color: var(--av-brand-teal-700); background: var(--av-brand-teal-50);
      color: var(--av-brand-teal-800);
    }
    .lpr-verdict.is-wrong { border-color: var(--av-error); color: var(--av-text-primary); }
    .lpr-verdict strong { font-weight: var(--av-fw-semibold); }
    .lpr-verdict .loop-note { color: var(--av-text-secondary); display: block; margin-top: var(--av-space-2); }

    .lpr-summary-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: var(--av-space-2); }
    .lpr-summary-item {
      display: flex; gap: var(--av-space-3); align-items: baseline;
      padding: var(--av-space-3); border: 1px solid var(--av-border-default);
      border-radius: var(--av-radius-md); font-size: var(--av-fs-sm);
    }
    .lpr-summary-item .mark { font-weight: var(--av-fw-semibold); flex: none; }
    .lpr-summary-item.ok .mark { color: var(--av-brand-teal-700); }
    .lpr-summary-item.no .mark { color: var(--av-error); }
    .completion-score {
      display: flex; align-items: baseline; gap: var(--av-space-3);
      margin-bottom: var(--av-space-4);
    }
    .score-value { font-family: var(--av-font-mono); font-size: var(--av-fs-3xl); font-weight: var(--av-fw-bold); }
    .score-label { color: var(--av-text-secondary); font-size: var(--av-fs-sm); }
    .score-note { color: var(--av-text-secondary); font-size: var(--av-fs-sm); line-height: var(--av-lh-relaxed); }

    .empty-state {
      padding: var(--av-space-8); text-align: center;
      border: 1px dashed var(--av-border-default);
      border-radius: var(--av-radius-lg); color: var(--av-text-secondary);
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body class="av-page">

  <aver-chrome active="listening"></aver-chrome>

  <div class="shell">
    <main class="lpr-shell">

      <header class="lpr-header">
        <p class="eyebrow">
          <a href="/pages/listening-practice.html" id="lpr-back"
             style="color: var(--av-text-secondary);">← Quay lại Luyện nhanh</a>
        </p>
        <h1>Luyện <span class="accent">nhanh</span> · <span id="lpr-title">…</span></h1>
        <p class="subtitle" id="lpr-subtitle"></p>
      </header>

      <div class="empty-state" id="state-loading">Đang tải…</div>
      <div class="error-banner" id="state-error" hidden></div>

      <!-- ── Run surface ─────────────────────────────────────────────── -->
      <div id="lpr-run" hidden>

        <div class="segment-progress">
          <span class="progress-label">Câu</span>
          <span class="progress-counter" id="lpr-counter">1 / 1</span>
          <div class="segment-dots" id="lpr-dots" role="list" aria-label="Tiến độ các câu"></div>
        </div>

        <audio-player id="lpr-player" compact></audio-player>

        <!-- Scope toggle. The player is normally locked to the current
             question's few seconds; some traps only make sense with the line
             before them ("£12 — sorry, £9"), so the whole clip stays one click
             away. Hidden when the drill has no per-question windows. -->
        <div class="lpr-scope-row">
          <button class="btn-secondary" id="lpr-scope" type="button" hidden>▶ Nghe cả bài</button>
        </div>

        <div class="lpr-question">
          <p class="lpr-instruction" id="lpr-instruction" hidden></p>
          <div class="lpr-prompt" id="lpr-prompt"></div>
          <div id="lpr-answer" aria-live="polite"></div>

          <div class="lpr-verdict" id="lpr-verdict" hidden></div>

          <div class="submit-row">
            <button class="btn-primary"   id="lpr-check"  type="button">Kiểm tra</button>
            <button class="btn-secondary" id="lpr-reveal" type="button" hidden>Xem đáp án</button>
            <button class="btn-primary"   id="lpr-next"   type="button" hidden>Câu tiếp theo →</button>
          </div>
        </div>
      </div>

      <!-- ── Summary ─────────────────────────────────────────────────── -->
      <div id="lpr-summary" hidden>
        <div class="completion-score">
          <span class="score-value" id="lpr-score">—</span>
          <span class="score-label">câu đúng ngay lần nghe đầu</span>
        </div>
        <p class="score-note">
          Điểm tính theo <strong>lần trả lời đầu tiên</strong> của mỗi câu — nghe lại
          và sửa vẫn được ghi nhận là chưa bắt được ở lần đầu. Đó là con số phản ánh
          đúng tai bạn hiện tại.
        </p>
        <ul class="lpr-summary-list" id="lpr-summary-list"></ul>
        <div class="submit-row" style="margin-top: var(--av-space-6);">
          <a class="btn-primary" href="/pages/listening-practice.html" style="text-decoration:none;">
            ← Về thư viện Luyện nhanh
          </a>
        </div>
      </div>

    </main>
  </div>

  <script type="module" src="/js/listening-practice-run.js"></script>
</body>
</html>
