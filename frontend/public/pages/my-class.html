<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>Lớp của tôi · Aver Learning</title>

  <script>
    (function () {
      try {
        var stored = localStorage.getItem('av-theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = (stored === 'light' || stored === 'dark') ? stored : (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/aver-design/tokens.css" />
  <link rel="stylesheet" href="/css/aver-design/components.css" />

  <script src="https://unpkg.com/@supabase/supabase-js@2.107.0"></script>
  <script src="/js/runtime-config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/toast.js"></script>
  <!-- Without this, api.js keeps its Supabase client null and sends every
       request with no Authorization header: /api/class/me answers 401 and api.js
       bounces a signed-in student to the login page. Same bootstrap as
       home.html; aver-chrome documents it as a page responsibility. -->
  <script>
    var SUPABASE_URL  = 'https://huwsmtubwulikhlmcirx.supabase.co';
    var SUPABASE_ANON = 'sb_publishable_hvevBST9lgIWRd5ITHtUpA_SYjiX6Ao';
    initSupabase(SUPABASE_URL, SUPABASE_ANON);
  </script>

  <!-- Lesson bodies are Markdown by contract (class_lessons.body_md, mig 176),
       so they go through the shared sanitised renderer rather than being shown
       as raw syntax. -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.8/dist/purify.min.js" defer></script>
  <script src="/js/markdown.js" defer></script>

  <style>
    body.av-page { font-family: var(--av-font-sans); margin: 0; }
    .mc-shell { max-width: 900px; margin: 0 auto; padding: var(--av-space-6);
      display: flex; flex-direction: column; gap: var(--av-space-6); }

    /* ── Header ──────────────────────────────────────────────────────── */
    .mc-head h1 { font-size: var(--av-fs-2xl); font-weight: var(--av-fw-bold);
      margin: 0 0 var(--av-space-1); }
    .mc-course { display: inline-flex; align-items: center; gap: var(--av-space-2);
      color: var(--av-text-secondary); font-size: var(--av-fs-sm); }
    .mc-course-code { font-family: var(--av-font-mono); font-size: var(--av-fs-xs);
      padding: 2px 8px; border-radius: var(--av-radius-pill);
      background: var(--av-surface-sunken); border: 1px solid var(--av-border-default); }

    /* ── Progress strip ──────────────────────────────────────────────── */
    /* ── Nhịp lớp ───────────────────────────────────────────────────────
       Cùng ngôn ngữ với bảng của giáo viên (av-board): mỗi ngày một ô, phân
       biệt bằng HÌNH DẠNG trước rồi mới tới màu. Một dải chỉ khác nhau
       xanh/đỏ là một dải người mù màu không đọc được. */
    .mc-rhythm {
      display: flex; align-items: center; flex-wrap: wrap;
      gap: var(--av-space-2) var(--av-space-3);
      margin-top: var(--av-space-4);
    }
    .mc-rhythm__label {
      font-family: var(--av-font-mono); font-size: var(--av-fs-xs);
      letter-spacing: var(--av-tracking-wide); color: var(--av-text-muted);
      text-transform: uppercase;
    }
    .mc-rhythm__row { display: flex; gap: 3px; }
    .mc-rhythm__row i {
      width: 14px; height: 20px; border-radius: 3px;
      background: var(--av-border-subtle);
      display: grid; place-items: center;
      font-family: var(--av-font-mono); font-size: 10px; line-height: 1;
      color: var(--av-text-muted); font-style: normal;
    }
    .mc-rhythm__row i[data-s='done']    { background: var(--av-success-soft); color: var(--av-success); }
    .mc-rhythm__row i[data-s='late']    { background: var(--av-warning-soft); color: var(--av-warning); }
    .mc-rhythm__row i[data-s='missing'] { background: var(--av-error-soft);   color: var(--av-error); }
    /* HÔM NAY: vạch cao hơn và viền amber — mắt phải rơi vào đây trước. */
    .mc-rhythm__row i[data-today] {
      height: 26px; margin-top: -3px;
      box-shadow: inset 0 0 0 2px var(--av-accent);
    }
    .mc-rhythm__note { font-size: var(--av-fs-xs); color: var(--av-text-secondary); }

    /* HAI cột trên điện thoại, BỐN từ 640px.
       Bản trước khai `repeat(4, 1fr)` ở cả hai nơi — câu lệnh @media đặt lại
       đúng giá trị cũ nên nó không làm gì cả, và bốn ô số bị nhồi vào 360px:
       mỗi ô còn ~80px sau khi trừ đệm, đủ để nhãn "Nộp đúng hạn" gãy làm ba
       dòng và đẩy danh sách bài xuống dưới màn hình. */
    .mc-stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      row-gap: var(--av-space-4);
      margin: var(--av-space-6) 0;
      padding: var(--av-space-4) 0;
      border-top: 1px solid var(--av-border-subtle);
      border-bottom: 1px solid var(--av-border-subtle);
    }
    @media (min-width: 640px) {
      .mc-stats { grid-template-columns: repeat(4, 1fr); row-gap: 0; }
    }
    .mc-stat {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 0 var(--av-space-3);
      border-inline-end: 1px solid var(--av-border-subtle);
      min-width: 0;                 /* nhãn dài co được, không đẩy giãn cột */
    }
    /* Kẻ dọc chỉ nằm GIỮA hai cột. Ở lưới 2 cột, `:last-child` không đủ: ô số
       2 của mỗi hàng cũng là ô cuối hàng, và nó sẽ để lại một vạch cụt ở mép. */
    .mc-stat:nth-child(2n) { border-inline-end: 0; }
    @media (min-width: 640px) {
      .mc-stat:nth-child(2n) { border-inline-end: 1px solid var(--av-border-subtle); }
      .mc-stat:last-child    { border-inline-end: 0; }
    }
    .mc-stat-num { font-size: var(--av-fs-xl); font-weight: var(--av-fw-bold);
      font-variant-numeric: tabular-nums; line-height: 1.1; }
    .mc-stat-label { color: var(--av-text-muted); font-size: var(--av-fs-xs);
      margin-top: 2px; }
    .mc-stat.is-alarm .mc-stat-num { color: var(--av-warning); }

    /* ── The signature: tonight's deadline ───────────────────────────────
       The centre gives one task a day, due 19:00. A student opening this at
       18:20 needs "còn 40 phút", not a date. So the nearest due-today item gets
       a live countdown and everything else stays quiet around it. */
    .mc-due-now { border: 1px solid var(--av-accent-border, var(--av-border-strong));
      border-radius: var(--av-radius-xl); background: var(--av-accent-soft, var(--av-surface-sunken));
      padding: var(--av-space-6); display: flex; flex-wrap: wrap;
      align-items: center; justify-content: space-between; gap: var(--av-space-4); }
    .mc-due-now h2 { font-size: var(--av-fs-lg); font-weight: var(--av-fw-semibold);
      margin: 0 0 var(--av-space-1); }
    .mc-countdown {
      font-family: var(--av-font-mono);
      font-size: var(--av-fs-4xl);            /* đây là con số của cả trang */
      font-weight: var(--av-fw-bold);
      font-variant-numeric: tabular-nums;
      line-height: 1;
      color: var(--av-accent);                /* amber = thứ quan trọng nhất */
      letter-spacing: -0.02em;
    }
    .mc-countdown.is-urgent { color: var(--av-warning); }
    .mc-countdown-label { color: var(--av-text-secondary); font-size: var(--av-fs-xs);
      margin-top: 4px; }

    /* ── Assignment groups ───────────────────────────────────────────── */
    .mc-group h2 { font-size: var(--av-fs-sm); font-weight: var(--av-fw-semibold);
      color: var(--av-text-secondary); text-transform: uppercase;
      letter-spacing: var(--av-tracking-wide); margin: 0 0 var(--av-space-3); }
    .mc-list { display: flex; flex-direction: column; gap: var(--av-space-2); }
    .mc-item { border: 1px solid var(--av-border-subtle); border-radius: var(--av-radius-lg);
      background: var(--av-surface-card); padding: var(--av-space-4);
      display: flex; flex-wrap: wrap; align-items: center;
      justify-content: space-between; gap: var(--av-space-3); }
    .mc-item.is-missing { border-color: color-mix(in srgb, var(--av-warning) 40%, transparent); }
    .mc-item-main { min-width: 0; flex: 1; }
    .mc-item-title { font-weight: var(--av-fw-semibold); margin: 0 0 2px; }
    .mc-item-sub { color: var(--av-text-muted); font-size: var(--av-fs-xs); margin: 0; }
    .mc-item-sub.is-alarm { color: var(--av-warning); }
    .mc-band { font-family: var(--av-font-mono); font-weight: var(--av-fw-semibold); }

    /* "Chưa hoàn tất" — em ấy đã làm chín chặng và chỉ còn một bước, nên nó
       phải đọc ra khác hẳn một bài chưa mở. Mang mực, nhưng không phải màu lỗi:
       em ấy không làm sai gì cả. */
    .mc-partial {
      font-weight: var(--av-fw-semibold);
      /* KHÔNG dùng --av-accent: màu nhấn để dành cho ĐÚNG MỘT con số quan
         trọng nhất trên mỗi màn. Đây là một nhãn trạng thái, không phải con
         số — và tô nhấn hai chỗ là không tô nhấn chỗ nào. */
      color: var(--av-warning);
    }

    /* Ngón tay cần ít nhất 44px. Đệm dọc `space-2` cho ra khoảng 32px — đủ cho
       chuột, hụt cho ngón tay, mà đây là trang chủ yếu mở trên điện thoại. */
    .mc-btn { display: inline-flex; align-items: center; justify-content: center;
      min-height: 44px;
      padding: var(--av-space-2) var(--av-space-4); border-radius: var(--av-radius-md);
      background: var(--av-brand-teal-700); color: var(--av-text-on-primary);
      border: none; font: inherit; font-size: var(--av-fs-sm);
      font-weight: var(--av-fw-semibold); text-decoration: none; cursor: pointer; }
    .mc-btn:disabled { opacity: .6; cursor: default; }
    .mc-btn-quiet { background: transparent; color: var(--av-text-secondary);
      border: 1px solid var(--av-border-default); }

    /* ── Lessons ─────────────────────────────────────────────────────── */
    .mc-lesson { border: 1px solid var(--av-border-subtle); border-radius: var(--av-radius-lg);
      background: var(--av-surface-card); padding: var(--av-space-4);
      display: flex; gap: var(--av-space-4); align-items: flex-start; }
    .mc-lesson-no { font-family: var(--av-font-mono); font-size: var(--av-fs-sm);
      color: var(--av-text-muted); min-width: 3.5rem; padding-top: 2px; }
    .mc-lesson-main { flex: 1; min-width: 0; }
    .mc-lesson-title { font-weight: var(--av-fw-semibold); margin: 0 0 2px; }
    /* Markdown output: block children, so no white-space: pre-wrap (that would
       double every blank line the renderer already turned into a paragraph). */
    .mc-lesson-body { color: var(--av-text-secondary); font-size: var(--av-fs-sm);
      margin: var(--av-space-2) 0 0; overflow-wrap: anywhere; }
    .mc-lesson-body > :first-child { margin-top: 0; }
    .mc-lesson-body > :last-child { margin-bottom: 0; }
    .mc-lesson-body a { color: var(--av-text-primary); }
    .mc-lesson-body ul, .mc-lesson-body ol { padding-left: var(--av-space-4); }
    .mc-files { display: flex; flex-wrap: wrap; gap: var(--av-space-2);
      margin-top: var(--av-space-3); }
    .mc-file { font-size: var(--av-fs-xs); padding: 2px 10px;
      border-radius: var(--av-radius-pill); border: 1px solid var(--av-border-default);
      background: var(--av-surface-sunken); color: var(--av-text-secondary);
      text-decoration: none; }
    .mc-file:hover { color: var(--av-text-primary); }

    .mc-empty { padding: var(--av-space-6); text-align: center;
      color: var(--av-text-muted); font-size: var(--av-fs-sm);
      border: 1px dashed var(--av-border-default); border-radius: var(--av-radius-lg); }
    .mc-note { color: var(--av-text-secondary); font-size: var(--av-fs-sm); }
    .mc-warn { border: 1px solid color-mix(in srgb, var(--av-warning) 40%, transparent);
      background: var(--av-warning-soft); color: var(--av-text-secondary);
      border-radius: var(--av-radius-md); padding: var(--av-space-3) var(--av-space-4);
      font-size: var(--av-fs-sm); }

    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
    [hidden] { display: none !important; }
    body.av-page :focus-visible { outline: none; box-shadow: var(--av-shadow-focus); }
  </style>
</head>
<body class="av-page">
  <aver-chrome active="class"></aver-chrome>

  <main class="mc-shell">
    <div class="mc-note" id="mc-loading">Đang tải lớp của bạn…</div>

    <!-- Không thuộc lớp nào: một trạng thái bình thường, không phải lỗi. -->
    <section id="mc-noclass" hidden>
      <header class="mc-head">
        <h1>Lớp của tôi</h1>
      </header>
      <div class="mc-empty">
        Bạn chưa được xếp vào lớp nào. Khi giảng viên thêm bạn vào lớp, bài tập và
        nội dung buổi học sẽ hiện ở đây.
      </div>
    </section>

    <div id="mc-content" hidden>
      <header class="mc-head">
        <h1 id="mc-class-name">Lớp của tôi</h1>
        <div class="mc-course" id="mc-course"></div>
      </header>

      <div class="mc-warn" id="mc-degraded" hidden></div>

      <!-- Đếm ngược tới hạn gần nhất — chỉ hiện khi thật sự còn bài chưa nộp. -->
      <section class="mc-due-now" id="mc-due-now" hidden>
        <div>
          <h2 id="mc-due-title">—</h2>
          <p class="mc-item-sub" id="mc-due-sub"></p>
        </div>
        <div>
          <div class="mc-countdown" id="mc-countdown" role="timer" aria-live="polite">—</div>
          <div class="mc-countdown-label" id="mc-countdown-label"></div>
        </div>
        <button class="mc-btn" id="mc-due-start" type="button">Làm bài</button>
      </section>

      <!-- NHỊP LỚP — 14 ngày gần nhất, mỗi ngày một vạch.
           Lớp giao bài gần như mỗi ngày, nên câu hỏi thật của học viên không
           phải "hạn hôm nay là mấy giờ" mà là "mình có đang đều không". Bốn ô
           thống kê trả lời được câu đầu, không trả lời được câu sau. -->
      <section class="mc-rhythm" id="mc-rhythm" hidden aria-label="Nhịp nộp bài 14 ngày gần nhất">
        <span class="mc-rhythm__label">Nhịp 14 ngày</span>
        <span class="mc-rhythm__row" id="mc-rhythm-row"></span>
        <span class="mc-rhythm__note" id="mc-rhythm-note"></span>
      </section>

      <section class="mc-stats" id="mc-stats"></section>

      <section class="mc-group" id="mc-group-missing" hidden>
        <h2>Quá hạn chưa nộp</h2>
        <div class="mc-list" id="mc-missing"></div>
      </section>

      <section class="mc-group" id="mc-group-todo" hidden>
        <h2>Cần nộp</h2>
        <div class="mc-list" id="mc-todo"></div>
      </section>

      <section class="mc-group" id="mc-group-done" hidden>
        <h2>Đã nộp</h2>
        <div class="mc-list" id="mc-done"></div>
      </section>

      <section class="mc-group" id="mc-group-empty" hidden>
        <h2>Bài tập</h2>
        <div class="mc-empty">Chưa có bài tập nào. Khi giảng viên giao bài, bài sẽ hiện ở đây.</div>
      </section>

      <section class="mc-group" id="mc-group-lessons" hidden>
        <h2>Buổi học</h2>
        <div class="mc-list" id="mc-lessons"></div>
      </section>
    </div>
  </main>

  <script type="module" src="/js/components/aver-chrome.js"></script>
  <script type="module" src="/js/my-class.js"></script>
</body>
</html>
