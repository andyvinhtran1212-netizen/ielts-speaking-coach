<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>Luyện nhanh — Aver Learning</title>

  <script>
    (function () {
      try {
        var stored = localStorage.getItem('av-theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = (stored === 'light' || stored === 'dark') ? stored : (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/aver-design/tokens.css" />
  <link rel="stylesheet" href="/css/aver-design/components.css" />
  <link rel="stylesheet" href="/css/listening.css" />

  <script src="https://unpkg.com/@supabase/supabase-js@2.107.0" defer></script>
  <script src="/js/runtime-config.js"></script>
  <script src="/js/api.js"></script>
  <script type="module" src="/js/components/aver-chrome.js"></script>

  <link rel="stylesheet" href="/css/listening-practice.css" />
</head>
<body class="av-page">

  <aver-chrome active="listening"></aver-chrome>

  <div class="shell">
    <main class="lp-shell">
      <header class="lp-header">
        <p class="eyebrow">
          <a href="/listening" style="color: var(--av-text-secondary);">← Quay lại Listening</a>
        </p>
        <h1>Luyện <span class="accent">nhanh</span></h1>
        <p class="subtitle">
          Bài ngắn 30–90 giây, thông tin dày. Không mô phỏng nhịp phòng thi —
          mục tiêu là bắt đúng chi tiết và nhận ra bẫy, làm được vài bài trong
          lúc chờ.
        </p>
      </header>

      <nav class="lp-tabs" id="practice-tabs" aria-label="Nhóm bài luyện"></nav>

      <div class="empty-state" id="state-loading">Đang tải…</div>
      <div class="empty-state" id="state-empty" hidden>
        <p><strong>Chưa có bài luyện nào.</strong></p>
        <p>Hãy quay lại sau khi quản trị viên đăng nội dung.</p>
      </div>
      <div class="error-banner" id="state-error" hidden></div>

      <div id="practice-body" hidden>
        <div id="practice-panel"></div>
      </div>
    </main>
  </div>

  <script type="module" src="/js/listening-practice.js"></script>
</body>
</html>
