<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>Luyện nhanh — Aver Learning</title>

  <script>
    (function () {
      try {
        var stored = localStorage.getItem('av-theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = (stored === 'light' || stored === 'dark') ? stored : (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/aver-design/tokens.css" />
  <link rel="stylesheet" href="/css/aver-design/components.css" />
  <link rel="stylesheet" href="/css/listening.css" />

  <script src="https://unpkg.com/@supabase/supabase-js@2.107.0" defer></script>
  <script src="/js/runtime-config.js"></script>
  <script src="/js/api.js"></script>
  <script type="module" src="/js/components/aver-chrome.js"></script>

  <style>
    .lp-shell {
      max-width: 960px; margin: 0 auto;
      padding: 0 var(--av-space-6);
      display: flex; flex-direction: column; gap: var(--av-space-6);
    }
    .lp-header h1 { font-size: var(--av-fs-3xl); margin-bottom: var(--av-space-2); }
    .lp-header .accent { color: var(--av-brand-teal-700); }
    .lp-header .subtitle {
      color: var(--av-text-secondary); font-size: var(--av-fs-base);
      line-height: var(--av-lh-normal); max-width: 62ch;
    }
    .lp-tabs {
      display: flex; gap: var(--av-space-2); flex-wrap: wrap;
      border-bottom: 1px solid var(--av-border-default);
      padding-bottom: var(--av-space-2);
    }
    .lp-tab {
      display: inline-flex; align-items: center; gap: var(--av-space-2);
      padding: var(--av-space-2) var(--av-space-4);
      border: 1px solid transparent; border-radius: var(--av-radius-md);
      background: transparent; color: var(--av-text-secondary);
      font-size: var(--av-fs-sm); font-weight: var(--av-fw-medium);
      font-family: inherit; cursor: pointer;
    }
    .lp-tab:hover { background: var(--av-brand-teal-50); color: var(--av-brand-teal-800); }
    .lp-tab.is-active {
      background: var(--av-brand-teal-700); color: var(--av-text-on-primary);
      border-color: var(--av-brand-teal-700);
    }
    .lp-tab-count {
      font-family: var(--av-font-mono); font-size: var(--av-fs-xs); opacity: 0.8;
    }
    .lp-lede {
      color: var(--av-text-secondary); font-size: var(--av-fs-sm);
      line-height: var(--av-lh-relaxed); margin: 0 0 var(--av-space-4); max-width: 68ch;
    }
    .lp-group { margin-bottom: var(--av-space-8); }
    .lp-group-title {
      display: flex; align-items: baseline; gap: var(--av-space-3);
      font-size: var(--av-fs-lg); font-weight: var(--av-fw-semibold);
      color: var(--av-text-primary); margin: 0 0 var(--av-space-3);
    }
    .lp-group-count {
      font-family: var(--av-font-mono); font-size: var(--av-fs-xs);
      color: var(--av-text-muted); font-weight: var(--av-fw-regular);
    }
    .lt-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: var(--av-space-4);
    }
    .lt-card {
      padding: var(--av-space-4);
      border: 1px solid var(--av-border-default);
      border-radius: var(--av-radius-lg);
      background: var(--av-surface-card);
      display: flex; flex-direction: column; gap: var(--av-space-3); min-width: 0;
    }
    .lt-card-title {
      font-size: var(--av-fs-base); font-weight: var(--av-fw-semibold);
      color: var(--av-text-primary); word-break: break-word;
    }
    .lt-card-stats { font-size: var(--av-fs-sm); color: var(--av-text-secondary); }
    .lt-card-stats strong { color: var(--av-brand-teal-700); }
    .lt-card-cta {
      margin-top: auto; padding: var(--av-space-2) var(--av-space-4);
      border-radius: var(--av-radius-md);
      background: var(--av-brand-teal-700); color: var(--av-text-on-primary);
      text-align: center; font-weight: var(--av-fw-semibold);
      font-size: var(--av-fs-sm); text-decoration: none;
    }
    .lt-card-cta:hover { background: var(--av-brand-teal-800); }
    .lt-card-cta.secondary {
      background: transparent; color: var(--av-brand-teal-700);
      border: 1px solid var(--av-brand-teal-200);
    }
    .empty-state {
      padding: var(--av-space-8); text-align: center;
      border: 1px dashed var(--av-border-default);
      border-radius: var(--av-radius-lg); color: var(--av-text-secondary);
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body class="av-page">

  <aver-chrome active="listening"></aver-chrome>

  <div class="shell">
    <main class="lp-shell">
      <header class="lp-header">
        <p class="eyebrow">
          <a href="/pages/listening.html" style="color: var(--av-text-secondary);">← Quay lại Listening</a>
        </p>
        <h1>Luyện <span class="accent">nhanh</span></h1>
        <p class="subtitle">
          Bài ngắn 30–90 giây, thông tin dày. Không mô phỏng nhịp phòng thi —
          mục tiêu là bắt đúng chi tiết và nhận ra bẫy, làm được vài bài trong
          lúc chờ.
        </p>
      </header>

      <nav class="lp-tabs" id="practice-tabs" aria-label="Nhóm bài luyện"></nav>

      <div class="empty-state" id="state-loading">Đang tải…</div>
      <div class="empty-state" id="state-empty" hidden>
        <p><strong>Chưa có bài luyện nào.</strong></p>
        <p>Hãy quay lại sau khi quản trị viên đăng nội dung.</p>
      </div>
      <div class="error-banner" id="state-error" hidden></div>

      <div id="practice-body" hidden>
        <div id="practice-panel"></div>
      </div>
    </main>
  </div>

  <script type="module" src="/js/listening-practice.js"></script>
</body>
</html>
