<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>Bài tập Grammar — Aver Learning</title>

  <!-- Anti-flash theme bootstrap (must run before stylesheets). -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('av-theme');
        var theme = (stored === 'light' || stored === 'dark') ? stored
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Lora:wght@400;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/css/aver-design/tokens.css" />
  <link rel="stylesheet" href="/css/aver-design/components.css" />
  <link rel="stylesheet" href="/css/ds.css" />
  <link rel="stylesheet" href="/css/grammar-wiki.css" />
  <link rel="stylesheet" href="/css/tailwind.build.css" />

  <script type="module" src="/js/components/aver-chrome.js"></script>
</head>
<body class="av-page min-h-screen font-sans antialiased">

  <aver-chrome active="grammar"></aver-chrome>

  <main class="av-w-page py-8">
    <header class="mb-8">
      <nav class="text-sm text-white/40 mb-3">
        <a href="/grammar" class="hover:text-white/70">Grammar Wiki</a>
        <span class="mx-1">/</span>
        <span class="text-white/60">Bài tập</span>
      </nav>
      <h1 class="text-3xl font-extrabold text-white mb-2">Bài tập Grammar</h1>
      <p class="text-white/45">Kiểm tra kiến thức ngữ pháp theo từng bài — làm tới khi thành thạo.</p>
    </header>

    <div id="ex-skeleton" class="text-white/40 py-12 text-center">Đang tải bài tập…</div>
    <div id="ex-empty" class="hidden text-white/40 py-12 text-center">
      Chưa có bài tập nào được mở. Vui lòng quay lại sau.
    </div>
    <div id="ex-groups" class="hidden flex flex-col gap-8"></div>
  </main>

  <script src="/js/runtime-config.js"></script>
  <script src="/js/api.js"></script>
  <script type="module">
    // Logic đã tách sang `/js/grammar-exercises.js` để bản Next chạy CHÍNH mã
    // này chứ không chép lại.
    import { mount } from '/js/grammar-exercises.js';
    mount();
  </script>
</body>
</html>
