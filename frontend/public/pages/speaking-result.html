<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>Nhận xét Speaking — Aver Learning</title>
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('av-theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = (stored === 'light' || stored === 'dark') ? stored : (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/aver-design/tokens.css" />
  <link rel="stylesheet" href="/css/aver-design/components.css" />
  <link rel="stylesheet" href="/css/tailwind.build.css" />
  <script type="module" src="/js/components/aver-chrome.js"></script>
  <style>
    /* Trang chi tiết nhận xét Speaking thi TRỰC TIẾP — đích của thẻ số 4 trên
       trang kết quả (mock-result). Tách trang riêng cho nhất quán với chữa bài
       L/R/W (mỗi kỹ năng một trang), theo bản duyệt Explorations/trf-result-v2. */
    .spr-wrap { max-width: var(--av-width-read, 760px); margin: 0 auto;
      padding: var(--av-space-8) var(--av-space-4) var(--av-space-16); }
    .spr-state { padding: var(--av-space-16) 0; text-align: center;
      color: var(--av-text-secondary); }
    .spr-state--error { color: var(--av-error); }
    .spr-back { display: inline-flex; align-items: center; gap: var(--av-space-1);
      color: var(--av-text-muted); font-size: var(--av-fs-sm); text-decoration: none;
      margin-bottom: var(--av-space-4); }
    .spr-back:hover { color: var(--av-text-primary); }
    .spr-eyebrow { font-size: var(--av-fs-xs); text-transform: uppercase;
      letter-spacing: var(--av-tracking-wide); color: var(--av-text-faint);
      font-weight: var(--av-fw-semibold); }
    .spr-h1 { font-size: var(--av-fs-2xl); font-weight: var(--av-fw-bold);
      line-height: var(--av-lh-snug); margin: var(--av-space-1) 0 var(--av-space-1);
      color: var(--av-text-primary); }
    .spr-meta { color: var(--av-text-muted); font-size: var(--av-fs-sm);
      margin-bottom: var(--av-space-4); }
    /* Lời giáo viên — trích dẫn mở đầu, đúng nếp bản duyệt */
    .spr-quote { background: var(--av-surface-card); border: 1px solid var(--av-border-default);
      border-left: 4px solid var(--av-primary); border-radius: var(--av-radius-md);
      padding: var(--av-space-4); line-height: var(--av-lh-relaxed);
      color: var(--av-text-primary); white-space: pre-wrap; }
    .spr-h2 { font-size: var(--av-fs-lg); font-weight: var(--av-fw-semibold);
      color: var(--av-text-primary); margin: var(--av-space-8) 0 var(--av-space-3);
      padding-left: var(--av-space-3); border-left: 3px solid var(--av-primary); }
    .spr-band-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: var(--av-space-2); }
    .spr-band { background: var(--av-surface-card); border: 1px solid var(--av-border-default);
      border-radius: var(--av-radius-md); padding: var(--av-space-4) var(--av-space-3);
      text-align: center; }
    .spr-band-label { font-size: var(--av-fs-xs); text-transform: uppercase;
      letter-spacing: var(--av-tracking-wide); color: var(--av-text-faint);
      font-weight: var(--av-fw-semibold); }
    .spr-band-val { font-size: var(--av-fs-2xl); font-weight: var(--av-fw-bold);
      color: var(--av-text-primary); font-family: var(--av-font-mono);
      font-variant-numeric: tabular-nums; margin-top: var(--av-space-1); }
    .spr-band-meter { height: 4px; border-radius: var(--av-radius-pill);
      background: var(--av-border-subtle); margin-top: var(--av-space-2); overflow: hidden; }
    .spr-band-meter > span { display: block; height: 100%;
      background: var(--av-primary); border-radius: inherit; }
    .spr-metrics { width: 100%; border-collapse: collapse; font-size: var(--av-fs-sm); }
    .spr-metrics th, .spr-metrics td { text-align: left;
      padding: var(--av-space-2) var(--av-space-3);
      border-bottom: 1px solid var(--av-border-subtle); color: var(--av-text-secondary); }
    .spr-metrics th { color: var(--av-text-muted); font-weight: var(--av-fw-semibold); }
    .spr-metrics td:nth-child(2) { color: var(--av-text-primary);
      font-family: var(--av-font-mono); }
    .spr-metrics td:nth-child(3) { font-family: var(--av-font-mono); }
    .spr-note { background: var(--av-surface-card); border: 1px solid var(--av-border-default);
      border-radius: var(--av-radius-md); padding: var(--av-space-4);
      margin-bottom: var(--av-space-3); }
    .spr-note__title { font-weight: var(--av-fw-semibold); color: var(--av-text-primary);
      font-size: var(--av-fs-sm); }
    .spr-note__body { color: var(--av-text-secondary); line-height: var(--av-lh-relaxed);
      white-space: pre-wrap; margin-top: var(--av-space-1); }
    .spr-note__advice { color: var(--av-text-primary); line-height: var(--av-lh-relaxed);
      white-space: pre-wrap; margin-top: var(--av-space-2); }
  </style>
</head>
<body class="av-page font-sans min-h-screen">
  <aver-chrome active="home"></aver-chrome>

  <div class="spr-wrap">
    <div id="state-loading" class="spr-state">Đang tải nhận xét…</div>
    <div id="state-error" class="spr-state spr-state--error hidden"></div>
    <div id="state-content" class="hidden">
      <a class="spr-back" id="back-link" href="#">← Về trang kết quả</a>
      <div class="spr-eyebrow">Speaking · thi trực tiếp với giáo viên</div>
      <h1 class="spr-h1">Nhận xét chi tiết của giáo viên chấm</h1>
      <div class="spr-meta" id="spr-meta"></div>
      <div id="spr-body"></div>
    </div>
  </div>

  <script src="/js/runtime-config.js"></script>
  <script src="/js/api.js"></script>
  <script>
  (function () {
    'use strict';
    initSupabase('https://huwsmtubwulikhlmcirx.supabase.co', 'sb_publishable_hvevBST9lgIWRd5ITHtUpA_SYjiX6Ao');

    var $ = function (id) { return document.getElementById(id); };
    function showState(name) {
      ['loading', 'error', 'content'].forEach(function (s) {
        $('state-' + s).classList.toggle('hidden', s !== name);
      });
    }
    function fmtBand(v) { return (v == null || v === '') ? '—' : Number(v).toFixed(1); }
    function div(cls, text, parent) {
      var d = document.createElement('div');
      if (cls) d.className = cls;
      if (text != null) d.textContent = text;   // authored content — never innerHTML
      if (parent) parent.appendChild(d);
      return d;
    }

    function render(spk) {
      var host = $('spr-body');
      var meta = spk.meta || {};
      $('spr-meta').textContent = [meta.parts, meta.duration ? ('Bài thi dài ' + meta.duration) : null]
        .filter(Boolean).join(' · ');
      if (spk.intro) div('spr-quote', spk.intro, host);

      var h = div('spr-h2', 'Band theo từng tiêu chí', host); void h;
      var CRIT = [['fc', 'Fluency & Coherence'], ['lr', 'Lexical Resource'],
                  ['gra', 'Grammar'], ['p', 'Pronunciation']];
      var grid = div('spr-band-grid', null, host);
      CRIT.forEach(function (c) {
        var b = (spk.bands || {})[c[0]];
        if (b == null) return;
        var cell = div('spr-band', null, grid);
        div('spr-band-label', c[1], cell);
        div('spr-band-val', fmtBand(b), cell);
        var m = div('spr-band-meter', null, cell);
        m.setAttribute('aria-hidden', 'true');
        var fill = document.createElement('span');
        fill.style.width = Math.round(Math.min(9, Math.max(0, Number(b))) / 9 * 100) + '%';
        m.appendChild(fill);
      });

      var metrics = spk.metrics || [];
      if (metrics.length) {
        div('spr-h2', 'Số đo từ bản ghi buổi thi', host);
        var tbl = document.createElement('table'); tbl.className = 'spr-metrics';
        var tr0 = tbl.insertRow();
        ['', 'Của bạn', 'Trung bình lớp'].forEach(function (t) {
          var th = document.createElement('th'); th.textContent = t; tr0.appendChild(th);
        });
        metrics.forEach(function (mrow) {
          var tr = tbl.insertRow();
          [mrow.label, mrow.value, mrow.class_avg].forEach(function (t) {
            tr.insertCell().textContent = t == null ? '—' : t;
          });
        });
        host.appendChild(tbl);
      }

      if ((spk.sections || []).length) div('spr-h2', 'Nhận xét & cách luyện', host);
      (spk.sections || []).forEach(function (sec) {
        var box = div('spr-note', null, host);
        div('spr-note__title', sec.title, box);
        if (sec.body) div('spr-note__body', sec.body, box);
        if (sec.advice) div('spr-note__advice', 'Cách luyện: ' + sec.advice, box);
      });
    }

    async function boot() {
      var sittingId = new URLSearchParams(location.search).get('sitting');
      if (!sittingId) { $('state-error').textContent = 'Thiếu mã lượt thi.'; showState('error'); return; }
      $('back-link').href = '/pages/mock-result.html?sitting=' + encodeURIComponent(sittingId);
      try {
        var data = await window.api.get('/api/mock-exams/sittings/' + encodeURIComponent(sittingId) + '/result');
        var spk = (data.per_skill_notes || {}).speaking;
        if (!spk || typeof spk !== 'object') {
          $('state-error').textContent = 'Lượt thi này không có nhận xét Speaking.'; showState('error'); return;
        }
        render(spk);
        showState('content');
      } catch (e) {
        $('state-error').textContent = 'Không tải được nhận xét: ' + (e && e.message ? e.message : e);
        showState('error');
      }
    }
    boot();
  })();
  </script>
</body>
</html>
