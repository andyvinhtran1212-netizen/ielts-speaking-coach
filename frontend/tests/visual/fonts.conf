<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- UIBASE-0056 G03-T04 (FR-014). Chromium on Linux takes hinting and
     anti-aliasing from fontconfig, so the CI runner (Ubuntu: slight hinting)
     and a developer machine draw the same text differently. The visual tests
     run with FONTCONFIG_FILE pointing here: system fonts as usual, then no
     hinting and greyscale anti-aliasing everywhere. -->
<fontconfig>
  <include ignore_missing="no">/etc/fonts/fonts.conf</include>
  <match target="pattern">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
  </match>
</fontconfig>
