<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" role="img" aria-labelledby="title desc">
<title id="title">Westbury — sơ đồ trống khu phỏng vấn</title><desc id="desc">Phía bắc ở trên. Lối vào nằm ở phía tây; đi vào theo hướng đông. Hàng phòng phía trên từ tây sang đông là P, Q, R. Hàng phòng phía dưới từ tây sang đông là S, T, U. Bàn trưng bày nằm trong hành lang giữa cặp phòng ở giữa và cặp phòng xa nhất về phía đông. Các chữ cái là lựa chọn vị trí, không phải tên phòng.</desc>
<rect width="900" height="550" fill="white"/><g font-family="Arial, sans-serif" fill="#172b3a"><text x="40" y="40" font-size="24" font-weight="700">Westbury — khu phỏng vấn</text><text x="40" y="68" font-size="16">Lượt tham quan mới. Ghép vị trí với P–U. Sơ đồ không theo tỉ lệ.</text></g>
<path d="M854 146V103m0 0-7 12m7-12 7 12" fill="none" stroke="#172b3a" stroke-width="3"/><text x="847" y="96" font-family="Arial" font-size="20">N</text>
<rect x="80" y="240" width="750" height="90" fill="#f1f4f6" stroke="#172b3a" stroke-width="2"/>
<g fill="white" stroke="#172b3a" stroke-width="3"><rect x="120" y="110" width="180" height="130"/><rect x="360" y="110" width="180" height="130"/><rect x="600" y="110" width="180" height="130"/><rect x="120" y="330" width="180" height="130"/><rect x="360" y="330" width="180" height="130"/><rect x="600" y="330" width="180" height="130"/></g>
<g stroke="white" stroke-width="7"><path d="M192 240h36M432 240h36M672 240h36M192 330h36M432 330h36M672 330h36"/></g>
<g font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="middle" fill="#172b3a"><text x="210" y="184">P</text><text x="450" y="184">Q</text><text x="690" y="184">R</text><text x="210" y="405">S</text><text x="450" y="405">T</text><text x="690" y="405">U</text></g>
<rect x="565" y="264" width="42" height="33" rx="3" fill="#d4c2a7" stroke="#172b3a" stroke-width="2"/><text x="621" y="290" font-family="Arial" font-size="15">Bàn trưng bày</text>
<path d="M25 285h82m0 0-14-8m14 8-14 8" fill="none" stroke="#172b3a" stroke-width="3"/><text x="24" y="362" font-family="Arial" font-size="15" transform="rotate(-90 24 362)">Lối vào · nhìn về phía đông</text>
<text x="40" y="511" font-family="Arial" font-size="16">Xác định trái/phải theo hướng di chuyển của khách tham quan.</text></svg>
